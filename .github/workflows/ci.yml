# CI for fleet-board (plan row 1). It runs the same targets as `make gates`, one
# step each, so a failure names its gate. Every tool version comes from
# tool-versions.env (never spelled out here; scripts/check-versions.sh fails if
# one is). Text that an author controls (the PR title and body, the base branch
# name) reaches a script only through env vars, never through ${{ }} inside the
# script text; the Makefile reads BASE_REF quoted from the environment
# (scripts/test-make-base-ref.sh proves a hostile value runs nothing).
name: ci

on:
  pull_request:
    # edited: the PR title and body are checked for AI attribution too.
    types: [opened, synchronize, reopened, edited]
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Changed packages are measured against the PR's base; a push to a branch
      # is measured against main.
      BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
    steps:
      - name: Check out (full history, for the merge base)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Nothing after checkout pushes; do not leave the token in .git/config.
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tools/tscheck/package-lock.json

      - name: Pinned versions agree with tool-versions.env
        run: scripts/check-versions.sh

      - name: Confirm the toolchain versions
        run: |
          . ./tool-versions.env
          go version
          node -v
          case "$(go env GOVERSION)" in
            "go$GO_VERSION" | "go$GO_VERSION".*) ;;
            *) echo "Go is $(go env GOVERSION), tool-versions.env wants $GO_VERSION" >&2; exit 1 ;;
          esac
          case "$(node -v)" in
            "v$NODE_MAJOR".*) ;;
            *) echo "Node is $(node -v), tool-versions.env wants major $NODE_MAJOR" >&2; exit 1 ;;
          esac

      - name: Build the pinned linters
        run: |
          . ./tool-versions.env
          make tools
          version_output="$(.bin/golangci-lint version)"
          echo "$version_output"
          case "$version_output" in
            *"built with go$GO_VERSION"*) ;;
            *) echo "golangci-lint must be built with go$GO_VERSION" >&2; exit 1 ;;
          esac
          .bin/gofumpt --version

      - name: Generate Go and TypeScript (buf generate)
        run: make gen

      - name: Contracts compile and lint (buf build, buf lint)
        run: make proto-check

      - name: go.mod and go.sum are tidy
        run: make mod-check

      - name: Go formatting (gofumpt)
        run: make fmt-check

      - name: Build every package and run each binary once (--version)
        run: make build smoke

      - name: go vet, go test and go test -race on changed packages
        run: make test

      - name: golangci-lint on changed packages
        run: make lint

      - name: Generated TypeScript compiles
        run: make ts-check

      - name: Workflow files (actionlint)
        run: make actionlint

      - name: File cap (500 lines)
        run: scripts/check-file-cap.sh

      - name: Agent canon
        run: scripts/verify-agent-canon.sh

      - name: Agent roles are rendered
        run: python3 scripts/agent-roles.py --check

      - name: No AI attribution in this change's commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE_SHA..$PR_HEAD_SHA"
          else
            range="$BASE_REF..HEAD"
          fi
          python3 scripts/check-attribution.py --range "$range"

      - name: No AI attribution in the PR title and body
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | python3 scripts/check-attribution.py --stdin

      - name: Gate scripts still fail on seeded violations (self-tests)
        run: make selftest

      - name: git diff --check
        run: make diff-check

      # Advisory: it prints reminders and never fails the build (ADR 0025,
      # plan row 1b makes it blocking later).
      - name: Docs staleness (advisory)
        continue-on-error: true
        run: python3 scripts/check-docs-stale.py
