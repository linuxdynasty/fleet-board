# CI for fleet-board (plan row 1). It runs the same targets as `make gates`, one
# step each, so a failure names its gate. Every tool version comes from
# tool-versions.env (never spelled out here; scripts/check-versions.sh fails if
# one is). Text that an author controls (here, the base branch name) reaches a
# script only through env vars, never through ${{ }} inside the script text; the
# Makefile reads BASE_REF quoted from the environment
# (scripts/test-make-base-ref.sh proves a hostile value runs nothing).
#
# One run per change (#107): pull requests, and pushes to main after a merge. A
# branch push runs nothing here; its PR does. Editing a PR (title, body or base)
# starts no run here; pr-meta.yml reruns its quick checks on every edit. The
# gates job fails first thing on a PR whose base is not main. On a push to main
# the gates test and lint every package, and a failure opens or updates the
# ci-failure issue (the report job).
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR cancels its older run. Each push to main gets a group of
# its own (its commit SHA), so every merge gets its own full run and none is
# cancelled or dropped from the queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A PR is measured against its base. A push to main is measured against
      # the commit main was at before the push (github.event.before), so make
      # test and make lint cover what the merge changed. When that is the
      # all-zero SHA (main was just created) or a commit this clone lacks (a
      # force push), or it is missing, it names no commit, and
      # changed-go-packages.sh then tests every package: the safe choice.
      BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before || '0000000000000000000000000000000000000000' }}
    steps:
      - name: Check out (full history, for the merge base)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Nothing after checkout pushes; do not leave the token in .git/config.
          persist-credentials: false

      # Before any setup, so a wrong base fails in seconds. Changing the base
      # starts no run here, and a rerun of this job reuses the original event
      # data (github.base_ref included): the fix is to retarget, then push.
      - name: The pull request targets main
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_REF: ${{ github.base_ref }}
        run: scripts/check-pr-base.sh

      - name: Set up Go from go.mod
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The pinned linters in .bin/ take minutes to build. The key changes with
      # any pin or the Go version; the stamp files make tools checks still
      # rebuild a tool whose version or Go does not match.
      - name: Restore the pinned linters (.bin/)
        uses: actions/cache@v6
        with:
          path: .bin
          key: bin-${{ runner.os }}-${{ hashFiles('tool-versions.env') }}-go${{ steps.setup-go.outputs.go-version }}

      - name: Set up Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tools/tscheck/package-lock.json

      - name: Pinned versions agree with tool-versions.env
        run: scripts/check-versions.sh

      - name: Confirm the toolchain versions
        run: |
          . ./tool-versions.env
          go version
          node -v
          case "$(go env GOVERSION)" in
            "go$GO_VERSION" | "go$GO_VERSION".*) ;;
            *) echo "Go is $(go env GOVERSION), tool-versions.env wants $GO_VERSION" >&2; exit 1 ;;
          esac
          case "$(node -v)" in
            "v$NODE_MAJOR".*) ;;
            *) echo "Node is $(node -v), tool-versions.env wants major $NODE_MAJOR" >&2; exit 1 ;;
          esac

      - name: Build the pinned linters
        run: |
          . ./tool-versions.env
          make tools
          version_output="$(.bin/golangci-lint version)"
          echo "$version_output"
          case "$version_output" in
            *"built with go$GO_VERSION"*) ;;
            *) echo "golangci-lint must be built with go$GO_VERSION" >&2; exit 1 ;;
          esac
          .bin/gofumpt --version
          go version -m .bin/govulncheck | awk '$1 == "mod" { print "govulncheck " $3 }'

      - name: Generate Go and TypeScript (buf generate)
        run: make gen

      - name: Contracts compile and lint (buf build, buf lint)
        run: make proto-check

      - name: Every backticked proto name in the docs is in api/fleet
        run: make doc-names

      - name: Generated spec tables match the proto comment tags
        run: make doc-tables

      - name: Every telemetry name in the code is in its spec (telemetry-docs.json)
        run: make telemetry-names

      # A report until plan row 17: findings exit 0, a broken input fails.
      - name: v1 capabilities no product test names (report)
        run: make capability-tests

      - name: go.mod and go.sum are tidy
        run: make mod-check

      - name: Go formatting (gofumpt)
        run: make fmt-check

      - name: Build every package and run each binary once (--version)
        run: make build smoke

      # A push to main tests and lints every package, not only the changed
      # ones: two PRs that pass alone can break a package neither touched once
      # both are on main. The all-zero SHA names no commit, and for it
      # changed-go-packages.sh names every package.
      - name: go vet, go test and go test -race (changed packages; every package on main)
        env:
          BASE_REF: ${{ github.event_name == 'push' && '0000000000000000000000000000000000000000' || env.BASE_REF }}
        run: make test

      - name: golangci-lint (changed packages; every package on main)
        env:
          BASE_REF: ${{ github.event_name == 'push' && '0000000000000000000000000000000000000000' || env.BASE_REF }}
        run: make lint

      # Every package, not only the changed ones: a new advisory can land on
      # unchanged code. Exit 3 means a reachable known vulnerability.
      - name: Known vulnerabilities (govulncheck)
        run: make vuln

      - name: Generated TypeScript compiles
        run: make ts-check

      - name: Workflow files (actionlint)
        run: make actionlint

      - name: File cap (500 lines)
        run: scripts/check-file-cap.sh

      - name: Agent canon
        run: scripts/verify-agent-canon.sh

      - name: Agent roles are rendered
        run: python3 scripts/agent-roles.py --check

      # A push to main checks the commits the push added (before..HEAD). When
      # BASE_REF names no commit here (see the job env) it checks the one
      # commit at HEAD, never the whole history: older history keeps its
      # trailers.
      - name: No AI attribution in this change's commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE_SHA..$PR_HEAD_SHA"
          elif git rev-parse --verify -q "$BASE_REF^{commit}" > /dev/null; then
            range="$BASE_REF..HEAD"
          else
            echo "attribution: $BASE_REF is not a commit in this clone; checking HEAD~1..HEAD only."
            range="HEAD~1..HEAD"
          fi
          python3 scripts/check-attribution.py --range "$range"

      - name: Gate scripts still fail on seeded violations (self-tests)
        run: make selftest

      - name: git diff --check
        run: make diff-check

      # Plan row 1b: a mapped code change changes its spec or a commit says
      # No-Doc-Change: <reason>. Same range as the attribution step; make
      # docs-stale-ci runs the same check with BASE_REF..HEAD. Pull requests
      # only: the PR already gated it, and on a push to main a No-Doc-Change
      # trailer can be lost when the squash-merge message is edited.
      - name: Docs move with the code (doc-paths.json, package docs)
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check-docs-stale.py --ci --range "$PR_BASE_SHA..$PR_HEAD_SHA"

      # #107: the benchmarks of the changed packages at the merge base and at
      # the head, on this one runner, compared by benchstat. A report for the
      # reviewer in the job summary, never a gate: a shared runner is too noisy
      # to fail a build on time, and REVIEW rows only ask a person to look.
      - name: Benchmarks, base vs head (report)
        if: github.event_name == 'pull_request'
        timeout-minutes: 8
        continue-on-error: true
        shell: bash
        run: make -s bench-report | tee -a "$GITHUB_STEP_SUMMARY"

  # Pushes to main only: open, update or close this workflow's ci-failure issue
  # (scripts/ci-report-failure.sh). The only job with write access, and only to
  # issues. One report at a time, so two failing merges cannot open two issues.
  # GitHub keeps one waiting job per group: when three reports queue at once
  # the middle one is cancelled, and the newest run's result stands.
  report:
    needs: [gates]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: ci-failure-report-${{ github.workflow }}
      cancel-in-progress: false
    steps:
      - name: Check out the reporter
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci-report-failure.sh
          sparse-checkout-cone-mode: false

      - name: Open, update or close the ci-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: scripts/ci-report-failure.sh
