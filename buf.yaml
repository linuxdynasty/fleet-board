# buf configuration for the fleet-board contracts (ADR 0003, 0017, 0019).
# Run from the repository root:
#   go run github.com/bufbuild/buf/cmd/buf@v1.73.0 build
#   go run github.com/bufbuild/buf/cmd/buf@v1.73.0 lint
#   go run github.com/bufbuild/buf/cmd/buf@v1.73.0 generate   (buf.gen.yaml)
# The contracts are unfrozen until the v0.1 tag (ADR 0019), so `breaking` is
# not run yet. From the tag on, CI runs
#   buf breaking --against '.git#tag=v0.1'
# v0.1 freezes everything v1 implements (ADR 0025, decision 4): when the tag
# is cut, `breaking.ignore_only` lists the v3-only files (02e, "What v0.1
# freezes") and the list is emptied when v3 is tagged.
version: v2
modules:
  - path: api
lint:
  use:
    - STANDARD
breaking:
  # WIRE_JSON: the hub API is served as Connect JSON to browsers and the CLI,
  # so a field rename breaks clients even though the binary wire is unchanged.
  use:
    - WIRE_JSON
