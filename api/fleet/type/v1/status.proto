// fleet.type.v1 status: Percent with an explicit unknown, the shared result
// Status and ReasonCode, capabilities, roles and principals. The agent
// returns these in command results; the hub API shows them unchanged.
syntax = "proto3";

package fleet.type.v1;

import "fleet/type/v1/ids.proto";
import "google/protobuf/duration.proto";

// ---------------------------------------------------------------------------
// Percent with an explicit unknown. Never 0-as-unknown.
// ---------------------------------------------------------------------------

// Percent is an integer 0..100 or an explicit unknown with a reason.
message Percent {
  oneof kind {
    // 0..100 inclusive. Values above 100 are rejected by the hub.
    uint32 value = 1;
    PercentUnknown unknown = 2;
  }
}

// PercentUnknown says why a percentage could not be read.
message PercentUnknown {
  UnknownReason reason = 1;
}

// UnknownReason explains an unknown reading. The hub never schedules on an
// unknown value (design.md dispatch rules).
enum UnknownReason {
  UNKNOWN_REASON_UNSPECIFIED = 0;
  // The screen did not parse with the fixtures for this harness version.
  UNKNOWN_REASON_PARSE_FAILED = 1;
  // The harness did not show this value at all (for example no short window).
  UNKNOWN_REASON_NOT_SHOWN = 2;
  // The harness version is outside the parser's SupportedVersions (C1).
  UNKNOWN_REASON_HARNESS_VERSION_UNSUPPORTED = 3;
  // The probe session could not run the usage command (D1 health).
  UNKNOWN_REASON_PROBE_FAILED = 4;
}

// ---------------------------------------------------------------------------
// Status and reason codes.
// ---------------------------------------------------------------------------

// Status is the single result status for commands and composite steps.
enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_OK = 1;
  // Attempted and failed; reason says why.
  STATUS_FAILED = 2;
  // Arrived after not_after_time (hub time); nothing was done.
  STATUS_EXPIRED = 3;
  // Local policy or the effective settings refused it; nothing was done.
  STATUS_REJECTED_BY_POLICY = 4;
  // The agent does not advertise the capability this command needs.
  STATUS_UNSUPPORTED = 5;
  // The agent cannot tell whether the effect happened (SendKeys after a
  // crash, UI must ask a person). Never retried automatically.
  STATUS_UNKNOWN_OUTCOME = 6;
  // Waiting for `fleet-agent approve <command_id>` before not_after_time.
  STATUS_AWAITING_LOCAL_CONFIRM = 7;
}

// ReasonCode is the shared structured reason for preflight refusals,
// command failures and policy rejections. Values 1..99 are preflight (I1);
// 100..199 command execution; 200..299 envelope and policy; 300..399 goal
// composite steps; 400..499 probes and parsing.
enum ReasonCode {
  REASON_CODE_UNSPECIFIED = 0;

  // Preflight (I1), also used by StartGoal's preflight step.
  REASON_CODE_HARNESS_NOT_INSTALLED = 1;
  REASON_CODE_HARNESS_VERSION_UNSUPPORTED = 2;
  REASON_CODE_HARNESS_NOT_SIGNED_IN = 3;
  REASON_CODE_ACCOUNT_MISMATCH = 4;
  REASON_CODE_PUSH_ACCESS_MISSING = 5;
  REASON_CODE_CHECKOUT_MISSING = 6;
  REASON_CODE_FOLDER_UNTRUSTED = 7;
  REASON_CODE_WORKTREE_DIRTY = 8;
  REASON_CODE_DISK_LOW = 9;
  REASON_CODE_TMUX_TOO_OLD = 10;
  REASON_CODE_TMUX_SERVER_DOWN = 11;
  REASON_CODE_ON_BATTERY_BLOCKED = 12;
  REASON_CODE_POLICY_DENIED = 13;
  REASON_CODE_DRAINING = 14;
  REASON_CODE_SLOTS_FULL = 15;
  // GoalSpec.profile (or EnsureProbe.profile) names a harness profile the
  // machine does not have. Empty profile always means the harness default.
  REASON_CODE_HARNESS_PROFILE_MISSING = 16;

  // Command execution.
  REASON_CODE_SESSION_NOT_FOUND = 100;
  REASON_CODE_WINDOW_NOT_FOUND = 101;
  REASON_CODE_PANE_NOT_FOUND = 102;
  // The prompt named by prompt_id is no longer on screen (F3).
  REASON_CODE_PROMPT_GONE = 103;
  // The pane's input line is not empty or a turn is running (F8, G3, E11).
  REASON_CODE_PANE_BUSY = 104;
  // The session is not idle/available any more (E11 re-check before typing).
  REASON_CODE_SESSION_NOT_AVAILABLE = 105;
  // The command is not in the machine's catalog (C4).
  REASON_CODE_COMMAND_NOT_IN_CATALOG = 106;
  // The command's class is not allowed for the requester or by local policy.
  REASON_CODE_COMMAND_CLASS_DENIED = 107;
  // The catalog_hash in the request does not match the current catalog.
  REASON_CODE_CATALOG_STALE = 108;
  REASON_CODE_RATE_LIMITED = 109;
  REASON_CODE_MAX_WINDOWS_REACHED = 110;
  REASON_CODE_INVALID_NAME = 111;
  REASON_CODE_INVALID_ARGUMENT = 112;
  // The requested harness is not allowed by local policy or settings.
  REASON_CODE_HARNESS_NOT_ALLOWED = 113;
  // The repo root is not in the allowed set, or the path escapes it.
  REASON_CODE_REPO_ROOT_NOT_ALLOWED = 114;
  REASON_CODE_WORKTREE_EXISTS = 115;
  REASON_CODE_GIT_FAILED = 116;
  REASON_CODE_HOOKS_INSTALL_FAILED = 117;
  REASON_CODE_ATTACH_NOT_FOUND = 118;
  REASON_CODE_INTERNAL = 119;

  // Envelope and policy.
  REASON_CODE_EXPIRED = 200;
  REASON_CODE_EPOCH_MISMATCH = 201;
  REASON_CODE_SEQ_REPLAYED = 202;
  REASON_CODE_SIGNATURE_INVALID = 203;
  REASON_CODE_CAPABILITY_MISSING = 204;
  REASON_CODE_LOCAL_CONFIRM_TIMEOUT = 205;
  REASON_CODE_LOCAL_DENIED = 206;
  // The requester's role is below what this kind or class needs.
  REASON_CODE_ROLE_INSUFFICIENT = 207;

  // Goal composite steps (G3) and goal control (G4).
  REASON_CODE_READY_TIMEOUT = 300;
  REASON_CODE_GOAL_FILE_NOT_SEEN = 301;
  REASON_CODE_GOAL_NOT_RUNNING = 302;
  // 303 was STOP_TIMEOUT for the removed StopGoal composite; unused.
  REASON_CODE_TRUST_PROMPT_SEEN = 304;
  // The harness's /goal has no such subcommand (for example pause on
  // Claude Code 2.1.286, which offers only set and clear).
  REASON_CODE_GOAL_SUBCOMMAND_UNSUPPORTED = 305;
  // GoalSpec.fresh_context on a session the fleet did not start; /clear is
  // destructive (01b) and is never typed into the developer's own session.
  REASON_CODE_FRESH_CONTEXT_NOT_ALLOWED = 306;

  // Probes and parsing (D1, D2).
  REASON_CODE_PROBE_START_FAILED = 400;
  REASON_CODE_PROBE_COMMAND_TIMEOUT = 401;
  REASON_CODE_PARSE_FAILED = 402;

  // Hub API (fleet.hub.v1), carried in ErrorDetail.reason of an RPC error.
  // expected_version did not match the resource's current version.
  REASON_CODE_VERSION_MISMATCH = 500;
  // request_id was already used with a different request body.
  REASON_CODE_REQUEST_ID_CONFLICT = 501;
  // The caller's role or device scopes do not cover this RPC.
  REASON_CODE_SCOPE_MISSING = 502;
  // The approval expired (fallback applied) or was already decided.
  REASON_CODE_APPROVAL_CLOSED = 503;
  // The pairing code shown on the device does not match.
  REASON_CODE_PAIRING_CODE_MISMATCH = 504;
  // The device is revoked or not yet approved.
  REASON_CODE_DEVICE_NOT_ACTIVE = 505;
  // page_token is malformed, from another query, or older than 10 minutes.
  // The client reloads the list from the first page.
  REASON_CODE_PAGE_TOKEN_INVALID = 506;
  // resume_token is malformed or from another fleet. (A well-formed token
  // the hub cannot honour is not an error: it is RESYNC_REQUIRED.)
  REASON_CODE_RESUME_TOKEN_INVALID = 507;
  // filter does not parse or names a field outside the resource's filter
  // catalogue (02c-hub-watch-and-filters.md); the violations say which.
  REASON_CODE_FILTER_INVALID = 508;
  // order_by names a field the resource does not sort by.
  REASON_CODE_ORDER_BY_INVALID = 509;
  // update_mask is empty, names a field that does not exist, an output-only
  // field (status.*, id, version) or a field not updatable on this resource.
  REASON_CODE_UPDATE_MASK_INVALID = 510;
  // A mutating request without request_id.
  REASON_CODE_REQUEST_ID_MISSING = 511;
  // The id names no resource the caller may see (also for resources the
  // caller's scopes hide, so ids cannot be probed).
  REASON_CODE_RESOURCE_NOT_FOUND = 512;
  // Create with an id or unique name that already exists.
  REASON_CODE_RESOURCE_ALREADY_EXISTS = 513;
  // The action needs a live agent connection (attach, capture) and the
  // machine is OFFLINE or STALE. retryable; actions that queue (SendKeys)
  // return an Operation instead.
  REASON_CODE_MACHINE_OFFLINE = 514;
  // No credentials, or credentials the hub does not know.
  REASON_CODE_CREDENTIALS_INVALID = 515;
  // The credentials were valid and have expired: the client signs in again.
  REASON_CODE_CREDENTIALS_EXPIRED = 516;
  // ControlGoalRequest.expected_phase does not match the goal's phase.
  REASON_CODE_GOAL_PHASE_CHANGED = 517;
  // A one-time secret (enrollment token) was already delivered for this
  // request_id and is not stored; create a new one.
  REASON_CODE_SECRET_ALREADY_DELIVERED = 518;
  // A field is over its limit (02b-hub-api.md, "Size limits").
  REASON_CODE_FIELD_TOO_LARGE = 519;
  // The pairing request expired before the owner approved it.
  REASON_CODE_PAIRING_EXPIRED = 520;
}

// AttachCloseReason says why a terminal attach ended (J1). Used by the
// agent's Terminal stream and the hub's AttachTerminal, so a browser can tell
// "idle, reconnect" from "session gone" without parsing text.
enum AttachCloseReason {
  ATTACH_CLOSE_REASON_UNSPECIFIED = 0;
  // No input or output for attach_idle_timeout.
  ATTACH_CLOSE_REASON_IDLE_TIMEOUT = 1;
  // The tmux session or window the attach viewed ended.
  ATTACH_CLOSE_REASON_SESSION_ENDED = 2;
  // The hub closed it (revoked device or token, hub shutdown).
  ATTACH_CLOSE_REASON_HUB_CLOSED = 3;
  // The agent is shutting down.
  ATTACH_CLOSE_REASON_AGENT_SHUTDOWN = 4;
  // The agent's connection dropped (hub to client only).
  ATTACH_CLOSE_REASON_AGENT_OFFLINE = 5;
  // The client detached (AttachClose).
  ATTACH_CLOSE_REASON_DETACHED = 6;
  // The attach failed or was refused; the error field says why.
  ATTACH_CLOSE_REASON_ERROR = 7;
}

// FieldViolation says what is wrong with one field of a request, so a form
// can mark the field. Carried in ErrorDetail.violations on INVALID_ARGUMENT.
message FieldViolation {
  // Path from the request message, in proto field names with indexes:
  // "update_mask.paths[0]", "spec.display_name", "filter" (a parse error
  // has the offset in metadata["offset"] of the enclosing ErrorDetail).
  string field = 1;
  // INVALID_ARGUMENT, INVALID_NAME, FIELD_TOO_LARGE, FILTER_INVALID, ...
  ReasonCode reason = 2;
  // One line for a person. Never echoes untrusted text. 256 bytes.
  string description = 3;
}

// ErrorDetail is the machine-readable half of an error, shared by command
// results and progress (agent wire) and hub API errors (as a Connect/gRPC
// error detail). The coarse outcome stays in Status or the RPC code.
message ErrorDetail {
  ReasonCode reason = 1;
  // True when the same request may succeed if sent again unchanged (with a
  // new command_id for agent commands). SendKeys-like effects are never
  // retryable after UNKNOWN_OUTCOME, whatever this says.
  bool retryable = 2;
  // Earliest sensible retry, when the cause knows it (rate limit, reset).
  google.protobuf.Duration retry_after = 3;
  // Small structured facts, e.g. {"step": "wait_ready"}, {"capability":
  // "goal.start"}, {"current_version": "7"}. No screen text, no secrets;
  // keys and values capped at 256 bytes, at most 16 entries.
  map<string, string> metadata = 4;
  // Field-level detail for hub API INVALID_ARGUMENT errors; at most 16.
  repeated FieldViolation violations = 5;
}

// ---------------------------------------------------------------------------
// Capabilities, roles, principals.
// ---------------------------------------------------------------------------

// Capability is one advertised feature, for example {"usage.probe.codex", 1}.
// The hub never sends a command whose capability the agent did not advertise.
// In Command.requires, version is the minimum version the command needs; an
// advertised version equal or higher satisfies it (02e-contract-rules.md).
// "exec.raw" is reserved and never advertised or accepted in v1.
message Capability {
  string name = 1;
  uint32 version = 2;
}

// Role of the principal that requested a command (ADR 0004 "People on the
// hub"). The agent re-checks role against harness command class (01b).
// Each value names a permission set (02d-hub-authz.md maps roles to scopes);
// values are never compared numerically, and ROLE_SCHEDULER is not "above"
// ROLE_OWNER.
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_VIEWER = 1;
  ROLE_OPERATOR = 2;
  ROLE_OWNER = 3;
  // The hub's own scheduler, not a person.
  ROLE_SCHEDULER = 4;
}

// PrincipalKind says what sort of actor a Principal is (ADR 0018).
enum PrincipalKind {
  PRINCIPAL_KIND_UNSPECIFIED = 0;
  // A person signed in to the hub (browser, CLI).
  PRINCIPAL_KIND_USER = 1;
  // The hub's own scheduler (dispatch, nudges, probes, routines).
  PRINCIPAL_KIND_SCHEDULER = 2;
  // The arbiter model that settles questions goals cannot (design.md).
  PRINCIPAL_KIND_ARBITER = 3;
  // A script using an API token (FLEET_TOKEN); acts for its creator.
  PRINCIPAL_KIND_API_TOKEN = 4;
  // A paired device (phone); acts for on_behalf_of within its scopes.
  PRINCIPAL_KIND_DEVICE = 5;
  // The OS user at the machine, through `fleet-agent` (local drain, local
  // approval). Never a hub account; reported by the agent.
  PRINCIPAL_KIND_LOCAL_USER = 6;
}

// Principal names who asked for something: a command, an approval, a drain.
message Principal {
  // Display name or login on the hub; "scheduler" for the scheduler.
  // Display only; never used as a key.
  string name = 1;
  Role role = 2;
  // The key for audit, ownership (FLEET_OWNER holds it) and idempotency
  // scoping. For LOCAL_USER the value is "local:<os user>".
  PrincipalId id = 3;
  PrincipalKind kind = 4;
  // Set when kind is DEVICE: the paired device that acted.
  DeviceId device = 5;
  // Set for DEVICE and API_TOKEN (the user they act for) and for SCHEDULER
  // or ARBITER when acting for a routine's or goal's owner. One level deep:
  // on_behalf_of never has its own on_behalf_of.
  Principal on_behalf_of = 6;
}
