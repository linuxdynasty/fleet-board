// fleet.type.v1 work references: provider-neutral names for repositories,
// work items and working directories (ADR 0012). Used by the agent wire
// (GoalSpec, RepoCheckout), integrations and the hub API.
syntax = "proto3";

package fleet.type.v1;

import "fleet/type/v1/ids.proto";

// RepoRef names a repository on a code host, independent of provider.
// host is the code host's hostname ("github.com", "gitlab.acme.dev");
// path is the project path on that host, lowercase, no ".git", and may be
// nested ("eshu-hq/eshu", "group/subgroup/repo"). SSH and HTTPS remotes
// normalize to the same value.
message RepoRef {
  string host = 1;
  string path = 2;
  // The configured code-host integration this repo belongs to, if any.
  IntegrationId code_host = 3;
}

// ProviderKind is the product behind an integration.
enum ProviderKind {
  PROVIDER_KIND_UNSPECIFIED = 0;
  PROVIDER_KIND_GITHUB = 1;
  PROVIDER_KIND_GITLAB = 2;
  PROVIDER_KIND_JIRA = 3;
  PROVIDER_KIND_BITBUCKET = 4;
  PROVIDER_KIND_LINEAR = 5;
  PROVIDER_KIND_OTHER = 15;
}

// WorkItemKind distinguishes things that can drive a goal.
enum WorkItemKind {
  WORK_ITEM_KIND_UNSPECIFIED = 0;
  // An issue on a code host's tracker (GitHub, GitLab issues).
  WORK_ITEM_KIND_ISSUE = 1;
  // A ticket in a separate tracker (Jira, Linear).
  WORK_ITEM_KIND_TICKET = 2;
  // A pull request or merge request.
  WORK_ITEM_KIND_CHANGE_REQUEST = 3;
  // Fleet-internal: one run of a hub routine (ADR 0018). integration is
  // empty, provider_name is "fleet", key is "<routine id>/<run number>".
  // The run number counts from 1 per routine.
  WORK_ITEM_KIND_ROUTINE = 4;
  // Anything a provider has that is none of the above (Linear project
  // update, Jira epic). Shown, never auto-dispatched.
  WORK_ITEM_KIND_OTHER = 15;
}

// WorkItemKey is the identity of an issue, ticket, change request or routine
// run in any integration: (integration, kind, project, key), and
// provider_name only when there is no integration. Two keys are the same item
// exactly when all of those fields are equal. Use it as the id in Get
// requests, as the hub's WorkItem and ChangeRequest ids, and as the Map or
// dedupe key on a client. Canonical string form for logs and map keys:
// "<integration, or ~<provider_name> when empty>/<KIND>/<project>/<key>".
message WorkItemKey {
  // Empty for fleet-internal items (kind ROUTINE).
  IntegrationId integration = 1;
  // Part of the identity: GitLab numbers issues and merge requests apart.
  WorkItemKind kind = 2;
  // Repo path for code-host items, project key for trackers ("PROJ").
  string project = 3;
  // The provider's own identifier as a string: "7398" (GitHub issue or PR),
  // "12" for a GitLab MR (shown "!12"), "PROJ-123" (Jira). For ROUTINE:
  // "<routine id>/<run number>".
  string key = 4;
  // Open provider name ("fleet" for routine runs). Set only when
  // integration is empty; otherwise the integration says which provider.
  string provider_name = 5;
}

// WorkItemRef is a reference to a work item for display: the identity plus
// derived fields. Hub APIs ignore everything but key on input and fill the
// rest on output; the derived fields change when the title or host changes,
// so never compare two WorkItemRefs as whole messages, compare key.
message WorkItemRef {
  WorkItemKey key = 1;
  // Hint for known products; the integration is authoritative.
  ProviderKind provider = 2;
  // Canonical web URL. Untrusted text.
  string url = 3;
  // Short display form used in UI and window names: "eshu#7398",
  // "eshu!12", "PROJ-123". Untrusted text.
  string display = 4;
}

// Workdir is how the hub names a working directory. The hub never sends an
// absolute path: the agent joins repo to an allowed root and rejects "..".
message Workdir {
  RepoRef repo = 1;
  // Optional path relative to the checkout (for example a worktree under
  // .worktrees/). Empty means the main checkout.
  string relative_path = 2;
}
