// fleet.type.v1 usage values: limit buckets, reset times, the "as shown"
// fields and spend. The agent reports them in UsageReading (fleet.agent.v1);
// the hub API shows the same values on accounts.
//
// Usage belongs to accounts, not harnesses (01-agent-capabilities.md, C).
// Everything the agent read from a screen is UNTRUSTED TEXT.
syntax = "proto3";

package fleet.type.v1;

import "fleet/type/v1/status.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// UsageSource says how a reading was obtained.
enum UsageSource {
  USAGE_SOURCE_UNSPECIFIED = 0;
  // The probe session ran the harness's usage command (D1/D2).
  USAGE_SOURCE_PROBE = 1;
  // [CAP D3]
  // Parsed from a banner or status line in a pane already observed.
  USAGE_SOURCE_PASSIVE = 2;
  // A transient identity probe at agent start or version change (C2).
  USAGE_SOURCE_IDENTITY_PROBE = 3;
}

// WindowKind classifies a limit bucket for the scheduler.
enum WindowKind {
  WINDOW_KIND_UNSPECIFIED = 0;
  // A short window (Claude "Current session", Muse "Current"): a speed limit.
  WINDOW_KIND_SHORT = 1;
  // The weekly budget across all models.
  WINDOW_KIND_WEEKLY = 2;
  // A weekly budget for one model (Claude "Current week (Fable)").
  WINDOW_KIND_PER_MODEL = 3;
  // A budget that resets once a month on the plan's own day (Cursor
  // "Included", "Auto", "API"). Months differ in length, so pacing never
  // assumes one: it uses the window the hub saw between two resets, or
  // LimitBucket.window, and treats the bucket as unknown for the pace line
  // without either (03b, "Monthly windows").
  WINDOW_KIND_MONTHLY = 4;
}

// BudgetKind is how an account's budget is expressed.
enum BudgetKind {
  BUDGET_KIND_UNSPECIFIED = 0;
  // Subscription: a percentage of the plan that resets on the harness's
  // schedule (weekly for Claude Code, Codex and Muse; monthly for Cursor).
  BUDGET_KIND_SUBSCRIPTION_PERCENT = 1;
  // API-key provider: money spent so far as the tool reports it (all-time, no
  // period), shown against an optional limit the owner sets; never
  // auto-dispatched.
  BUDGET_KIND_DOLLAR_CAP = 2;
}

// ParseOutcome says how much of a screen the parser recognized.
enum ParseOutcome {
  PARSE_OUTCOME_UNSPECIFIED = 0;
  PARSE_OUTCOME_OK = 1;
  // Some fields parsed; the rest are unknown. Never guessed.
  PARSE_OUTCOME_PARTIAL = 2;
  // Nothing parsed; shown.raw_screen is still sent for display.
  PARSE_OUTCOME_FAILED = 3;
}

// ResetTime is a reset moment resolved to UTC plus the text the harness
// showed ("Resets Sep 30 at 10pm"), which has no year and is local time.
message ResetTime {
  // UTC instant, resolved by the agent with the machine timezone (B1).
  // Unset when resolution failed; original_text is still present.
  google.protobuf.Timestamp resolved_time = 1;
  // Exactly as shown on screen. Untrusted text, capped at 256 bytes.
  string original_text = 2;
  // IANA timezone used to resolve the text, e.g. "America/New_York".
  string resolved_with_timezone = 3;
  // True when the harness showed a date with no time of day (Cursor
  // "Resets Nov 4"). resolved_time is then the end of that date (00:00 the
  // next day) in resolved_with_timezone: the latest the reset can be in that
  // zone, so the pace line errs low. The UI shows original_text, not a
  // countdown.
  bool date_only = 4;
}

// ShownField is one field the parser recognized, in the harness's own terms,
// for display. Untrusted text, each string capped at 256 bytes.
message ShownField {
  // Section on screen, e.g. "Current week (all models)" or "Session".
  string group = 1;
  // Label as shown, e.g. "% used", "Resets", "Plan", "Model".
  string label = 2;
  // Value as shown, e.g. "81%", "Sep 30 at 10pm", "Account: Pro".
  string value = 3;
}

// ShownUsage is the "as shown" half of a reading: everything the parser
// recognized plus the redacted raw screen, so the owner sees what the
// harness shows.
message ShownUsage {
  repeated ShownField fields = 1;
  // Raw screen text, ANSI stripped, emails and names redacted per C2 unless
  // the owner enabled identity sharing. Untrusted text, capped at 64 KiB.
  string raw_screen = 2;
  // True if raw_screen was cut at the cap.
  bool raw_truncated = 3;
  // True when raw_screen was left out on purpose: always in Snapshot.usage
  // (the hub already has it from the event) and in hub list views. Empty
  // raw_screen with this false means the harness showed nothing.
  bool raw_screen_omitted = 4;
}

// LimitBucket is the standardized half: one limit the scheduler tracks.
message LimitBucket {
  // Stable per-harness key, e.g. "session", "weekly_all", "weekly_fable".
  // Defined by the adapter and fixed across parser versions.
  string key = 1;
  // Label as the harness shows it. Untrusted text.
  string label = 2;
  // Percent USED (Codex "% left" is converted; display keeps "% left").
  Percent percent_used = 3;
  ResetTime resets_time = 4;
  // Window length when known (Codex rate_limits has 10080 minutes). For
  // WINDOW_KIND_MONTHLY, set only when the start of this month's window
  // follows from the shown reset without assuming how the plan treats short
  // months (03b, "Monthly windows"); unset otherwise. In the hub API
  // (AccountUsage.buckets) it is the window pacing used, which may be the one
  // the hub saw between two resets.
  google.protobuf.Duration window = 5;
  WindowKind kind = 6;
  // Model name for WINDOW_KIND_PER_MODEL. Untrusted text.
  string model = 7;
  // True when the harness displayed remaining rather than used.
  bool shown_as_remaining = 8;
}

// OverageBilling says whether the plan bills money for use past its included
// budget (Cursor "On-Demand"), as the usage screen shows it.
enum OverageBilling {
  // The adapter does not read this for its harness; pacing ignores it.
  OVERAGE_BILLING_UNSPECIFIED = 0;
  // The screen shows it turned off (Cursor "On-Demand Disabled").
  OVERAGE_BILLING_OFF = 1;
  // The screen shows it turned on. Work past the plan costs money, so the
  // account is never auto-dispatched (03b step 6).
  OVERAGE_BILLING_ON = 2;
  // The adapter reads this for its harness, but the screen did not show it
  // or it did not parse. Treated like ON; never guessed.
  OVERAGE_BILLING_UNKNOWN = 3;
}

// SpendReading is the dollar counterpart for API-key providers (OpenCode
// `opencode stats`): the total the tool reports, all-time, as it counts it.
// There is no period: the contract never sums readings into a month or resets
// the figure. Display and manual budgeting only.
message SpendReading {
  // Amount in micro-units of currency (1 USD = 1_000_000).
  int64 amount_micros = 1;
  // ISO 4217 code, e.g. "USD".
  string currency = 2;
}
