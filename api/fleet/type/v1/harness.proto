// fleet.type.v1 harness and pane values: command classes and catalogs,
// goal-hook state, goal-control support, pane activity and availability,
// goal-line states, keys and why they are sent, prompt options, harness
// condition kinds, version support and log streams.
// The agent reports them; the hub API shows them and sends keys and harness
// commands with them.
syntax = "proto3";

package fleet.type.v1;

import "fleet/type/v1/ids.proto";
import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------------------
// Harness command catalog (C4) and goal hooks (G1)
// ---------------------------------------------------------------------------

// CommandClass classifies a harness slash command (01b). DENY is never
// sendable; unknown commands are DENY.
enum CommandClass {
  COMMAND_CLASS_UNSPECIFIED = 0;
  COMMAND_CLASS_OBSERVE = 1;
  COMMAND_CLASS_SESSION = 2;
  COMMAND_CLASS_GOAL = 3;
  COMMAND_CLASS_REVIEW = 4;
  COMMAND_CLASS_DESTRUCTIVE = 5;
  COMMAND_CLASS_DENY = 6;
}

// CatalogEntry is one slash command the harness install offers (C4).
message CatalogEntry {
  // As shown, including the leading slash. Untrusted text.
  string name = 1;
  CommandClass class = 2;
  // True when local policy moved it to a stricter class than the adapter's.
  bool tightened_by_policy = 3;
}

// CommandCatalog (C4): discovered per machine, reported with a hash.
message CommandCatalog {
  // Hex digest over the sorted entry names; RunHarnessCommand must match it.
  string hash = 1;
  repeated CatalogEntry entries = 2;
  google.protobuf.Timestamp discovered_time = 3;
}

// GoalHooksState (G1): generic goal-protocol hooks for one harness.
message GoalHooksState {
  bool installed = 1;
  bool verified = 2;
  string hook_version = 3;
  string hook_hash = 4;
  // True when the repo ships its own hooks (eshu) and fleet left them alone.
  bool repo_ships_own = 5;
  // Whether the harness runs these hooks. Codex and Muse run a new or
  // changed hook only after the user approves it (trust is per hook hash);
  // the agent never approves it (01d). UNKNOWN when the agent cannot tell,
  // so "unknown" is never read as "trusted".
  HookTrustState trust = 6;
  // What the person types to approve, for the Triage card: "/hooks" in Codex,
  // "muse plugins approve fleet-goal-hooks" for Muse. Empty unless trust is
  // PENDING or UNKNOWN. Agent-written text, not harness output.
  string trust_approve_command = 8;
  // User-level config file the entries were merged into, e.g.
  // ~/.claude/settings.json. Hooks are user level and inert unless the
  // agent's goal registry matches the hook call (session_id, pane or, for
  // Muse, cwd; 02h); FLEET_GOAL_ID is only a fast path for a new window.
  string config_path = 7;
}

// HookTrustState is the per-harness trust of the installed goal hooks.
enum HookTrustState {
  HOOK_TRUST_STATE_UNSPECIFIED = 0;
  // The agent cannot read the harness's trust record (or has not looked).
  HOOK_TRUST_STATE_UNKNOWN = 1;
  // Installed, not yet approved in the harness. Goals still run; only E8
  // events and the Stop guard are missing.
  HOOK_TRUST_STATE_PENDING = 2;
  HOOK_TRUST_STATE_TRUSTED = 3;
  // The harness needs no approval for user-level hooks (Claude Code).
  HOOK_TRUST_STATE_NOT_REQUIRED = 4;
}

// HarnessGoalHooks is the goal-hook state of one harness in one checkout
// (03g change #7): whether the repo ships its own hooks decides the consent
// form typed into the goal.
message HarnessGoalHooks {
  Harness harness = 1;
  GoalHooksState state = 2;
}

// ---------------------------------------------------------------------------
// Goal control support (G4), per harness version
// ---------------------------------------------------------------------------

// GoalSubcommand is a /goal subcommand a harness version offers (01b).
enum GoalSubcommand {
  GOAL_SUBCOMMAND_UNSPECIFIED = 0;
  GOAL_SUBCOMMAND_SET = 1;
  GOAL_SUBCOMMAND_PAUSE = 2;
  GOAL_SUBCOMMAND_RESUME = 3;
  GOAL_SUBCOMMAND_EDIT = 4;
  GOAL_SUBCOMMAND_CLEAR = 5;
}

// GoalPauseMode says how a goal is paused on this harness.
enum GoalPauseMode {
  GOAL_PAUSE_MODE_UNSPECIFIED = 0;
  // RunHarnessCommand{"/goal", "pause"} (Codex, Muse).
  GOAL_PAUSE_MODE_SUBCOMMAND = 1;
  // Interrupt: the harness keeps the goal active but stops the turn
  // (Claude Code 2.1.286 has no pause subcommand).
  GOAL_PAUSE_MODE_INTERRUPT = 2;
  GOAL_PAUSE_MODE_NONE = 3;
}

// GoalResumeMode says how a paused or interrupted goal is resumed.
enum GoalResumeMode {
  GOAL_RESUME_MODE_UNSPECIFIED = 0;
  // RunHarnessCommand{"/goal", "resume"}.
  GOAL_RESUME_MODE_SUBCOMMAND = 1;
  // SendKeys{purpose GOAL_RESUME} typing GoalControl.resume_text.
  GOAL_RESUME_MODE_TYPE_TEXT = 2;
  GOAL_RESUME_MODE_NONE = 3;
}

// GoalControl is what the adapter knows about /goal for the installed harness
// version, so the hub never hard-codes a harness name: it sends only what is
// listed here and falls back (Interrupt, a person) when a mode is NONE. The
// adapter fills it from the version's fixtures, never by trying commands.
message GoalControl {
  repeated GoalSubcommand subcommands = 1;
  GoalPauseMode pause_mode = 2;
  GoalResumeMode resume_mode = 3;
  // Text typed to resume when resume_mode is TYPE_TEXT ("continue" for
  // Claude Code). Adapter-owned, so a harness update changes it in one place.
  string resume_text = 4;
  // True when resuming after a usage limit has been probed on this version.
  // False means the hub's limit wait uses the same resume but marks the
  // result unverified (02-contracts.md, "Limit wait").
  bool limit_resume_verified = 5;
}

// ---------------------------------------------------------------------------
// Harness version support (C1)
// ---------------------------------------------------------------------------

// VersionSupport replaces the old bool version_supported: a version can run
// fine while fleet-board's screen parsers are not yet verified for it.
enum VersionSupport {
  VERSION_SUPPORT_UNSPECIFIED = 0;
  // Fixtures exist for this version; every parser feature is verified.
  VERSION_SUPPORT_SUPPORTED = 1;
  // The harness runs, but at least one parser feature is not verified for
  // this version (see ParserSupport). Auto-dispatch continues while USAGE
  // and READY are verified or parse this version's live screens
  // (ParserSupport.parsing_live) and the usage reading agrees with a passive
  // reading where one exists; otherwise manual dispatch only. Prompts stay
  // notice-only (answerable=false) until PROMPT is verified. Readings that
  // do not parse are unknown, never guessed.
  VERSION_SUPPORT_UNVERIFIED_PARSING = 2;
  // Known not to work with the adapter (for example /goal missing).
  VERSION_SUPPORT_UNSUPPORTED = 3;
}

// ParserFeature is one thing the adapter reads from the harness screen.
enum ParserFeature {
  PARSER_FEATURE_UNSPECIFIED = 0;
  // The usage screen (D2).
  PARSER_FEATURE_USAGE = 1;
  // The account identity on the status screen (C2).
  PARSER_FEATURE_IDENTITY = 2;
  // Permission-prompt detection (E6).
  PARSER_FEATURE_PROMPT = 3;
  // The ready pattern (E7, G3 wait_ready).
  PARSER_FEATURE_READY = 4;
  // Harness conditions: provider errors, limits, sign-in (E12).
  PARSER_FEATURE_CONDITION = 5;
}

// ParserSupport says whether one parser feature is verified for the
// installed harness version.
message ParserSupport {
  ParserFeature feature = 1;
  string parser_version = 2;
  // Verified against fixtures of this harness version.
  bool supported = 3;
  // Not verified, but the parser has read this version's live screens
  // without a PARSE_FAILED since the version appeared. Keeps auto-dispatch
  // going after a harness auto-update until fixtures catch up.
  bool parsing_live = 4;
}

// ---------------------------------------------------------------------------
// Pane activity (E4), availability (E11), goal line (G2)
// ---------------------------------------------------------------------------

// Activity is the pane's output activity state (E4).
enum Activity {
  ACTIVITY_UNSPECIFIED = 0;
  ACTIVITY_ACTIVE = 1;
  ACTIVITY_IDLE = 2;
}

// Availability (E11): idle and available-for-work are distinct.
message Availability {
  // Ready pattern showing, no active goal, no output or input for the
  // configured idle threshold.
  bool idle = 1;
  // Fleet started it and its goal is verified merged, or the developer
  // marked it on the board. Idle alone never makes a session take work.
  bool available_for_work = 2;
  google.protobuf.Timestamp since_time = 3;
}

// AvailabilityReason says why a pane's availability changed (E11) or why the
// board changed it. Developer input is not a reason here: it is its own
// signal, TmuxPane.last_input_time and the PaneInput event (02h).
enum AvailabilityReason {
  AVAILABILITY_REASON_UNSPECIFIED = 0;
  // The developer marked the pane available on the board.
  AVAILABILITY_REASON_MARKED_ON_BOARD = 1;
  // The board mark was removed, or the pane took a goal.
  AVAILABILITY_REASON_CLEARED_ON_BOARD = 2;
  // The pane's goal was verified merged (the hub's SetPaneAvailability).
  AVAILABILITY_REASON_GOAL_MERGED = 3;
  // Output resumed, so the pane is no longer idle.
  AVAILABILITY_REASON_OUTPUT = 4;
  // The idle threshold passed with the ready pattern showing.
  AVAILABILITY_REASON_IDLE_THRESHOLD = 5;
  // A goal was started or registered in the pane.
  AVAILABILITY_REASON_GOAL_STARTED = 6;
  // The pane exited or its harness changed.
  AVAILABILITY_REASON_PANE_CHANGED = 7;
}

// GoalLineState is the parsed first line of a goal file (design.md).
enum GoalLineState {
  GOAL_LINE_STATE_UNSPECIFIED = 0;
  GOAL_LINE_STATE_WORKING = 1;
  GOAL_LINE_STATE_BLOCKED_WATCH = 2;
  GOAL_LINE_STATE_BLOCKED_OWNER = 3;
  // BLOCKED with neither a live watcher nor an owner: stuck.
  GOAL_LINE_STATE_BLOCKED_STUCK = 4;
  GOAL_LINE_STATE_DONE = 5;
  // Goal file missing or unreadable.
  GOAL_LINE_STATE_MISSING = 6;
}

// ---------------------------------------------------------------------------
// Keys (F3) and prompts (E6)
// ---------------------------------------------------------------------------

// SendKeysPurpose is why a SendKeys types what it types. The agent gates
// each purpose differently, so a nudge is never mistaken for a prompt answer
// and free text is never typed into a running turn (02h, "SendKeys purposes").
enum SendKeysPurpose {
  // INVALID_ARGUMENT: every SendKeys states its purpose.
  SEND_KEYS_PURPOSE_UNSPECIFIED = 0;
  // Answers the prompt named by answering_prompt. Needs PARSER_FEATURE_PROMPT
  // verified for the harness version (E6); PROMPT_GONE if it left the
  // screen. No empty-line or ready check: a menu has neither.
  SEND_KEYS_PURPOSE_PROMPT_ANSWER = 1;
  // The corrective nudge for a stopped goal (03c). Hub-authored text, typed
  // only into a pane bound to a fleet goal.
  SEND_KEYS_PURPOSE_GOAL_NUDGE = 2;
  // Resume text for a paused or limit-waiting goal (GoalControl.resume_text).
  SEND_KEYS_PURPOSE_GOAL_RESUME = 3;
  // Free text from an operator ("send a hint").
  SEND_KEYS_PURPOSE_OPERATOR_TEXT = 4;
}

// NamedKey is the closed set of non-literal keys SendKeys may type.
enum NamedKey {
  NAMED_KEY_UNSPECIFIED = 0;
  NAMED_KEY_ENTER = 1;
  NAMED_KEY_ESCAPE = 2;
  NAMED_KEY_TAB = 3;
  NAMED_KEY_BACKSPACE = 4;
  NAMED_KEY_UP = 5;
  NAMED_KEY_DOWN = 6;
  NAMED_KEY_LEFT = 7;
  NAMED_KEY_RIGHT = 8;
  NAMED_KEY_CTRL_C = 9;
}

// KeyInput is one literal string or one named key.
message KeyInput {
  oneof input {
    // Literal text, capped at 4 KiB; never interpreted by tmux.
    string literal = 1;
    NamedKey key = 2;
  }
}

// PromptSource says how a prompt was detected.
enum PromptSource {
  PROMPT_SOURCE_UNSPECIFIED = 0;
  PROMPT_SOURCE_SCREEN_PATTERN = 1;
  PROMPT_SOURCE_HOOK = 2;
}

// PromptClass is the adapter's closed classification of what a prompt asks,
// so insights can count "what blocks goals most" without grouping by screen
// text (docs/specs/05-insights.md). Chosen by the adapter from the prompt's
// structure and options, never from free text a model wrote; UNSPECIFIED when
// the adapter cannot tell. A newer adapter may add values, and a receiver
// treats an unknown one as OTHER.
enum PromptClass {
  PROMPT_CLASS_UNSPECIFIED = 0;
  // Permission to run a command or a tool.
  PROMPT_CLASS_RUN_COMMAND = 1;
  // Permission to edit, write or delete files.
  PROMPT_CLASS_EDIT_FILES = 2;
  // Permission for the network, a web fetch or an MCP tool.
  PROMPT_CLASS_NETWORK_OR_TOOL = 3;
  // Trust this folder, or accept a hook, plugin or config.
  PROMPT_CLASS_TRUST = 4;
  // Approve a plan the harness wrote.
  PROMPT_CLASS_PLAN_APPROVAL = 5;
  // The agent asks the person a question (not a permission).
  PROMPT_CLASS_QUESTION = 6;
  // Sign in, update or another setup screen.
  PROMPT_CLASS_SETUP = 7;
  PROMPT_CLASS_OTHER = 15;
}

// PromptOption is one menu choice as shown. Untrusted text.
message PromptOption {
  // The key or number to type, e.g. "1", "y".
  string key = 1;
  string label = 2;
}

// HarnessConditionKind classifies a HarnessCondition (E12).
enum HarnessConditionKind {
  HARNESS_CONDITION_KIND_UNSPECIFIED = 0;
  // Provider returned a server error (5xx).
  HARNESS_CONDITION_KIND_PROVIDER_ERROR = 1;
  // Provider rate limit or overload (429, 529).
  HARNESS_CONDITION_KIND_RATE_LIMITED = 2;
  // A usage limit was reached (short window or weekly).
  HARNESS_CONDITION_KIND_USAGE_LIMIT = 3;
  // The harness wants the developer to sign in again.
  HARNESS_CONDITION_KIND_SIGN_IN_REQUIRED = 4;
  // Network unreachable from the harness.
  HARNESS_CONDITION_KIND_NETWORK = 5;
  // A person interrupted the goal at the machine (Esc, Ctrl-C): Claude shows
  // "Interrupted", Codex "Goal paused", Muse "goal paused by interrupt". The
  // goal is the person's to resume: no nudge, no automatic resume. Cleared
  // when the goal runs again or ends.
  HARNESS_CONDITION_KIND_GOAL_INTERRUPTED = 6;
  // The harness shows the goal as paused, however it got there (/goal pause
  // typed by a person or by the fleet, a limit). GoalPauseCause says who.
  HARNESS_CONDITION_KIND_GOAL_PAUSED = 7;
  // Recognised as an error by the adapter but not classified.
  HARNESS_CONDITION_KIND_OTHER = 15;
}

// GoalPauseCause says who or what paused a goal, for conditions of kind
// GOAL_INTERRUPTED and GOAL_PAUSED. The agent knows FLEET_COMMAND because it
// typed the pause itself; DEVELOPER_INPUT when pane input preceded the pause.
enum GoalPauseCause {
  GOAL_PAUSE_CAUSE_UNSPECIFIED = 0;
  // A person at the machine pressed a key just before (last_input_time).
  GOAL_PAUSE_CAUSE_DEVELOPER_INPUT = 1;
  // The harness paused itself with no input and no fleet command in flight.
  GOAL_PAUSE_CAUSE_HARNESS = 2;
  // An Interrupt or /goal pause the agent executed for the hub.
  GOAL_PAUSE_CAUSE_FLEET_COMMAND = 3;
  // A usage or rate limit; a USAGE_LIMIT or RATE_LIMITED condition is open
  // too and owns the resume (02-contracts.md, "Limit wait").
  GOAL_PAUSE_CAUSE_LIMIT = 4;
}

// ---------------------------------------------------------------------------
// Session logs (K1, K3; ADR 0010)
// ---------------------------------------------------------------------------

// LogStream distinguishes terminal output from harness transcripts.
enum LogStream {
  LOG_STREAM_UNSPECIFIED = 0;
  // tmux pipe-pane output (K1).
  LOG_STREAM_TERMINAL = 1;
  // The harness's own transcript file, shipped by offset (K3, v3).
  LOG_STREAM_HARNESS_TRANSCRIPT = 2;
}

// LogStreamKey names one log stream: a pane's terminal output or its
// harness transcript. Used by LogChunk and LogAck on the agent wire and by
// the hub API's log reads.
//
// On the agent wire the identity is (pane, stream): PaneKey is unique per
// machine and the hub knows the machine from the certificate. session_id is
// then optional: the agent sets it only when it knows one (a fleet session,
// from FLEET_SESSION_ID or its registry) and leaves it empty for a
// developer's own session, whose hub SessionId the agent never sees. The hub
// resolves the pane to a session on ingest (it binds every observed session
// to machine, server_start_id and tmux id), and LogAck echoes the key as
// sent. Offsets are per (pane, stream), and the agent's spool is keyed the
// same way. In the hub API the hub always fills session_id in.
message LogStreamKey {
  SessionId session_id = 1;
  PaneKey pane = 2;
  LogStream stream = 3;
}
