// fleet.integration.v1 model: the provider-neutral shapes of work items and
// change requests (ADR 0012). The hub mirrors them unchanged (hub work.proto)
// and computes its own verdicts from them: the trusted-issues gate (03j) from
// WorkItem, "done" and "approved and green" (03l W6) from ChangeRequest. A
// provider-specific rule (branch protection, CODEOWNERS, required checks)
// is applied inside the adapter and reported as a normalized value here, so
// no hub rule needs to know which provider it is talking to.
//
// Everything a provider returns is untrusted text.
syntax = "proto3";

package fleet.integration.v1;

import "fleet/integration/v1/integration.proto";
import "fleet/type/v1/work.proto";
import "google/protobuf/timestamp.proto";

// Person is a provider account, never a fleet user. Untrusted text. Logins
// are provider-local: "alice" on GitHub and "alice" on Jira are different
// people, so a login is only ever compared inside one integration.
message Person {
  string login = 1;
  string display_name = 2;
  // The provider's stable account id (GitHub numeric id, Jira accountId).
  // Logins can be renamed and reused; the allow-list pins this when it has
  // it. Empty when the provider does not expose one.
  string provider_id = 3;
}

// WorkItemState is the normalized state; provider_state keeps the original.
enum WorkItemState {
  WORK_ITEM_STATE_UNSPECIFIED = 0;
  WORK_ITEM_STATE_OPEN = 1;
  WORK_ITEM_STATE_IN_PROGRESS = 2;
  WORK_ITEM_STATE_CLOSED = 3;
  // Change requests only.
  WORK_ITEM_STATE_MERGED = 4;
  WORK_ITEM_STATE_DRAFT = 5;
  // Closed without being done (GitHub "not planned", Jira "Won't Do",
  // GitLab MR closed unmerged). Verification treats it like CLOSED for
  // freeing the worker but never as success.
  WORK_ITEM_STATE_CANCELLED = 6;
}

// Claim: evidence that someone is working on an item.
message Claim {
  ClaimMechanism mechanism = 1;
  Person by = 2;
  google.protobuf.Timestamp claim_time = 3;
  // Comment text or label name, capped at 4 KiB. Untrusted text.
  string text = 4;
  // True when the claim was made by this fleet (matched by its marker).
  bool by_fleet = 5;
}

// Label is a tag on a work item. For the labels the hub asks evidence for
// (the trusted label, 03j), it says who applied it and when: the provider's
// timeline, not the item's current state, is the source (GitHub
// LABELED_EVENT, GitLab resource label events, Jira changelog; a tracker
// whose signal is a status reports the transition into it as the label).
// applied_by and applied_time describe the latest apply: a label removed and
// applied again carries the second event. Unset = unknown, which the gate
// treats as untrusted, never as allowed.
message Label {
  string name = 1;
  Person applied_by = 2;
  google.protobuf.Timestamp applied_time = 3;
}

// WorkItem: an issue or ticket that can drive a goal.
message WorkItem {
  fleet.type.v1.WorkItemRef ref = 1;
  // Untrusted text.
  string title = 2;
  WorkItemState state = 3;
  // The provider's own state name ("open", "In Review"). Untrusted text.
  string provider_state = 4;
  // Who opened it: the author path of the trusted-issues gate.
  Person author = 5;
  repeated Label labels = 6;
  repeated Person assignees = 7;
  repeated Claim claims = 8;
  // Change requests linked to this item (closing keywords, ticket keys).
  repeated fleet.type.v1.WorkItemRef linked_change_requests = 9;
  // For trackers: the repo(s) the work is expected to touch, when known.
  repeated fleet.type.v1.RepoRef repos = 10;
  google.protobuf.Timestamp update_time = 11;
  // Body is fetched on demand only; this is its size in bytes.
  uint64 body_bytes = 12;
  // The last person who edited the title or body, and when (needs
  // IntegrationCapabilities.edit_evidence). Comments and label changes are
  // not edits. The gate demotes an item whose last edit is by someone outside
  // the allow-list after the event that made it trusted.
  Person last_editor = 13;
  google.protobuf.Timestamp last_edit_time = 14;
  google.protobuf.Timestamp create_time = 15;
}

// CheckRollup is the CI result for a change request's head commit,
// normalized. The adapter computes it over the checks the provider requires
// (branch protection) when it says which, otherwise over all checks, and
// never reports SUCCESS while a check in scope is pending, failing or
// missing.
enum CheckRollup {
  // Not reported or not known: never read as success.
  CHECK_ROLLUP_UNSPECIFIED = 0;
  // No checks are configured for the head commit.
  CHECK_ROLLUP_NONE = 1;
  CHECK_ROLLUP_PENDING = 2;
  CHECK_ROLLUP_SUCCESS = 3;
  CHECK_ROLLUP_FAILURE = 4;
}

// CheckSummary: CI state of a change request's head commit, normalized.
message CheckSummary {
  uint32 passing = 1;
  uint32 failing = 2;
  uint32 pending = 3;
  uint32 skipped = 4;
  // Names of failing checks, capped at 32. Untrusted text.
  repeated string failing_names = 5;
  // The one value W6 compares ("approved and green" needs SUCCESS). The
  // counts above are for display and cannot be combined into it reliably:
  // which checks are required is provider logic.
  CheckRollup rollup = 6;
}

// ReviewState is normalized across providers.
enum ReviewState {
  REVIEW_STATE_UNSPECIFIED = 0;
  REVIEW_STATE_APPROVED = 1;
  REVIEW_STATE_CHANGES_REQUESTED = 2;
  REVIEW_STATE_COMMENTED = 3;
}

message Review {
  Person by = 1;
  ReviewState state = 2;
  google.protobuf.Timestamp review_time = 3;
  // Unresolved review threads at the time of the review.
  uint32 open_threads = 4;
}

// ReviewDecision is the provider's verdict on whether the change request has
// the reviews it needs. Computed by the adapter from required reviewers,
// CODEOWNERS and branch protection; reviews[] cannot express those rules, so
// the hub never derives it.
enum ReviewDecision {
  // Not reported (capabilities.reviews false) or not known.
  REVIEW_DECISION_UNSPECIFIED = 0;
  // The provider requires no review for this change request.
  REVIEW_DECISION_NONE = 1;
  // A review is required and not yet given.
  REVIEW_DECISION_REQUIRED = 2;
  REVIEW_DECISION_APPROVED = 3;
  REVIEW_DECISION_CHANGES_REQUESTED = 4;
}

// MergeState says whether the provider would merge the change request now.
// The fleet never merges without MERGE consent; this is for the verifier and
// the dashboard.
enum MergeState {
  MERGE_STATE_UNSPECIFIED = 0;
  // Could merge now (no conflicts, required checks and reviews met).
  MERGE_STATE_CLEAN = 1;
  // A required check or review is missing or failing.
  MERGE_STATE_BLOCKED = 2;
  MERGE_STATE_CONFLICTING = 3;
  // The head is behind the target and the provider requires it up to date.
  MERGE_STATE_BEHIND = 4;
  // Mergeable but a non-required check fails.
  MERGE_STATE_UNSTABLE = 5;
  // The provider has not computed it yet (GitHub does so lazily); ask again.
  MERGE_STATE_UNKNOWN = 6;
}

// ChangeRequest: a pull request (GitHub) or merge request (GitLab).
message ChangeRequest {
  fleet.type.v1.WorkItemRef ref = 1;
  fleet.type.v1.RepoRef repo = 2;
  // Untrusted text.
  string title = 3;
  WorkItemState state = 4;
  string provider_state = 5;
  // The head ref that verification matches against the branch the agent
  // reports (03l W6). Untrusted text.
  string source_branch = 6;
  string target_branch = 7;
  // The head sha. Checks and review_decision describe this commit.
  string head_commit = 8;
  CheckSummary checks = 9;
  repeated Review reviews = 10;
  MergeState merge_state = 11;
  // Work items this change request closes or references.
  repeated fleet.type.v1.WorkItemRef linked_work_items = 12;
  Person author = 13;
  google.protobuf.Timestamp update_time = 14;
  google.protobuf.Timestamp merged_time = 15;
  // Review rounds so far: changes-requested reviews each followed by new
  // commits. Never resets; failed CI is not a round. Feeds the review-loop
  // cap (03c "Review-loop cap": 3 rounds beyond a baseline, no merge).
  uint32 review_rounds = 16;
  ReviewDecision review_decision = 17;
  // Who merged it, so a merge by a person is told from one by the goal's
  // worker (ADR 0019, 25). Unset until merged.
  Person merged_by = 18;
  // When it was closed, merged or not.
  google.protobuf.Timestamp closed_time = 19;
  // Set only when the head lives in another repo (a fork). A source_branch
  // alone is then ambiguous: the same name can exist in both repos.
  fleet.type.v1.RepoRef head_repo = 20;
  // The merge commit once merged.
  string merge_commit = 21;
}
