// fleet.integration.v1: the provider-neutral model of work items and change
// requests (ADR 0012). GitHub is the first implementation; GitLab, Jira,
// Bitbucket and Linear fit the same shape. In v1 adapters are compiled into
// fleetd and implement IntegrationProviderService in-process; the same
// service can later be served by an out-of-process plugin without changing
// the hub. The hub API (fleet.hub.v1) mirrors these messages to the UI.
//
// Everything a provider returns (titles, bodies, names, labels, URLs) is
// untrusted text.
syntax = "proto3";

package fleet.integration.v1;

import "fleet/type/v1/ids.proto";
import "fleet/type/v1/work.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/linuxdynasty/fleet-board/api/fleet/integration/v1;integrationv1";

// IntegrationRole: what an integration is used for. One integration can
// have both roles (GitHub, GitLab) or one (Jira is a work tracker only).
enum IntegrationRole {
  INTEGRATION_ROLE_UNSPECIFIED = 0;
  // Lists work items, claims, labels: GitHub Issues, GitLab Issues, Jira.
  INTEGRATION_ROLE_WORK_TRACKER = 1;
  // Repos, change requests, checks, reviews, merges: GitHub, GitLab.
  INTEGRATION_ROLE_CODE_HOST = 2;
}

// ClaimMechanism: how "someone is working on this" is recorded.
enum ClaimMechanism {
  CLAIM_MECHANISM_UNSPECIFIED = 0;
  // A comment on the item (eshu's issue driver on GitHub).
  CLAIM_MECHANISM_COMMENT = 1;
  CLAIM_MECHANISM_ASSIGNEE = 2;
  CLAIM_MECHANISM_LABEL = 3;
  // Workflow status transition (Jira "In Progress").
  CLAIM_MECHANISM_STATUS = 4;
  CLAIM_MECHANISM_NONE = 5;
}

// SyncMode: how the hub learns about changes.
enum SyncMode {
  SYNC_MODE_UNSPECIFIED = 0;
  // Polling with conditional requests (GitHub ETags).
  SYNC_MODE_POLL_CONDITIONAL = 1;
  SYNC_MODE_POLL = 2;
  // Push notifications; needs a reachable hub URL.
  SYNC_MODE_WEBHOOK = 3;
}

// IntegrationCapabilities: what a provider adapter supports, so the hub
// never asks for something a provider can't do.
message IntegrationCapabilities {
  fleet.type.v1.ProviderKind provider = 1;
  repeated IntegrationRole roles = 2;
  repeated fleet.type.v1.WorkItemKind work_item_kinds = 3;
  repeated ClaimMechanism claim_mechanisms = 4;
  repeated SyncMode sync_modes = 5;
  // Code host: check results on change requests.
  bool checks = 6;
  // Code host: reviews with approve / request-changes.
  bool reviews = 7;
  // Code host: merge state and merge time are reported.
  bool merge_detection = 8;
  // Work items can be linked to change requests: GitHub closing keywords,
  // GitLab "Closes #", Jira keys in branch names or titles.
  bool cross_links = 9;
  // Labels exist and can feed the trusted-issues gate.
  bool labels = 10;
  // Adapter version, for compatibility checks.
  string adapter_version = 11;
}

// Integration: one configured instance on the hub.
message Integration {
  fleet.type.v1.IntegrationId id = 1;
  fleet.type.v1.ProviderKind provider = 2;
  // Base URL or host ("https://github.com", "https://acme.atlassian.net").
  string base_url = 3;
  // Display name chosen by the owner.
  string label = 4;
  IntegrationCapabilities capabilities = 5;
  // Repos (code host) or projects (tracker) the owner chose to watch.
  repeated string watched = 6;
}

// Person is a provider account, never a fleet user. Untrusted text.
message Person {
  string login = 1;
  string display_name = 2;
}

// WorkItemState is the normalized state; provider_state keeps the original.
enum WorkItemState {
  WORK_ITEM_STATE_UNSPECIFIED = 0;
  WORK_ITEM_STATE_OPEN = 1;
  WORK_ITEM_STATE_IN_PROGRESS = 2;
  WORK_ITEM_STATE_CLOSED = 3;
  // Change requests only.
  WORK_ITEM_STATE_MERGED = 4;
  WORK_ITEM_STATE_DRAFT = 5;
}

// Claim: evidence that someone is working on an item.
message Claim {
  ClaimMechanism mechanism = 1;
  Person by = 2;
  google.protobuf.Timestamp at = 3;
  // Comment text or label name, capped at 4 KiB. Untrusted text.
  string text = 4;
  // True when the claim was made by this fleet (matched by its marker).
  bool by_fleet = 5;
}

// WorkItem: an issue or ticket that can drive a goal.
message WorkItem {
  fleet.type.v1.WorkItemRef ref = 1;
  // Untrusted text.
  string title = 2;
  WorkItemState state = 3;
  // The provider's own state name ("open", "In Review"). Untrusted text.
  string provider_state = 4;
  Person author = 5;
  repeated string labels = 6;
  repeated Person assignees = 7;
  repeated Claim claims = 8;
  // Change requests linked to this item (closing keywords, ticket keys).
  repeated fleet.type.v1.WorkItemRef linked_change_requests = 9;
  // For trackers: the repo(s) the work is expected to touch, when known.
  repeated fleet.type.v1.RepoRef repos = 10;
  google.protobuf.Timestamp updated_at = 11;
  // Body is fetched on demand only; this is its size in bytes.
  uint64 body_bytes = 12;
}

// CheckSummary: CI state of a change request, normalized.
message CheckSummary {
  uint32 passing = 1;
  uint32 failing = 2;
  uint32 pending = 3;
  uint32 skipped = 4;
  // Names of failing checks, capped at 32. Untrusted text.
  repeated string failing_names = 5;
}

// ReviewState is normalized across providers.
enum ReviewState {
  REVIEW_STATE_UNSPECIFIED = 0;
  REVIEW_STATE_APPROVED = 1;
  REVIEW_STATE_CHANGES_REQUESTED = 2;
  REVIEW_STATE_COMMENTED = 3;
}

message Review {
  Person by = 1;
  ReviewState state = 2;
  google.protobuf.Timestamp at = 3;
  // Unresolved review threads at the time of the review.
  uint32 open_threads = 4;
}

// ChangeRequest: a pull request (GitHub) or merge request (GitLab).
message ChangeRequest {
  fleet.type.v1.WorkItemRef ref = 1;
  fleet.type.v1.RepoRef repo = 2;
  // Untrusted text.
  string title = 3;
  WorkItemState state = 4;
  string provider_state = 5;
  // Untrusted text.
  string source_branch = 6;
  string target_branch = 7;
  string head_commit = 8;
  CheckSummary checks = 9;
  repeated Review reviews = 10;
  // Provider says it can merge now (no conflicts, required checks met).
  bool mergeable = 11;
  // Work items this change request closes or references.
  repeated fleet.type.v1.WorkItemRef linked_work_items = 12;
  Person author = 13;
  google.protobuf.Timestamp updated_at = 14;
  google.protobuf.Timestamp merged_at = 15;
}

// --- Provider service ------------------------------------------------------

// DescribeRequest asks an adapter what it supports.
message DescribeRequest {}

// DescribeResponse carries the adapter's capability declaration.
message DescribeResponse {
  IntegrationCapabilities capabilities = 1;
}

// ListWorkItemsRequest pages through a project's work items.
message ListWorkItemsRequest {
  // Project or repo path to list.
  string project = 1;
  // Only items updated after this time.
  google.protobuf.Timestamp updated_after = 2;
  // Opaque token from the previous page's next_page_token (AIP-158 names).
  string page_token = 3;
  uint32 page_size = 4;
}

// ListWorkItemsResponse is one page.
message ListWorkItemsResponse {
  repeated WorkItem items = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

// GetWorkItemRequest fetches one item, optionally with its body.
message GetWorkItemRequest {
  fleet.type.v1.WorkItemRef ref = 1;
  // Fetch the body (capped at 64 KiB).
  bool include_body = 2;
}

// GetWorkItemResponse.
message GetWorkItemResponse {
  WorkItem item = 1;
  // Untrusted text: it reaches agents with push rights only through the
  // trusted-issues gate.
  string body = 2;
}

// ListChangeRequestsRequest pages through a repo's change requests.
message ListChangeRequestsRequest {
  fleet.type.v1.RepoRef repo = 1;
  google.protobuf.Timestamp updated_after = 2;
  string page_token = 3;
  uint32 page_size = 4;
}

// ListChangeRequestsResponse is one page.
message ListChangeRequestsResponse {
  repeated ChangeRequest change_requests = 1;
  string next_page_token = 2;
}

// GetChangeRequestRequest fetches one change request.
message GetChangeRequestRequest {
  fleet.type.v1.WorkItemRef ref = 1;
}

// GetChangeRequestResponse.
message GetChangeRequestResponse {
  ChangeRequest change_request = 1;
}

// WatchRequest names the projects to watch.
message WatchRequest {
  repeated string projects = 1;
}

// WatchResponse is one change notice on the stream.
message WatchResponse {
  ChangeNotice notice = 1;
}

// ChangeNotice says something changed; the hub then fetches the details.
message ChangeNotice {
  fleet.type.v1.WorkItemRef ref = 1;
  google.protobuf.Timestamp at = 2;
}

// IntegrationProviderService is implemented once per provider. Read-only by
// design: the hub never writes to a provider (ADR 0005); claims, pushes and
// merges happen inside goals on workers with the developer's own tools.
service IntegrationProviderService {
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  rpc ListWorkItems(ListWorkItemsRequest) returns (ListWorkItemsResponse);
  rpc GetWorkItem(GetWorkItemRequest) returns (GetWorkItemResponse);
  rpc ListChangeRequests(ListChangeRequestsRequest) returns (ListChangeRequestsResponse);
  rpc GetChangeRequest(GetChangeRequestRequest) returns (GetChangeRequestResponse);
  // Change notices from webhooks or polling; optional (SYNC_MODE).
  rpc Watch(WatchRequest) returns (stream WatchResponse);
}
