// fleet.integration.v1: the provider-neutral model of work items and change
// requests (ADR 0012). GitHub is the first implementation; GitLab, Jira,
// Bitbucket and Linear fit the same shape. In v1 adapters are compiled into
// fleetd and implement IntegrationProviderService in-process; the same
// service can later be served by an out-of-process plugin without changing
// the hub. The hub API (fleet.hub.v1) mirrors these messages to the UI.
//
// Files: this one holds what an adapter declares (capabilities); model.proto
// the work item and change request shapes; sync.proto the vocabulary every
// call shares (cursors, validators, rate limits, typed errors); service.proto
// the RPCs.
//
// The hub owns the polling loop: cursors, ETags, rate-limit state, back-off
// and health live in the hub's store (03b W4). An adapter keeps no sync
// state of its own, so it can be replaced by a plugin and restarted at will;
// each call carries what the adapter needs and each response carries what the
// hub must remember (ADR 0019, 31).
//
// Everything a provider returns (titles, bodies, names, labels, URLs) is
// untrusted text.
syntax = "proto3";

package fleet.integration.v1;

import "fleet/type/v1/ids.proto";
import "fleet/type/v1/work.proto";

// IntegrationRole: what an integration is used for. One integration can
// have both roles (GitHub, GitLab) or one (Jira is a work tracker only).
enum IntegrationRole {
  INTEGRATION_ROLE_UNSPECIFIED = 0;
  // Lists work items, claims, labels: GitHub Issues, GitLab Issues, Jira.
  INTEGRATION_ROLE_WORK_TRACKER = 1;
  // Repos, change requests, checks, reviews, merges: GitHub, GitLab.
  INTEGRATION_ROLE_CODE_HOST = 2;
}

// ClaimMechanism: how "someone is working on this" is recorded.
enum ClaimMechanism {
  CLAIM_MECHANISM_UNSPECIFIED = 0;
  // A comment on the item (eshu's issue driver on GitHub).
  CLAIM_MECHANISM_COMMENT = 1;
  CLAIM_MECHANISM_ASSIGNEE = 2;
  CLAIM_MECHANISM_LABEL = 3;
  // Workflow status transition (Jira "In Progress").
  CLAIM_MECHANISM_STATUS = 4;
  CLAIM_MECHANISM_NONE = 5;
}

// SyncMode: how the hub learns about changes.
enum SyncMode {
  SYNC_MODE_UNSPECIFIED = 0;
  // Polling with conditional requests (GitHub ETags).
  SYNC_MODE_POLL_CONDITIONAL = 1;
  SYNC_MODE_POLL = 2;
  // Push notifications; needs a reachable hub URL.
  SYNC_MODE_WEBHOOK = 3;
}

// IntegrationCapabilities: what a provider adapter supports, so the hub
// never asks for something a provider can't do.
message IntegrationCapabilities {
  fleet.type.v1.ProviderKind provider = 1;
  repeated IntegrationRole roles = 2;
  repeated fleet.type.v1.WorkItemKind work_item_kinds = 3;
  repeated ClaimMechanism claim_mechanisms = 4;
  repeated SyncMode sync_modes = 5;
  // Code host: check results on change requests.
  bool checks = 6;
  // Code host: reviews with approve / request-changes.
  bool reviews = 7;
  // Code host: merge state and merge time are reported.
  bool merge_detection = 8;
  // Work items can be linked to change requests: GitHub closing keywords,
  // GitLab "Closes #", Jira keys in branch names or titles.
  bool cross_links = 9;
  // Labels exist and can feed the trusted-issues gate.
  bool labels = 10;
  // Adapter version, for compatibility checks.
  string adapter_version = 11;
  // How many source branches plus head commits one ListChangeRequests may
  // look up together (GitHub GraphQL: 50), so verification of N goals is not
  // N calls. 0 = no batching: the hub sends one value per request.
  uint32 max_batch_size = 12;
  // Open provider name ("github", "gitea"); the authority when set,
  // provider is a hint (ADR 0018 reconciled: webhooks and conditional
  // requests are sync_modes, claims are claim_mechanisms, merge_state is
  // merge_detection).
  string provider_name = 13;
  // Code host: PathExists is supported (the routine done rule
  // REPORT_WRITTEN needs it).
  bool path_exists = 14;
  // Labels come with who applied them and when (Label.applied_by), for the
  // labels the hub asks evidence for. Without it the label path of the
  // trusted-issues gate cannot pass: an unknown actor is never trusted.
  bool labels_with_actor = 15;
  // WorkItem.last_editor and last_edit_time are reported, so an edit by
  // someone outside the allow-list after the trust event is seen. Without it
  // no item of this integration passes the gate for auto-dispatch.
  bool edit_evidence = 16;
}

// Integration: one configured instance on the hub.
message Integration {
  fleet.type.v1.IntegrationId id = 1;
  fleet.type.v1.ProviderKind provider = 2;
  // Base URL or host ("https://github.com", "https://acme.atlassian.net").
  string base_url = 3;
  // Display name chosen by the owner.
  string label = 4;
  IntegrationCapabilities capabilities = 5;
  // Repos (code host) or projects (tracker) the owner chose to watch.
  repeated string watched = 6;
  // Open provider name; see IntegrationCapabilities.provider_name.
  string provider_name = 7;
}
