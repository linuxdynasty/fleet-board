// fleet.v1 commands: hub -> agent typed commands (ADR 0004 envelope), and
// agent -> hub ack, progress and result. No shell string anywhere; the agent
// re-checks every command against local policy, settings, role and
// capability. RunExec is reserved and not defined in v1.
syntax = "proto3";

package fleet.v1;

import "fleet/v1/common.proto";
import "fleet/v1/snapshot.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/linuxdynasty/fleet-board/api/fleet/v1;fleetv1";

// ===== Envelope =====

// Command is the envelope. The agent refuses expired (hub time), out-of-epoch
// and replayed commands; a known command_id returns its logged result.
message Command {
  // Idempotency key; unique per command.
  CommandId command_id = 1;
  // Connection epoch from HelloAck; commands from another epoch are refused.
  uint64 epoch = 2;
  // Per-epoch sequence, strictly increasing; a lower or equal seq is replayed.
  uint64 seq = 3;
  // Hub time.
  google.protobuf.Timestamp issued_at = 4;
  // Hub time. Default 2 min for interactive kinds, 30 min for dispatch.
  google.protobuf.Timestamp not_after = 5;
  Principal requested_by = 6;
  // Optional detached Ed25519 signature over the canonical envelope and kind
  // bytes, for deployments with a hardware signing key. Unused in v1.
  bytes sig = 7;
  // Capability this kind needs, so an unknown kind can still be answered
  // with STATUS_UNSUPPORTED and the capability name.
  Capability requires = 8;

  // Kinds are numbered by group: 10-19 probes, 20-39 tmux control, 40-49
  // goals and worktrees, 50-59 attach, 60-69 logs, 70-79 self-management.
  oneof kind {
    EnsureProbe ensure_probe = 10;
    StopProbe stop_probe = 11;

    EnsureSession ensure_session = 20;
    EnsureWindow ensure_window = 21;
    SendKeys send_keys = 22;
    Interrupt interrupt = 23;
    RespawnPane respawn_pane = 24;
    KillWindow kill_window = 25;
    CapturePane capture_pane = 26;
    RunHarnessCommand run_harness_command = 27;
    SetSessionAvailability set_session_availability = 28;

    Preflight preflight = 40;
    StartGoal start_goal = 41;
    StopGoal stop_goal = 42;
    EnsureWorktree ensure_worktree = 43;
    PruneWorktree prune_worktree = 44;
    EnsureGoalHooks ensure_goal_hooks = 45;

    OpenAttach open_attach = 50;
    CloseAttach close_attach = 51;

    SetLogCapture set_log_capture = 60;
    SetLogShipping set_log_shipping = 61;

    Drain drain = 70;
    Undrain undrain = 71;
  }

  // RunExec (raw exec): number and name reserved, not defined in v1;
  // capability "exec.raw" is likewise reserved and never advertised.
  reserved 99;
  reserved "run_exec";
}

// CommandAck: the agent received and persisted the command.
message CommandAck {
  CommandId command_id = 1;
  google.protobuf.Timestamp received_at = 2;
}

// CommandProgress reports one step of a composite command (G3, G4) as
// command_id+step. Never dropped. A FAILED step ends the composite.
message CommandProgress {
  CommandId command_id = 1;
  // Stable step name, e.g. "preflight", "ensure_worktree", "pick_session",
  // "ensure_window", "wait_ready", "type_goal", "confirm_goal_file".
  string step = 2;
  uint32 step_index = 3;
  uint32 step_count = 4;
  Status status = 5;
  ReasonCode reason = 6;
  google.protobuf.Timestamp at = 7;
  // Short diagnostic, no screen text. Capped at 1 KiB.
  string message = 8;
}

// CommandResult is the final outcome. Kept in the agent's local log and
// replayed until the hub acknowledges it (Snapshot.unacked_results).
message CommandResult {
  CommandId command_id = 1;
  Status status = 2;
  ReasonCode reason = 3;
  // Short diagnostic, no screen text unless the kind returns one. 1 KiB.
  string message = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp finished_at = 6;
  // Capability the agent lacks, for STATUS_UNSUPPORTED.
  Capability missing_capability = 7;

  oneof detail {
    EnsureSessionResult ensure_session = 20;
    EnsureWindowResult ensure_window = 21;
    CapturePaneResult capture_pane = 26;
    RunHarnessCommandResult run_harness_command = 27;
    PreflightResult preflight = 40;
    StartGoalResult start_goal = 41;
    StopGoalResult stop_goal = 42;
    EnsureWorktreeResult ensure_worktree = 43;
    GoalHooksState ensure_goal_hooks = 45;
    OpenAttachResult open_attach = 50;
  }
}

// ===== D1. Probes =====

// EnsureProbe: keep one idle harness session on the fleet-probe server for
// this account and run its usage command on schedule. Declarative.
message EnsureProbe {
  ProbeId probe_id = 1;
  AccountId account_id = 2;
  // Expected key; the agent refuses with ACCOUNT_MISMATCH if the harness
  // shows a different identity.
  AccountKey account_key = 3;
  Harness harness = 4;
  google.protobuf.Duration interval = 5;
  // Run once now in addition to the schedule (goal start/finish, D3 jump).
  bool run_now = 6;
}

// StopProbe tears the probe session down. Declarative.
message StopProbe {
  ProbeId probe_id = 1;
}

// ===== F. tmux control =====

// EnsureSession (F1): create or reuse a named session. Declarative.
message EnsureSession {
  SessionId session_id = 1;
  TmuxServerKind server = 2;
  // [a-z0-9][a-z0-9-]{0,31}, unique per machine.
  string name = 3;
  Workdir workdir = 4;
  // Optional harness to start through its adapter; empty = login shell.
  Harness harness = 5;
  // Resume (adapter ResumeArgs) instead of a fresh start.
  bool resume = 6;
  // Attach to an existing session of that name instead of failing.
  bool reuse = 7;
  // FLEET_OWNER value.
  string owner = 8;
  // Name for the first window; empty = settings template.
  string window_name = 9;
  GoalId goal_id = 10;
}

// EnsureSessionResult.
message EnsureSessionResult {
  TmuxSession session = 1;
  bool created = 2;
  // Pane where the harness or shell runs.
  PaneKey pane = 3;
}

// EnsureWindow (F2): same for a window in a session. Declarative.
message EnsureWindow {
  SessionTarget session = 1;
  // Name as it will show in the status bar.
  string window_name = 2;
  Workdir workdir = 3;
  Harness harness = 4;
  bool resume = 5;
  // Reuse a window of that name if it exists.
  bool reuse = 6;
  GoalId goal_id = 7;
}

// EnsureWindowResult.
message EnsureWindowResult {
  TmuxWindow window = 1;
  bool created = 2;
  PaneKey pane = 3;
}

// NamedKey is the closed set of non-literal keys SendKeys may type.
enum NamedKey {
  NAMED_KEY_UNSPECIFIED = 0;
  NAMED_KEY_ENTER = 1;
  NAMED_KEY_ESCAPE = 2;
  NAMED_KEY_TAB = 3;
  NAMED_KEY_BACKSPACE = 4;
  NAMED_KEY_UP = 5;
  NAMED_KEY_DOWN = 6;
  NAMED_KEY_LEFT = 7;
  NAMED_KEY_RIGHT = 8;
  NAMED_KEY_CTRL_C = 9;
}

// KeyInput is one literal string or one named key.
message KeyInput {
  oneof input {
    // Literal text, capped at 4 KiB; never interpreted by tmux.
    string literal = 1;
    NamedKey key = 2;
  }
}

// SendKeys (F3). NOT idempotent: a retry after UNKNOWN_OUTCOME is refused;
// the hub asks a person. Rate-limited per settings.
message SendKeys {
  PaneKey pane = 1;
  repeated KeyInput keys = 2;
  // Required when answering a prompt; PROMPT_GONE if it left the screen.
  PromptId answering_prompt = 3;
  // Refuse with PANE_BUSY unless the input line is empty (goal typing).
  bool require_empty_input_line = 4;
}

// Interrupt (F4): C-c to the pane. Idempotent in effect.
message Interrupt {
  PaneKey pane = 1;
}

// RespawnPane (F5): restart the harness in a dead or stuck pane through the
// adapter's ResumeArgs. Dangerous kind; may need local approval.
message RespawnPane {
  PaneKey pane = 1;
  Harness harness = 2;
  bool resume = 3;
}

// KillWindow (F6). Dangerous kind; may need local approval. Never used on
// windows the developer created unless requested_by is OWNER.
message KillWindow {
  WindowKey window = 1;
}

// CapturePane (E10).
message CapturePane {
  PaneKey pane = 1;
  // 0 = visible screen; otherwise the last N lines of history.
  uint32 last_lines = 2;
  bool keep_ansi = 3;
  // Cap for the returned text; the agent clamps to 256 KiB.
  uint32 max_bytes = 4;
}

// CapturePaneResult. Untrusted text.
message CapturePaneResult {
  string text = 1;
  bool truncated = 2;
  google.protobuf.Timestamp captured_at = 3;
}

// RunHarnessCommand (F8): type an allow-listed slash command at an idle
// prompt. Agent checks: in catalog (C4), catalog_hash current, class allowed
// for requested_by.role and local policy, ready pattern showing, input line
// empty. DENY-class commands are never typed.
message RunHarnessCommand {
  PaneKey pane = 1;
  // Including the leading slash, e.g. "/compact".
  string command = 2;
  // Arguments typed after the command, capped at 4 KiB. Never for
  // DESTRUCTIVE or DENY classes.
  string args = 3;
  // The class the hub believes; the agent refuses on mismatch.
  CommandClass expected_class = 4;
  string catalog_hash = 5;
}

// RunHarnessCommandResult.
message RunHarnessCommandResult {
  CommandClass class = 1;
  // Screen after the command settled, ANSI stripped, 64 KiB cap, when the
  // class is OBSERVE. Untrusted text.
  string screen = 2;
}

// SetSessionAvailability (E11): the developer marked a session "available
// for work" on the board (or cleared it). Idle is still decided locally.
message SetSessionAvailability {
  SessionTarget session = 1;
  bool available_for_work = 2;
}

// ===== G, H, I. Goals, worktrees, preflight =====

// WorktreeMode says who creates the goal's worktree.
enum WorktreeMode {
  WORKTREE_MODE_UNSPECIFIED = 0;
  // The agent runs EnsureWorktree before starting the harness.
  WORKTREE_MODE_AGENT_ENSURES = 1;
  // The repo's own goal driver creates worktrees; start in the main checkout.
  WORKTREE_MODE_REPO_DRIVER = 2;
}

// GoalSpec is everything the agent needs to preflight or start a goal.
message GoalSpec {
  GoalId goal_id = 1;
  SessionId session_id = 2;
  IssueRef issue = 3;
  Workdir workdir = 4;
  Harness harness = 5;
  AccountId account_id = 6;
  // Expected identity; ACCOUNT_MISMATCH if the harness shows another.
  AccountKey account_key = 7;
  // Consent acts written into the goal (ADR 0008), e.g. "push", "pr-open".
  repeated string consent = 8;
  // Goal text after "--". Capped at 4 KiB.
  string goal_text = 9;
  WorktreeMode worktree_mode = 10;
  // Branch for the worktree when the agent ensures it.
  string branch = 11;
}

// Preflight (I1): check without acting.
message Preflight {
  GoalSpec spec = 1;
}

// PreflightResult: ok, or every reason that failed.
message PreflightResult {
  bool ok = 1;
  repeated ReasonCode failures = 2;
  // One line per failure, no secrets. Untrusted where it echoes git/gh.
  repeated string details = 3;
  // Session the agent would reuse (E11), if any.
  PaneKey would_reuse = 4;
}

// StartGoal (G3): agent-side composite under one command_id so it survives
// a hub outage. Steps are reported as CommandProgress. Dispatch deadline.
message StartGoal {
  GoalSpec spec = 1;
  // Prefer this available idle session (E11); re-checked just before typing.
  PaneKey reuse_pane = 2;
  // Create a new window in this session when not reusing; empty = new
  // session named by the hub in spec.session_id.
  SessionTarget in_session = 3;
  // Empty = settings template "{harness} {repo}#{issue}".
  string window_name = 4;
  google.protobuf.Duration ready_timeout = 5;
  google.protobuf.Duration goal_file_timeout = 6;
  // Skip preflight (already run and passed within the last minute).
  bool skip_preflight = 7;
}

// StartGoalResult.
message StartGoalResult {
  PaneKey pane = 1;
  TmuxSession session = 2;
  bool reused_session = 3;
  // Worktree path when the agent ensured one.
  string worktree_path = 4;
  // First GoalState observed after typing the goal command.
  GoalState goal = 5;
}

// StopReason says why a goal is being stopped (G4).
enum StopReason {
  STOP_REASON_UNSPECIFIED = 0;
  STOP_REASON_RESERVE_LINE = 1;
  STOP_REASON_COOLDOWN = 2;
  STOP_REASON_DRAIN = 3;
  STOP_REASON_MOVE = 4;
  STOP_REASON_OWNER = 5;
  STOP_REASON_REVIEW_LOOP_CAP = 6;
}

// StopGoal (G4): ask the goal to push work in progress and write
// `BLOCKED: paused ... OWNER=fleet` through the adapter, then Interrupt
// after grace. Composite with progress steps "request_pause",
// "wait_blocked", "interrupt".
message StopGoal {
  GoalId goal_id = 1;
  PaneKey pane = 2;
  StopReason reason = 3;
  google.protobuf.Duration grace = 4;
  // Also kill the window after the goal is paused (drain and move).
  bool close_window = 5;
}

// StopGoalResult.
message StopGoalResult {
  GoalState goal = 1;
  bool interrupted = 2;
  bool window_closed = 3;
}

// EnsureWorktree (H2). Declarative: existing worktree on the same branch is
// OK; a different branch at that path is WORKTREE_EXISTS.
message EnsureWorktree {
  RepoKey repo = 1;
  GoalId goal_id = 2;
  string branch = 3;
  // Base ref for a new branch; empty = default branch.
  string base_ref = 4;
  // Relative path under the checkout; empty = agent default.
  string relative_path = 5;
}

// EnsureWorktreeResult.
message EnsureWorktreeResult {
  string path = 1;
  bool created = 2;
  BranchState branch = 3;
}

// PruneWorktree (H2): remove a goal worktree after merge and grace.
// WORKTREE_DIRTY unless allow_dirty, which needs ROLE_OWNER.
message PruneWorktree {
  RepoKey repo = 1;
  GoalId goal_id = 2;
  string path = 3;
  bool allow_dirty = 4;
  // Also delete the local branch.
  bool delete_branch = 5;
}

// EnsureGoalHooks (G1): install and verify the generic goal-protocol hooks
// for a harness in a checkout. Leaves repos that ship their own alone.
message EnsureGoalHooks {
  Harness harness = 1;
  Workdir workdir = 2;
  // Hook version the hub expects; the agent reports what it has.
  string expected_version = 3;
}

// ===== J. Attach, K. logs, M. drain =====

// OpenAttach (J1): open a Terminal stream for a PTY client attached through
// a grouped view session. Needs ROLE_VIEWER (read-only) or OPERATOR.
message OpenAttach {
  AttachId attach_id = 1;
  SessionTarget session = 2;
  uint32 cols = 3;
  uint32 rows = 4;
  // Hub drops input for viewers; the agent also enforces it.
  bool read_only = 5;
}

// OpenAttachResult.
message OpenAttachResult {
  // Grouped view session created for this attach.
  string view_session_name = 1;
}

// CloseAttach (J1).
message CloseAttach {
  AttachId attach_id = 1;
}

// SetLogCapture (K1): turn pipe-pane capture on or off for a developer's
// own session (goal panes are always captured).
message SetLogCapture {
  SessionTarget session = 1;
  bool enabled = 2;
}

// SetLogShipping (K2): pause or resume shipping (for example hub disk low).
// Capture continues into the spool while paused.
message SetLogShipping {
  bool paused = 1;
  string reason = 2;
}

// Drain (M4): finish current work, take nothing new. Never kills.
message Drain {
  string reason = 1;
}

// Undrain (M4). A local `fleet-agent drain` cannot be undone from the hub;
// the agent answers REJECTED_BY_POLICY with reason DRAINING.
message Undrain {}
