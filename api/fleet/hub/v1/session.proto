// fleet.hub.v1 sessions: every tmux session on every machine (fleet-started
// and the developer's own), their windows and panes, the latest pane
// summary, and the pane actions of the Session view. Each action that
// reaches a machine returns an Operation.
syntax = "proto3";

package fleet.hub.v1;

import "fleet/hub/v1/common.proto";
import "fleet/type/v1/harness.proto";
import "fleet/type/v1/ids.proto";
import "fleet/type/v1/principal.proto";
import "fleet/type/v1/work.proto";
import "google/protobuf/timestamp.proto";

// Pane is one tmux pane as the hub knows it.
message Pane {
  fleet.type.v1.PaneKey key = 1;
  uint32 index = 2;
  bool active = 3;
  // tmux pane_current_command. Untrusted text.
  string current_command = 4;
  // Detected from the process, never from the window name.
  fleet.type.v1.Harness harness = 5;
  // Volatile: at most one Watch message per 5 s when only activity changes
  // (02c, "Volatile fields"). The last output time is on PaneSummary.
  fleet.type.v1.Activity activity = 6;
  bool dead = 8;
  int32 exit_status = 9;
  fleet.type.v1.Availability availability = 10;
  bool log_capture = 11;
  uint32 cols = 12;
  uint32 rows = 13;
  // Goal running in this pane, if any.
  fleet.type.v1.GoalId goal = 14;
  // Account the pane spends from (SessionAccountLink), and the provider and
  // model shown on screen (OpenCode). Untrusted text.
  fleet.type.v1.AccountId account = 15;
  string provider = 16;
  string model = 17;
  // Open triage items for this pane, so the session view can draw strips.
  repeated TriageItemId open_triage = 18;
  // Where the pane works (repo, checkout, branch, dirty), when under an
  // allowed root. The planner reuses only panes whose repo is the goal's and
  // whose checkout is clean.
  fleet.type.v1.PaneWorkdir workdir = 19;
  // Last time a person typed into the pane (the typing banner, and the
  // 10-minute hold-off of nudges and goal control). Volatile: at most one
  // Watch message per 5 s when only it changes.
  google.protobuf.Timestamp last_input_time = 20;
  // The harness's ready pattern is on screen. Volatile like activity.
  bool ready_pattern_showing = 21;
}

// SessionWindow is one window as the status bar shows it.
message SessionWindow {
  fleet.type.v1.WindowKey key = 1;
  uint32 index = 2;
  // Untrusted text, 256 bytes.
  string name = 3;
  bool active = 4;
  bool automatic_rename = 5;
  repeated Pane panes = 6;
}

// SessionLogInfo describes one stored log stream of a session (K1, K3).
message SessionLogInfo {
  fleet.type.v1.LogStreamKey key = 1;
  uint64 raw_bytes = 2;
  uint64 stored_bytes = 3;
  google.protobuf.Timestamp first_time = 4;
  google.protobuf.Timestamp last_time = 5;
  // Bytes lost to the agent's spool cap.
  uint64 gap_bytes = 6;
}

// SessionSpec is what the owner chose for a session: terminal capture on a
// developer session. Covered by Session.version.
message SessionSpec {
  // Terminal capture turned on for a developer session (goal panes always).
  // SetLogCapture changes it; Pane.log_capture reports what the agent does.
  bool log_capture = 1;
}

// SessionState says whether the session still exists in tmux.
enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  // Present in the latest snapshot or events.
  SESSION_STATE_LIVE = 1;
  // Closed (SessionEvent CLOSED, or gone after a tmux server restart). The
  // row stays while its stored logs do (StoredSession), so a finished goal's
  // session can still be found and its logs read. Windows and panes are the
  // last known ones, marked dead.
  SESSION_STATE_ENDED = 2;
}

// SessionStatus is everything observed about a session: identity in tmux,
// windows and panes, attach count, stored logs. Not versioned.
message SessionStatus {
  google.protobuf.Timestamp observed_time = 1;
  // Watch hub_seq of the change that last touched this status.
  uint64 hub_seq = 2;

  fleet.type.v1.MachineId machine = 10;
  fleet.type.v1.TmuxServerKind server = 11;
  string server_start_id = 12;
  // tmux id like "$2".
  string tmux_id = 13;
  // As shown. Untrusted text, 256 bytes.
  string name = 14;
  bool started_by_fleet = 15;
  fleet.type.v1.Principal owner = 16;
  // Volatile: at most one Watch message per 5 s when only it changes.
  uint32 attached_clients = 17;
  repeated SessionWindow windows = 18;
  // Counters are volatile: at most one Watch message per 5 s.
  repeated SessionLogInfo logs = 19;
  // LIVE or ENDED. ListSessions and Watch return LIVE rows unless the filter
  // asks for `state = ENDED` or `state in (LIVE, ENDED)`.
  SessionState state = 20;
  // When it ended; unset while LIVE.
  google.protobuf.Timestamp end_time = 21;
}

// Session is one tmux session. The hub assigns a SessionId to every session
// it observes: fleet-started ones carry it in FLEET_SESSION_ID; the
// developer's own get one bound to (machine, server_start_id, tmux_id), so
// a tmux server restart yields new ids.
message Session {
  fleet.type.v1.SessionId id = 1;
  uint64 version = 2;
  google.protobuf.Timestamp create_time = 3;
  google.protobuf.Timestamp update_time = 4;

  SessionSpec spec = 10;
  SessionStatus status = 11;
}

// PaneSummary is the latest screen summary of one pane (E5; ADR 0013:
// latest only). Observed-only: version is a counter for dedupe, may skip
// values (Watch delivers latest-wins), and nothing takes expected_version.
message PaneSummary {
  fleet.type.v1.PaneKey pane = 1;
  uint64 version = 2;
  google.protobuf.Timestamp update_time = 4;

  fleet.type.v1.SessionId session = 10;
  fleet.type.v1.MachineId machine = 11;
  // Last lines, ANSI stripped, 4 KiB. Untrusted text.
  string last_lines = 12;
  google.protobuf.Timestamp last_output_time = 13;
  fleet.type.v1.Activity activity = 14;
}

// ListSessionsRequest. Filter and order_by names: 02c-hub-watch-and-filters.md.
message ListSessionsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string filter = 3;
  string order_by = 4;
}

// ListSessionsResponse.
message ListSessionsResponse {
  repeated Session sessions = 1;
  string next_page_token = 2;
}

// GetSessionRequest.
message GetSessionRequest {
  fleet.type.v1.SessionId id = 1;
}

// GetSessionResponse.
message GetSessionResponse {
  Session session = 1;
}

// CreateSessionRequest sends EnsureSession (F1).
message CreateSessionRequest {
  string request_id = 1;
  fleet.type.v1.MachineId machine = 2;
  // [a-z0-9][a-z0-9-]{0,31}, unique per machine.
  string name = 3;
  fleet.type.v1.TmuxServerKind server = 4;
  fleet.type.v1.Workdir workdir = 5;
  // Empty = login shell.
  fleet.type.v1.Harness harness = 6;
  string profile = 7;
  bool reuse = 8;
  string window_name = 9;
}

// CreateSessionResponse. The session id is assigned before the command is
// sent, so the UI can watch it appear.
message CreateSessionResponse {
  fleet.type.v1.SessionId session = 1;
  Operation operation = 2;
}

// SendKeysRequest sends SendKeys (F3) with purpose OPERATOR_TEXT: free text
// an operator types as a hint, only at a ready prompt with an empty input
// line (PANE_BUSY otherwise). Not for prompt answers: those go through
// DecideApproval, so every answer is bound to its prompt_id and audited
// once. Nudges and resume text are the scheduler's (SendKeysPurpose), never
// an API field.
message SendKeysRequest {
  string request_id = 1;
  fleet.type.v1.SessionId session = 2;
  fleet.type.v1.PaneKey pane = 3;
  repeated fleet.type.v1.KeyInput keys = 4;
}

// SendKeysResponse.
message SendKeysResponse {
  Operation operation = 1;
}

// InterruptPaneRequest sends Interrupt (F4).
message InterruptPaneRequest {
  string request_id = 1;
  fleet.type.v1.SessionId session = 2;
  fleet.type.v1.PaneKey pane = 3;
}

// InterruptPaneResponse.
message InterruptPaneResponse {
  Operation operation = 1;
}

// RunHarnessCommandRequest sends RunHarnessCommand (F8). DESTRUCTIVE-class
// commands create an Approval first; the operation is created once approved.
message RunHarnessCommandRequest {
  string request_id = 1;
  fleet.type.v1.SessionId session = 2;
  fleet.type.v1.PaneKey pane = 3;
  // Including the leading slash.
  string command = 4;
  string args = 5;
  fleet.type.v1.CommandClass expected_class = 6;
  string catalog_hash = 7;
}

// RunHarnessCommandResponse. For OBSERVE commands the screen arrives as
// Operation.output_text. A command that needs an approval returns the approval
// and no operation: nothing is sent, and no Operation exists, until the
// approval is approved (02m, "Actions that need an approval").
message RunHarnessCommandResponse {
  Operation operation = 1;
  // Set when the command waits for an approval.
  ApprovalId approval = 2;
}

// CapturePaneRequest sends CapturePane (E10). The visible screen
// (last_lines 0) is a live view; history lines (last_lines above 0) are
// terminal scrollback.
message CapturePaneRequest {
  string request_id = 1;
  fleet.type.v1.SessionId session = 2;
  fleet.type.v1.PaneKey pane = 3;
  // 0 = visible screen; otherwise the last N lines of history.
  uint32 last_lines = 4;
  bool keep_ansi = 5;
  uint32 max_bytes = 6;
}

// CapturePaneResponse. Text arrives as Operation.output_text, which only the
// requester and SCOPE_LOGS holders can read.
message CapturePaneResponse {
  Operation operation = 1;
}

// SetPaneAvailabilityRequest sends SetPaneAvailability (E11) with reason
// MARKED_ON_BOARD or CLEARED_ON_BOARD. The pane must run a harness; a session
// with several harness panes needs the one chosen.
message SetPaneAvailabilityRequest {
  string request_id = 1;
  fleet.type.v1.SessionId session = 2;
  fleet.type.v1.PaneKey pane = 3;
  bool available_for_work = 4;
  // Only with available_for_work true: allow /clear before a goal is typed
  // into this pane. Off by default; without it the scheduler types the goal
  // into the developer's existing context (goal.proto fresh_context rules).
  bool fresh_context_on_reuse = 5;
}

// SetPaneAvailabilityResponse.
message SetPaneAvailabilityResponse {
  Operation operation = 1;
}

// RespawnPaneRequest sends RespawnPane (F5); may wait for local approval.
message RespawnPaneRequest {
  string request_id = 1;
  fleet.type.v1.SessionId session = 2;
  fleet.type.v1.PaneKey pane = 3;
  bool resume = 4;
}

// RespawnPaneResponse.
message RespawnPaneResponse {
  Operation operation = 1;
}

// KillWindowRequest sends KillWindow (F6). A developer's window, unlike the
// fleet's own windows, also needs a principal whose role covers ROLE_OWNER (a
// narrowed device or token never does, 02d) and an approval.
message KillWindowRequest {
  string request_id = 1;
  fleet.type.v1.SessionId session = 2;
  fleet.type.v1.WindowKey window = 3;
}

// KillWindowResponse. Operation or approval, never both: a developer's window
// returns the approval and no operation until it is approved (02b).
message KillWindowResponse {
  Operation operation = 1;
  ApprovalId approval = 2;
}

// SetLogCaptureRequest sends SetLogCapture (K1) for a developer session.
message SetLogCaptureRequest {
  string request_id = 1;
  fleet.type.v1.SessionId session = 2;
  bool enabled = 3;
}

// SetLogCaptureResponse.
message SetLogCaptureResponse {
  Operation operation = 1;
}
