// fleet.hub.v1 machines: the Fleet view's machine cards, drain, enrollment
// and removal. Built by the hub from snapshots and events; never the agent's
// Snapshot itself.
syntax = "proto3";

package fleet.hub.v1;

import "fleet/hub/v1/common.proto";
import "fleet/type/v1/harness.proto";
import "fleet/type/v1/ids.proto";
import "fleet/type/v1/settings.proto";
import "fleet/type/v1/status.proto";
import "fleet/type/v1/work.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

// MachineState is the hub-side connection state (03-workflows W1, W2).
enum MachineState {
  MACHINE_STATE_UNSPECIFIED = 0;
  // Enrolled, never connected.
  MACHINE_STATE_ENROLLED = 1;
  MACHINE_STATE_ONLINE = 2;
  // No heartbeat for 45 s.
  MACHINE_STATE_STALE = 3;
  // 3 min without heartbeat, or Bye.
  MACHINE_STATE_OFFLINE = 4;
  // Revoked by the owner (RevokeMachine): its certificate serials are on the
  // revocation list and every Hello gets Bye{REVOKED}. The row, its history
  // and its audit trail stay until DeleteMachine. The machine comes back only
  // by re-enrolling with a new token that names it as previous_machine, which
  // returns the same machine id to ENROLLED with fresh certificate serials.
  MACHINE_STATE_REVOKED = 5;
}

// HarnessHealth is the hub's state per (machine, harness) (03e W11).
enum HarnessHealth {
  HARNESS_HEALTH_UNSPECIFIED = 0;
  HARNESS_HEALTH_SUPPORTED = 1;
  // Runs, some parsers unverified (VERSION_SUPPORT_UNVERIFIED_PARSING).
  HARNESS_HEALTH_UNVERIFIED_PARSING = 2;
  // 3 consecutive parse failures on a supported version.
  HARNESS_HEALTH_PARSER_DEGRADED = 3;
  HARNESS_HEALTH_UNSUPPORTED = 4;
  // Detection failed twice; binary gone.
  HARNESS_HEALTH_MISSING = 5;
}

// MachineHarness is one harness (and profile) installed on a machine.
message MachineHarness {
  fleet.type.v1.Harness harness = 1;
  // Empty = the harness default; one profile per harness for now.
  string profile = 2;
  // As the binary reports it. Untrusted text.
  string version = 3;
  fleet.type.v1.VersionSupport version_support = 4;
  repeated fleet.type.v1.ParserSupport parser_support = 5;
  HarnessHealth health = 6;
  fleet.type.v1.CommandCatalog catalog = 7;
  fleet.type.v1.GoalHooksState goal_hooks = 8;
  // /goal subcommands and pause and resume modes for this version.
  fleet.type.v1.GoalControl goal_control = 13;
  bool prompt_detection_verified = 9;
  bool launch_allowed = 10;
  // Account this harness/profile is signed in to, once the hub mapped it.
  fleet.type.v1.AccountId account = 11;
  bool signed_in = 12;
}

// MachineForgeCli is a code-host CLI's sign-in state (gh, glab).
message MachineForgeCli {
  string tool = 1;
  fleet.type.v1.ProviderKind provider = 2;
  string provider_name = 3;
  string host = 4;
  bool signed_in = 5;
  // Untrusted text.
  string user = 6;
  repeated MachineRepoAccess access = 7;
  google.protobuf.Timestamp checked_time = 8;
}

// MachineRepoAccess is push access to one repo as the forge CLI sees it.
message MachineRepoAccess {
  fleet.type.v1.RepoRef repo = 1;
  bool push_access = 2;
  // GitHub READ..ADMIN, GitLab Guest..Owner. Untrusted text.
  string provider_permission = 3;
}

// MachineRepo is one checkout or worktree on the machine.
message MachineRepo {
  fleet.type.v1.RepoRef repo = 1;
  string path = 2;
  bool is_worktree = 3;
  fleet.type.v1.GoalId goal = 4;
  repeated fleet.type.v1.HarnessGoalHooks goal_hooks = 5;
  // Untrusted text.
  string branch = 6;
  bool dirty = 7;
}

// MachineSlots are the two per-machine limits (design.md dispatch rules).
message MachineSlots {
  uint32 active_used = 1;
  uint32 active_max = 2;
  uint32 total_used = 3;
  uint32 total_max = 4;
}

// MachineDrain is the owner's drain request (M4). The hub sets it when
// DrainMachine or UndrainMachine is accepted; MachineStatus.draining is what
// the agent reports back, which also covers a local `fleet-agent drain`.
message MachineDrain {
  bool draining = 1;
  string reason = 2;
  fleet.type.v1.Principal by = 3;
  google.protobuf.Timestamp drain_time = 4;
}

// MachineRevocation records RevokeMachine. Set once and never cleared.
message MachineRevocation {
  google.protobuf.Timestamp revoke_time = 1;
  fleet.type.v1.Principal by = 2;
  // Up to 512 bytes.
  string reason = 3;
}

// MachineSpec is what the owner and hub decided about a machine. Covered by
// Machine.version and expected_version.
message MachineSpec {
  // Owner-chosen name (hostname by default).
  string display_name = 1;
  // Hub-assigned labels; local additions show in MachineStatus.labels.
  repeated string labels = 2;
  MachineDrain drain = 3;
  // Set once the machine is revoked (status.state is then REVOKED).
  MachineRevocation revocation = 4;
}

// MachineTelemetry is the heartbeat-fed part of the status: it changes every
// few seconds and is never worth a Watch message on its own. A change that
// only touches telemetry reaches Watch at most once per 30 s per machine
// (02c-hub-watch-and-filters.md, "Volatile fields").
message MachineTelemetry {
  google.protobuf.Timestamp last_seen_time = 1;
  bool on_battery = 2;
  fleet.type.v1.Percent battery = 3;
  double load1 = 4;
  uint64 mem_available_bytes = 5;
  // Agent clock minus hub clock: the median of the last five samples
  // (Hello.sent_time at connect, then Heartbeat.sent_time), each taken
  // against the hub's receive time. A warning above 5 minutes.
  google.protobuf.Duration clock_skew = 6;
  // True above 15 minutes: the hub orders this machine's data by its own
  // receive time and ignores its readings when choosing the newest reading of
  // an account (02i, "Clocks").
  bool clock_untrusted = 7;
}

// MachineStatus is everything observed about a machine: connection state,
// facts, inventories, effective settings. Not versioned; observed_time and
// hub_seq order it (02b-hub-api.md, "Versions and ETags").
message MachineStatus {
  google.protobuf.Timestamp observed_time = 1;
  // Watch hub_seq of the change that last touched this status.
  uint64 hub_seq = 2;

  MachineState state = 10;
  // Facts (B1). Untrusted text where noted on the agent wire.
  string hostname = 11;
  string os = 12;
  string os_version = 13;
  string arch = 14;
  uint32 cpu_count = 15;
  uint64 ram_bytes = 16;
  string timezone = 17;
  // Login user, for the copyable ssh line.
  string username = 18;
  string agent_version = 19;
  string tmux_version = 20;
  bool container = 21;
  bool is_hub = 22;
  // Effective labels: hub-assigned (spec.labels) plus local additions.
  repeated string labels = 23;
  // Effective drain: the hub's request or a local drain, as reported.
  bool draining = 24;
  MachineSlots slots = 25;
  uint32 available_sessions = 26;
  repeated MachineHarness harnesses = 27;
  repeated MachineForgeCli forge_cli = 28;
  repeated MachineRepo repos = 29;
  string policy_hash = 30;
  bool policy_changed_since_load = 31;
  fleet.type.v1.EffectiveSettings effective_settings = 32;
  // Settings fields the local policy capped.
  repeated string capped_settings = 33;
  // Settings fields the agent refused (invalid value, or safe mode), from
  // the last SettingsAck. The previous effective value stands.
  repeated fleet.type.v1.SettingRejection rejected_settings = 38;
  // Names of settings the hub sent that this agent's version does not know,
  // so they are NOT enforced there. Derived from
  // SettingsAck.unrecognized_value_fields; empty when the agent is current.
  repeated string unenforced_settings = 39;
  // The agent runs in policy safe mode (observe only); policy_error is the
  // one-line reason from the agent.
  bool policy_safe_mode = 40;
  string policy_error = 41;
  google.protobuf.Timestamp cert_not_after_time = 34;
  repeated fleet.type.v1.Capability capabilities = 35;
  string install_id = 36;
  MachineTelemetry telemetry = 37;
}

// Machine is one enrolled worker.
message Machine {
  fleet.type.v1.MachineId id = 1;
  uint64 version = 2;
  google.protobuf.Timestamp create_time = 3;
  google.protobuf.Timestamp update_time = 4;

  MachineSpec spec = 10;
  MachineStatus status = 11;
}

// ListMachinesRequest. Filter and order_by names: 02c-hub-watch-and-filters.md.
message ListMachinesRequest {
  int32 page_size = 1;
  string page_token = 2;
  string filter = 3;
  string order_by = 4;
}

// ListMachinesResponse.
message ListMachinesResponse {
  repeated Machine machines = 1;
  string next_page_token = 2;
}

// GetMachineRequest.
message GetMachineRequest {
  fleet.type.v1.MachineId id = 1;
}

// GetMachineResponse.
message GetMachineResponse {
  Machine machine = 1;
}

// UpdateMachineRequest. Updatable: spec.display_name, spec.labels. spec.drain
// changes only through DrainMachine and UndrainMachine; status is output-only.
message UpdateMachineRequest {
  string request_id = 1;
  Machine machine = 2;
  google.protobuf.FieldMask update_mask = 3;
  uint64 expected_version = 4;
}

// UpdateMachineResponse.
message UpdateMachineResponse {
  Machine machine = 1;
}

// DrainMachineRequest sends Drain (M4).
message DrainMachineRequest {
  string request_id = 1;
  fleet.type.v1.MachineId id = 2;
  // Up to 512 bytes.
  string reason = 3;
}

// DrainMachineResponse.
message DrainMachineResponse {
  Operation operation = 1;
  // The machine with spec.drain already set (version bumped).
  Machine machine = 2;
}

// UndrainMachineRequest sends Undrain; a local drain answers
// REJECTED_BY_POLICY / DRAINING in the operation.
message UndrainMachineRequest {
  string request_id = 1;
  fleet.type.v1.MachineId id = 2;
}

// UndrainMachineResponse.
message UndrainMachineResponse {
  Operation operation = 1;
  Machine machine = 2;
}

// RevokeMachineRequest cuts a machine off and keeps its row (03-workflows.md,
// "Revoke and delete"). In one transaction the hub adds every certificate
// serial of the machine to the revocation list, marks it REVOKED and ends its
// goals; after commit it sends Bye{REVOKED} on the live Connect stream and
// closes that agent's Terminal, SessionLog and attach streams, so a stolen
// laptop stops receiving commands at once instead of at its next reconnect.
// Idempotent: a revoked machine returns itself.
message RevokeMachineRequest {
  string request_id = 1;
  fleet.type.v1.MachineId id = 2;
  uint64 expected_version = 3;
  // Up to 512 bytes; shown in the audit log.
  string reason = 4;
}

// RevokeMachineResponse.
message RevokeMachineResponse {
  Machine machine = 1;
}

// DeleteMachineRequest forgets a machine that is already REVOKED (a machine
// in any other state is FAILED_PRECONDITION / MACHINE_NOT_REVOKED). The row
// and the rows that only make sense with it (connections, outbox, probes,
// inventory, attaches) are removed; sessions, goals and logs it ran keep
// their history under the machine id, and the audit log keeps everything.
// After delete, `previous_machine` of an enrollment token can no longer name it.
message DeleteMachineRequest {
  string request_id = 1;
  fleet.type.v1.MachineId id = 2;
  uint64 expected_version = 3;
}

// DeleteMachineResponse.
message DeleteMachineResponse {}

// CreateEnrollmentTokenRequest: the API form of `fleetd enroll-token`.
message CreateEnrollmentTokenRequest {
  string request_id = 1;
  // Name the machine will get; also the expected hostname for the warning.
  string machine_name = 2;
  // At most 24 h; default 15 min.
  google.protobuf.Duration ttl = 3;
  // Set to re-enroll a known machine (EnrollRequest.previous_machine_id). The
  // machine must be REVOKED or past its certificate lifetime
  // (FAILED_PRECONDITION / MACHINE_NOT_REENROLLABLE otherwise), and its row
  // must still exist (not deleted).
  fleet.type.v1.MachineId previous_machine = 4;
}

// CreateEnrollmentTokenResponse. The token is shown once and stored only as
// a hash, and it is excluded from the stored idempotent response: a retry
// with the same request_id inside the idempotency window fails with
// ALREADY_EXISTS / SECRET_ALREADY_DELIVERED and the owner creates a new one.
message CreateEnrollmentTokenResponse {
  // Self-describing: `fbe1_<base64url of: version byte, SHA-256 of the fleet
  // CA certificate, 32 random secret bytes>`. The agent checks the server
  // chain against the embedded fingerprint before it sends the token or a
  // CSR (the trust anchor, 02g-agent-security.md), so nothing needs comparing
  // by eye. Only the hash of the secret part is stored.
  string token = 1;
  google.protobuf.Timestamp expire_time = 2;
  // SHA-256 of the CA certificate (hex), the one inside the token, for an
  // owner who wants to check it out of band.
  string ca_fingerprint = 3;
  // Ready-to-copy `fleet-agent enroll --token …` line (plus `--hub <address>`
  // when the hub has more than one).
  string enroll_command = 4;
}
