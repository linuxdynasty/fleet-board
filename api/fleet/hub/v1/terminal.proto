// fleet.hub.v1 terminal and logs: browser attach to a live session (J1) and
// reading stored session logs (K1, K3). The hub bridges AttachTerminal to the
// agent's Terminal stream; it never interprets the bytes. Transport (step 4,
// ADR 0016): the CLI uses Connect or gRPC bidirectional streaming over
// HTTP/2; a browser cannot stream a request body, so it sends these same
// messages (AttachTerminalRequest and AttachTerminalResponse, not the agent
// wire's TermUp and TermDown), protobuf-encoded, one per binary frame over a
// WebSocket. The WebSocket rules (path, subprotocol, ticket, Origin and Host
// checks, framing, close codes) are in docs/specs/02f-hub-authentication.md.
syntax = "proto3";

package fleet.hub.v1;

import "fleet/type/v1/harness.proto";
import "fleet/type/v1/ids.proto";
import "fleet/type/v1/status.proto";
import "google/protobuf/timestamp.proto";

// CreateAttachTicketRequest asks for a short-lived, single-use ticket that
// opens one attach over a WebSocket. The ticket exists because a WebSocket
// upgrade carries ambient authority (the cookie, or none at all in
// local_trusted mode) and a page on another site can open one; it cannot
// call this RPC, because the Host and Origin checks refuse it.
message CreateAttachTicketRequest {
  string request_id = 1;
  fleet.type.v1.SessionId session = 2;
  // False asks for input; the hub clamps it to true for a caller without
  // SCOPE_SESSIONS_WRITE and the attach opens read-only.
  bool read_only = 3;
}

// CreateAttachTicketResponse. The ticket is a secret: 256-bit random, bound
// to the caller's principal, the session, the read_only flag and the Origin of
// the request that created it; valid for 60 s; burned by the first AttachOpen
// that presents it, whether or not the attach then succeeds. It is excluded
// from the stored idempotent response (a replay is ALREADY_EXISTS /
// SECRET_ALREADY_DELIVERED) and never appears in a URL.
message CreateAttachTicketResponse {
  string ticket = 1;
  google.protobuf.Timestamp expire_time = 2;
  // True when the hub clamped the request to read-only.
  bool read_only = 3;
}

// AttachOpen is the first message: which session, size and mode. The hub
// sends OpenAttach to the agent; read_only is forced for callers without
// SCOPE_SESSIONS_WRITE.
message AttachOpen {
  string request_id = 1;
  // Must equal the ticket's session (or be empty) when a ticket is used.
  fleet.type.v1.SessionId session = 2;
  uint32 cols = 3;
  uint32 rows = 4;
  // May only tighten the ticket's mode.
  bool read_only = 5;
  // From CreateAttachTicket. Required on the WebSocket transport (the first
  // frame must be an AttachOpen carrying it); not used over HTTP/2, where
  // the request headers authenticate the stream.
  string ticket = 6;
}

// AttachResize changes the PTY size.
message AttachResize {
  uint32 cols = 1;
  uint32 rows = 2;
}

// AttachSelect switches the view session's window or pane (TermSelect).
message AttachSelect {
  oneof target {
    fleet.type.v1.WindowKey window = 1;
    fleet.type.v1.PaneKey pane = 2;
  }
}

// AttachClose detaches; the view session is destroyed.
message AttachClose {}

// AttachTerminalRequest: client -> hub.
message AttachTerminalRequest {
  oneof body {
    AttachOpen open = 1;
    // Keystrokes, at most 4 KiB per message; dropped for read-only.
    bytes input = 2;
    AttachResize resize = 3;
    AttachSelect select = 4;
    AttachClose close = 5;
    AttachAck ack = 6;
  }
}

// AttachAck is the browser's flow control (ADR 0016): sent after the
// terminal has written output, at least every 32 KiB written or 200 ms while
// output flows. The hub stops reading the agent's Terminal stream while
// output_bytes_sent - bytes_written exceeds its high-water mark (256 KiB), so
// HTTP/2 flow control blocks the agent's PTY read and no output is dropped.
// Neither WebSocket nor xterm.js has backpressure of its own. A client that
// sends no ack for 30 s while output waits is closed (HUB_CLOSED).
message AttachAck {
  // Total output bytes the client has written to its terminal so far.
  uint64 bytes_written = 1;
}

// AttachReady: the PTY is open; output follows.
message AttachReady {
  fleet.type.v1.AttachId attach_id = 1;
  string view_session_name = 2;
  uint32 cols = 3;
  uint32 rows = 4;
  bool read_only = 5;
  // The command id of OpenAttach, for the audit trail.
  fleet.type.v1.CommandId command_id = 6;
}

// AttachClosed ends the stream. It is also the error channel: a WebSocket has
// no Connect error trailer, so a refused or failed attach is sent as
// AttachClosed{reason: ERROR, error} before the socket closes, with the same
// ErrorDetail an RPC error would carry. Failures before the upgrade (no
// credentials, bad Host or Origin) are plain HTTP 401/403 responses whose
// JSON body carries the ErrorDetail. 02f maps reasons to WebSocket close codes.
message AttachClosed {
  fleet.type.v1.AttachCloseReason reason = 1;
  // Set when reason is ERROR: ATTACH_TICKET_INVALID, SCOPE_MISSING,
  // MACHINE_OFFLINE, RESOURCE_NOT_FOUND, DEVICE_NOT_ACTIVE, RATE_LIMITED, ...
  fleet.type.v1.ErrorDetail error = 2;
}

// AttachTerminalResponse: hub -> client.
message AttachTerminalResponse {
  oneof body {
    AttachReady ready = 1;
    // Raw terminal bytes, at most 64 KiB per message; OSC 52 and
    // hyperlinks already stripped by the agent.
    bytes output = 2;
    AttachClosed closed = 3;
  }
}

// ReadSessionLogRequest reads one stored stream, from an offset or a time.
message ReadSessionLogRequest {
  fleet.type.v1.LogStreamKey key = 1;
  oneof start {
    uint64 start_offset = 2;
    google.protobuf.Timestamp start_time = 3;
  }
  // Stop after this many raw bytes; 0 = to the end (or follow).
  uint64 max_bytes = 4;
  // Keep the stream open and send new data as it is stored.
  bool follow = 5;
}

// ReadSessionLogResponse is one decompressed span of the raw stream.
message ReadSessionLogResponse {
  uint64 offset = 1;
  // Raw bytes (terminal output with escape sequences, or transcript text).
  // Untrusted. At most 256 KiB per message.
  bytes data = 2;
  // Bytes missing before this span (agent spool cap).
  uint64 gap_before = 3;
  google.protobuf.Timestamp first_byte_time = 4;
  google.protobuf.Timestamp last_byte_time = 5;
  // The stream ended (pane exited, capture off).
  bool final = 6;
}
