// fleet.hub.v1 settings and audit. Settings are layered fleet -> group ->
// machine (ADR 0009) and delivered to agents as fleet.type.v1.SettingValues,
// the same message edited here. HubSettings are hub-only owner choices that
// never reach an agent. The audit log is append-only.
syntax = "proto3";

package fleet.hub.v1;

import "fleet/hub/v1/common.proto";
import "fleet/type/v1/consent.proto";
import "fleet/type/v1/ids.proto";
import "fleet/type/v1/settings.proto";
import "fleet/type/v1/status.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

// SettingsScope names one settings layer.
message SettingsScope {
  // The fleet default layer has no parameters.
  message Fleet {}
  oneof kind {
    // The fleet default layer.
    Fleet fleet = 1;
    // A machine group, named by label.
    string group_label = 2;
    fleet.type.v1.MachineId machine = 3;
  }
}

// HubSettings are fleet-wide owner choices the hub applies itself.
message HubSettings {
  // Pause WORKING goals at an account's reserve line (design.md rule 5).
  optional bool auto_pause_at_reserve = 1;
  optional uint32 max_parallel_goals_per_repo = 2;
  repeated fleet.type.v1.ConsentAct default_consent = 3;
  // Trusted-issues gate: label and allow-listed provider logins.
  optional string trusted_label = 4;
  repeated string trusted_users = 5;
  optional bool prefer_non_hub = 6;
  // Master switch for auto-dispatch (manual dispatch always works).
  optional bool auto_dispatch = 7;
  optional google.protobuf.Duration triage_expiry = 8;
  // How long an approval waits before its fallback applies.
  optional google.protobuf.Duration approval_timeout = 9;
  // Sign-in (authenticated mode, ADR 0019). Both default to on once the
  // owner has registered the credential type; turning off the last method
  // any active user can still use is refused (LAST_CREDENTIAL).
  optional bool passkey_sign_in = 10;
  // Needs the GitHub App's user-authorization settings (client id and
  // secret) in the hub's configuration; otherwise SIGN_IN_METHOD_DISABLED.
  optional bool github_sign_in = 11;
  // Browser session limits: sign out after this long without use (default 7
  // days) and after this long in all (default 30 days).
  optional google.protobuf.Duration session_idle_timeout = 12;
  optional google.protobuf.Duration session_max_age = 13;
}

// SettingsSpec is what the owner set for one layer. Covered by
// Settings.version.
message SettingsSpec {
  SettingsScope scope = 1;
  fleet.type.v1.SettingValues values = 2;
  // Groups only: higher wins when a machine is in several groups.
  int32 priority = 3;
  // Only the fleet layer has hub settings.
  HubSettings hub = 4;
}

// SettingsStatus is where delivery to agents stands. Not versioned, so a
// delivery acknowledgement never makes an open settings form stale.
message SettingsStatus {
  google.protobuf.Timestamp observed_time = 1;
  // Watch hub_seq of the change that last touched this status.
  uint64 hub_seq = 2;
  // Generation and epoch this layer was last delivered under.
  uint64 generation = 10;
  string settings_epoch = 11;
}

// Settings is one layer, fleet -> group -> machine.
message Settings {
  SettingsId id = 1;
  uint64 version = 2;
  google.protobuf.Timestamp create_time = 3;
  google.protobuf.Timestamp update_time = 4;

  SettingsSpec spec = 10;
  SettingsStatus status = 11;
}

// GetSettingsRequest.
message GetSettingsRequest {
  SettingsScope scope = 1;
}

// GetSettingsResponse.
message GetSettingsResponse {
  Settings settings = 1;
}

// ListSettingsRequest lists every layer (fleet, groups, machines).
message ListSettingsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string filter = 3;
  string order_by = 4;
}

// ListSettingsResponse.
message ListSettingsResponse {
  repeated Settings settings = 1;
  string next_page_token = 2;
}

// UpdateSettingsRequest creates the layer if it does not exist (the id is
// derived from settings.spec.scope). Masks name fields of Settings, e.g.
// "spec.values.max_active", "spec.hub.auto_dispatch"; status is output-only.
message UpdateSettingsRequest {
  string request_id = 1;
  Settings settings = 2;
  google.protobuf.FieldMask update_mask = 3;
  uint64 expected_version = 4;
}

// UpdateSettingsResponse. Delivery to agents shows in each Machine's
// effective_settings, capped_settings, rejected_settings and
// unenforced_settings.
message UpdateSettingsResponse {
  Settings settings = 1;
}

// AuditEntry is one row of the permanent audit log. Immutable: version is
// always 1 and update_time equals create_time.
message AuditEntry {
  AuditEntryId id = 1;
  uint64 version = 2;
  google.protobuf.Timestamp create_time = 3;
  google.protobuf.Timestamp update_time = 4;

  // Who did it. For a decision at the machine (local approval, local drain,
  // policy change) the actor is Principal{kind LOCAL_USER, id "local:<os
  // user>"}; for a policy file change nobody is named, so the agent's own OS
  // user stands in.
  fleet.type.v1.Principal actor = 10;
  // Dotted action name, e.g. "goal.start", "approval.decide",
  // "settings.update", "device.revoke". An open vocabulary, so clients show
  // it as text, but every name in use is listed in the catalogue in
  // docs/specs/02b-hub-api.md ("Audit actions"); a new action is added there
  // in the same change.
  string action = 11;
  // Resource the action touched, as "<collection>/<id>".
  string target = 12;
  fleet.type.v1.MachineId machine = 13;
  fleet.type.v1.GoalId goal = 14;
  fleet.type.v1.CommandId command = 15;
  string request_id = 16;
  // Final outcome when known (commands), else OK.
  fleet.type.v1.Status outcome = 17;
  fleet.type.v1.ReasonCode reason = 18;
  // Short detail (the typed goal line, the decided option). No secrets.
  string detail = 19;
  // When the thing happened, if not when the hub recorded it: for a decision
  // made at the machine (actor kind LOCAL_USER) it is the agent's own
  // decided_time (agent clock). Unset otherwise; create_time is then it.
  google.protobuf.Timestamp occurred_time = 20;
}

// ListAuditEntriesRequest. Filter and order_by names:
// 02c-hub-watch-and-filters.md. Default order: newest first. CSV export is
// the CLI paging through this.
message ListAuditEntriesRequest {
  int32 page_size = 1;
  string page_token = 2;
  string filter = 3;
  string order_by = 4;
}

// ListAuditEntriesResponse.
message ListAuditEntriesResponse {
  repeated AuditEntry audit_entries = 1;
  string next_page_token = 2;
}
