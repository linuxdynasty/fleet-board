// fleet.hub.v1 FleetService: the hub API for the web UI, the `fleet` CLI and
// later a phone (ADR 0018). Served by fleetd over gRPC, gRPC-Web and
// Connect JSON from the same handlers (ADR 0003). Conventions (resources,
// paging, request_id idempotency, versions as ETags, Operations, Watch,
// scopes, errors) are in docs/specs/02b-hub-api.md; the Watch grammar and
// filter fields in 02c-hub-watch-and-filters.md. Each RPC opens with its SCOPE
// and RELEASE tags, the one home of those facts (ADR 0026); the tag grammar is
// in docs/specs/02e-contract-rules.md ("Comment tags"), and 02d and 02k table
// the tags, generated by scripts/gen-doc-tables.py.
// How callers authenticate (session cookie, API token, signed device request,
// the local owner) and the WebSocket rules for AttachTerminal are in
// docs/specs/02f-hub-authentication.md.
syntax = "proto3";

package fleet.hub.v1;

import "fleet/hub/v1/account.proto";
import "fleet/hub/v1/admin.proto";
import "fleet/hub/v1/auth.proto";
import "fleet/hub/v1/common.proto";
import "fleet/hub/v1/config.proto";
import "fleet/hub/v1/device.proto";
import "fleet/hub/v1/goal.proto";
import "fleet/hub/v1/goal_dispatch.proto";
import "fleet/hub/v1/goal_history.proto";
import "fleet/hub/v1/insight_report.proto";
import "fleet/hub/v1/insights.proto";
import "fleet/hub/v1/log_store.proto";
import "fleet/hub/v1/machine.proto";
import "fleet/hub/v1/repo.proto";
import "fleet/hub/v1/routine.proto";
import "fleet/hub/v1/session.proto";
import "fleet/hub/v1/settings.proto";
import "fleet/hub/v1/suggestion.proto";
import "fleet/hub/v1/system.proto";
import "fleet/hub/v1/terminal.proto";
import "fleet/hub/v1/token.proto";
import "fleet/hub/v1/triage.proto";
import "fleet/hub/v1/watch.proto";
import "fleet/hub/v1/work.proto";

// FleetService is everything a person-facing client can do.
service FleetService {
  // --- Server, summary, changes ---------------------------------------------

  // [SCOPE none]
  // [RELEASE v1 12]
  // API version, features, auth mode, sign-in methods, whether the hub is
  // waiting to be claimed, the caller. Works before sign-in.
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse);
  // [SCOPE READ|APPROVALS]
  // [RELEASE v1 12]
  // The summary strip.
  rpc GetFleetSummary(GetFleetSummaryRequest) returns (GetFleetSummaryResponse);
  // [SCOPE per-topic]
  // [RELEASE v1 12]
  // Resource changes, one filter per topic; resumable. The scope each topic
  // needs is on its WatchTopic value; a topic the caller cannot read is refused
  // when the stream opens.
  rpc Watch(WatchRequest) returns (stream WatchResponse);
  // [SCOPE READ] or the principal that requested the operation
  // [RELEASE v1 12]
  // One operation (an agent command and its outcome). output_text is returned
  // only to the requester and to `LOGS` holders (02d).
  rpc GetOperation(GetOperationRequest) returns (GetOperationResponse);

  // --- Machines (Machines view) ----------------------------------------------

  // [SCOPE READ]
  // [RELEASE v1 12]
  rpc ListMachines(ListMachinesRequest) returns (ListMachinesResponse);
  // [SCOPE READ]
  // [RELEASE v1 12]
  rpc GetMachine(GetMachineRequest) returns (GetMachineResponse);
  // [SCOPE SETTINGS]
  // [RELEASE v1 13a] rename, labels
  // Display name and hub-assigned labels.
  rpc UpdateMachine(UpdateMachineRequest) returns (UpdateMachineResponse);
  // [SCOPE ADMIN] and a mapped role of `OWNER` (`ROLE_INSUFFICIENT` otherwise)
  // [RELEASE v1 24]
  // Drain (M4). The agent's Drain is owner-level, so the hub checks the role up
  // front (02d, "Role sent to the agent").
  rpc DrainMachine(DrainMachineRequest) returns (DrainMachineResponse);
  // [SCOPE ADMIN] and a mapped role of `OWNER` (`ROLE_INSUFFICIENT` otherwise)
  // [RELEASE v1 24]
  // Undrain (M4).
  rpc UndrainMachine(UndrainMachineRequest) returns (UndrainMachineResponse);
  // [SCOPE ADMIN]
  // [RELEASE v1 13a]
  // Cut a machine off now and keep its row; closes its live streams.
  rpc RevokeMachine(RevokeMachineRequest) returns (RevokeMachineResponse);
  // [SCOPE ADMIN]
  // [RELEASE v1 13a]
  // Forget a machine that is already revoked.
  rpc DeleteMachine(DeleteMachineRequest) returns (DeleteMachineResponse);
  // [SCOPE ADMIN]
  // [RELEASE v1 13a]
  // A single-use enrollment token (A1).
  rpc CreateEnrollmentToken(CreateEnrollmentTokenRequest) returns (CreateEnrollmentTokenResponse);
  // [SCOPE SETTINGS]
  // [RELEASE v1 20]
  // Install and verify the fleet's goal hooks now (EnsureGoalHooks, G1); the
  // agent still requires an owner-level principal (02g).
  rpc EnsureMachineHooks(EnsureMachineHooksRequest) returns (EnsureMachineHooksResponse);

  // --- Sessions and panes (Session view) ------------------------------------

  // [SCOPE READ]
  // [RELEASE v1 12]
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // [SCOPE READ]
  // [RELEASE v1 12]
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  // [SCOPE SESSIONS_WRITE]
  // [RELEASE v1 19]
  // EnsureSession (F1).
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  // [SCOPE SESSIONS_WRITE]
  // [RELEASE v1 19]
  // SendKeys (F3); not for prompt answers.
  rpc SendKeys(SendKeysRequest) returns (SendKeysResponse);
  // [SCOPE SESSIONS_WRITE]
  // [RELEASE v1 19]
  // Interrupt (F4).
  rpc InterruptPane(InterruptPaneRequest) returns (InterruptPaneResponse);
  // [SCOPE SESSIONS_WRITE]
  // [RELEASE v1 19]
  // RunHarnessCommand (F8); DESTRUCTIVE needs an approval.
  rpc RunHarnessCommand(RunHarnessCommandRequest) returns (RunHarnessCommandResponse);
  // [SCOPE READ] for the visible screen (`last_lines` 0); `LOGS` when `last_lines` is above 0 (scrollback)
  // [RELEASE v1 12]
  // CapturePane (E10). Scrollback is terminal history (02d).
  rpc CapturePane(CapturePaneRequest) returns (CapturePaneResponse);
  // [SCOPE SESSIONS_WRITE]
  // [RELEASE v1 19]
  // SetPaneAvailability (E11): availability is per pane.
  rpc SetPaneAvailability(SetPaneAvailabilityRequest) returns (SetPaneAvailabilityResponse);
  // [SCOPE SESSIONS_WRITE]
  // [RELEASE v1 19]
  // RespawnPane (F5).
  rpc RespawnPane(RespawnPaneRequest) returns (RespawnPaneResponse);
  // [SCOPE SESSIONS_WRITE]
  // [RELEASE v1 19]
  // KillWindow (F6); a developer's window needs an approval.
  rpc KillWindow(KillWindowRequest) returns (KillWindowResponse);
  // [SCOPE SESSIONS_WRITE]
  // [RELEASE v1 25]
  // SetLogCapture (K1).
  rpc SetLogCapture(SetLogCaptureRequest) returns (SetLogCaptureResponse);
  // [SCOPE READ] `SESSIONS_WRITE` when `read_only` is false (clamped to read-only otherwise)
  // [RELEASE v1 26]
  // A single-use ticket for one WebSocket attach (J1), needed in both auth
  // modes; not needed over HTTP/2.
  rpc CreateAttachTicket(CreateAttachTicketRequest) returns (CreateAttachTicketResponse);
  // [SCOPE READ] `SESSIONS_WRITE` when `read_only` is false
  // [RELEASE v1 26]
  // Browser attach (J1); the browser carries the same messages over a WebSocket.
  rpc AttachTerminal(stream AttachTerminalRequest) returns (stream AttachTerminalResponse);
  // [SCOPE LOGS]
  // [RELEASE v1 25]
  // Stored session log, optionally following new data (K1, K3).
  rpc ReadSessionLog(ReadSessionLogRequest) returns (stream ReadSessionLogResponse);

  // --- Stored logs (owner by default; 03d W9) ----------------------------------

  // [SCOPE LOGS]
  // [RELEASE v1 25]
  // Sessions with stored logs, live and ended, with the stream keys and the
  // archived last pane summaries.
  rpc ListStoredSessions(ListStoredSessionsRequest) returns (ListStoredSessionsResponse);
  // [SCOPE LOGS]
  // [RELEASE v1 25]
  rpc GetStoredSession(GetStoredSessionRequest) returns (GetStoredSessionResponse);
  // [SCOPE LOGS]
  // [RELEASE v1 25]
  // Delete one session's logs, audited.
  rpc DeleteSessionLogs(DeleteSessionLogsRequest) returns (DeleteSessionLogsResponse);
  // [SCOPE LOGS]
  // [RELEASE v1 25]
  // Case-insensitive text search across stored sessions.
  rpc SearchSessionLogs(SearchSessionLogsRequest) returns (SearchSessionLogsResponse);
  // [SCOPE LOGS]
  // [RELEASE v1 25]
  // Store size against its cap, days retained, shipping paused.
  rpc GetLogStoreStatus(GetLogStoreStatusRequest) returns (GetLogStoreStatusResponse);

  // --- Goals ----------------------------------------------------------------

  // [SCOPE READ]
  // [RELEASE v1 12] observed goals, 03k
  // [RELEASE v1 22] dispatched goals
  rpc ListGoals(ListGoalsRequest) returns (ListGoalsResponse);
  // [SCOPE READ]
  // [RELEASE v1 12] observed goals, 03k
  // [RELEASE v1 22] dispatched goals
  rpc GetGoal(GetGoalRequest) returns (GetGoalResponse);
  // [SCOPE SESSIONS_WRITE]
  // [RELEASE v1 22]
  // Manual dispatch: StartGoal (G3).
  rpc StartGoal(StartGoalRequest) returns (StartGoalResponse);
  // [SCOPE SESSIONS_WRITE]
  // [RELEASE v1 22]
  // Preflight (I1) only.
  rpc PreflightGoal(PreflightGoalRequest) returns (PreflightGoalResponse);
  // [SCOPE SESSIONS_WRITE]
  // [RELEASE v1 22]
  // Pause, resume, edit, clear, re-check, re-arm (G4).
  rpc ControlGoal(ControlGoalRequest) returns (ControlGoalResponse);
  // [SCOPE READ]
  // [RELEASE v1 12] observed goals, 03k
  // [RELEASE v1 22] dispatched goals
  // The runs of one goal (restarts, nudges, usage, log keys).
  rpc ListGoalRuns(ListGoalRunsRequest) returns (ListGoalRunsResponse);
  // [SCOPE READ]
  // [RELEASE v1 12] observed goals, 03k
  // [RELEASE v1 22] dispatched goals
  // Every phase change of one goal, with its reason.
  rpc ListGoalTransitions(ListGoalTransitionsRequest) returns (ListGoalTransitionsResponse);

  // --- Work items, change requests, integrations (Work view) ----------------

  // [SCOPE READ]
  // [RELEASE v1 12]
  rpc ListWorkItems(ListWorkItemsRequest) returns (ListWorkItemsResponse);
  // [SCOPE READ]
  // [RELEASE v1 12]
  rpc GetWorkItem(GetWorkItemRequest) returns (GetWorkItemResponse);
  // [SCOPE READ]
  // [RELEASE v1 12]
  rpc ListChangeRequests(ListChangeRequestsRequest) returns (ListChangeRequestsResponse);
  // [SCOPE READ]
  // [RELEASE v1 12]
  rpc GetChangeRequest(GetChangeRequestRequest) returns (GetChangeRequestResponse);
  // [SCOPE READ]
  // [RELEASE v1 12]
  rpc ListIntegrations(ListIntegrationsRequest) returns (ListIntegrationsResponse);
  // [SCOPE SETTINGS]
  // [RELEASE v1 13a]
  // Label and watched tracker projects (repos are Repo resources).
  rpc UpdateIntegration(UpdateIntegrationRequest) returns (UpdateIntegrationResponse);
  // [SCOPE SESSIONS_WRITE]
  // [RELEASE v1 23]
  // MANUAL_ONLY back to READY (not for an untrusted item).
  rpc RequeueWorkItem(RequeueWorkItemRequest) returns (RequeueWorkItemResponse);

  // --- Repos (per-repository settings, repo.proto) --------------------------

  // [SCOPE READ]
  // [RELEASE v1 12]
  rpc ListRepos(ListReposRequest) returns (ListReposResponse);
  // [SCOPE READ]
  // [RELEASE v1 12]
  rpc GetRepo(GetRepoRequest) returns (GetRepoResponse);
  // [SCOPE SETTINGS]
  // [RELEASE v1 13a]
  // Start watching a repo.
  rpc CreateRepo(CreateRepoRequest) returns (CreateRepoResponse);
  // [SCOPE SETTINGS]
  // [RELEASE v1 13a]
  // Consent, parallel cap, worktree mode, branch, hooks mode, tracker mapping,
  // trusted gate.
  rpc UpdateRepo(UpdateRepoRequest) returns (UpdateRepoResponse);
  // [SCOPE SETTINGS]
  // [RELEASE v1 13a]
  // Stop watching a repo.
  rpc DeleteRepo(DeleteRepoRequest) returns (DeleteRepoResponse);

  // --- Accounts and usage ---------------------------------------------------

  // [SCOPE READ]
  // [RELEASE v1 12]
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  // [SCOPE READ] `include_raw_screen` also needs `LOGS`
  // [RELEASE v1 12]
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  // [SCOPE SETTINGS]
  // [RELEASE v1 13a]
  rpc UpdateAccount(UpdateAccountRequest) returns (UpdateAccountResponse);
  // [SCOPE SETTINGS]
  // [RELEASE v1 13a]
  // An owner-defined API-key account (subscriptions are discovered).
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  // [SCOPE SETTINGS]
  // [RELEASE v1 13a]
  // Remove an account nothing uses.
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
  // [SCOPE SESSIONS_WRITE]
  // [RELEASE v1 23]
  // EnsureProbe run_now (D1).
  rpc ProbeAccount(ProbeAccountRequest) returns (ProbeAccountResponse);
  // [SCOPE READ]
  // [RELEASE v1 12]
  // Reading history for the burn-down chart.
  rpc ListUsageReadings(ListUsageReadingsRequest) returns (ListUsageReadingsResponse);

  // --- Triage and approvals -------------------------------------------------

  // [SCOPE READ|APPROVALS]
  // [RELEASE v1 12]
  rpc ListTriageItems(ListTriageItemsRequest) returns (ListTriageItemsResponse);
  // [SCOPE READ|APPROVALS]
  // [RELEASE v1 12]
  rpc GetTriageItem(GetTriageItemRequest) returns (GetTriageItemResponse);
  // [SCOPE APPROVALS]
  // [RELEASE v1 13a]
  rpc SnoozeTriageItem(SnoozeTriageItemRequest) returns (SnoozeTriageItemResponse);
  // [SCOPE APPROVALS]
  // [RELEASE v1 13a]
  rpc DismissTriageItem(DismissTriageItemRequest) returns (DismissTriageItemResponse);
  // [SCOPE READ|APPROVALS]
  // [RELEASE v1 19]
  rpc ListApprovals(ListApprovalsRequest) returns (ListApprovalsResponse);
  // [SCOPE READ|APPROVALS]
  // [RELEASE v1 19]
  rpc GetApproval(GetApprovalRequest) returns (GetApprovalResponse);
  // [SCOPE APPROVALS] also checks `Approval.required_role`
  // [RELEASE v1 19]
  // Answer a prompt, confirm or deny a command.
  rpc DecideApproval(DecideApprovalRequest) returns (DecideApprovalResponse);

  // --- Routines -------------------------------------------------------------

  // [SCOPE READ]
  // [RELEASE v1 27]
  rpc ListRoutines(ListRoutinesRequest) returns (ListRoutinesResponse);
  // [SCOPE READ]
  // [RELEASE v1 27]
  rpc GetRoutine(GetRoutineRequest) returns (GetRoutineResponse);
  // [SCOPE SETTINGS]
  // [RELEASE v1 27]
  rpc CreateRoutine(CreateRoutineRequest) returns (CreateRoutineResponse);
  // [SCOPE SETTINGS]
  // [RELEASE v1 27]
  rpc UpdateRoutine(UpdateRoutineRequest) returns (UpdateRoutineResponse);
  // [SCOPE SETTINGS]
  // [RELEASE v1 27]
  rpc DeleteRoutine(DeleteRoutineRequest) returns (DeleteRoutineResponse);
  // [SCOPE SESSIONS_WRITE]
  // [RELEASE v1 27]
  // Start a run now.
  rpc RunRoutine(RunRoutineRequest) returns (RunRoutineResponse);

  // --- Insights and system health (05, 05b) ---------------------------------

  // [SCOPE READ]
  // [RELEASE v1 13] sections EFFICIENCY and SERIES only
  // [RELEASE v1 27] other sections
  // Subscription efficiency, goal outcomes, where work gets stuck and routine
  // outcomes, from the hub's daily rollups. Numbers only.
  rpc GetInsights(GetInsightsRequest) returns (GetInsightsResponse);
  // [SCOPE READ]
  // [RELEASE v1 27]
  // The weekly written reports, newest first, without their text.
  rpc ListInsightReports(ListInsightReportsRequest) returns (ListInsightReportsResponse);
  // [SCOPE READ]
  // [RELEASE v1 27]
  // One report with its text (untrusted: render as sanitized markdown);
  // include_bundle also returns the numbers it was written from.
  rpc GetInsightReport(GetInsightReportRequest) returns (GetInsightReportResponse);
  // [SCOPE READ]
  // [RELEASE v1 27]
  // Rule-based recommendations with the numbers behind each.
  rpc ListSuggestions(ListSuggestionsRequest) returns (ListSuggestionsResponse);
  // [SCOPE APPROVALS]
  // [RELEASE v1 27]
  // Hide a suggestion for 30 days (and its triage item).
  rpc DismissSuggestion(DismissSuggestionRequest) returns (DismissSuggestionResponse);
  // [SCOPE READ]
  // [RELEASE v1 13]
  // The System section: the hub's and the agents' own health signals.
  rpc GetSystemStatus(GetSystemStatusRequest) returns (GetSystemStatusResponse);

  // --- Settings and audit ---------------------------------------------------

  // [SCOPE READ]
  // [RELEASE v1 12]
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  // [SCOPE READ]
  // [RELEASE v1 12]
  rpc ListSettings(ListSettingsRequest) returns (ListSettingsResponse);
  // [SCOPE SETTINGS] plus `ADMIN` for the field-level fields (02d, Field-level scopes)
  // [RELEASE v1 13a]
  // The field-level fields are the HubSettings fields for sign-in, session
  // lifetime and log retention.
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);
  // [SCOPE READ]
  // [RELEASE v1 12]
  rpc ListAuditEntries(ListAuditEntriesRequest) returns (ListAuditEntriesResponse);
  // [SCOPE READ]
  // [RELEASE v1 13a]
  // The whole configuration as one document (`fleet export`).
  rpc ExportConfig(ExportConfigRequest) returns (ExportConfigResponse);
  // [SCOPE SETTINGS] plus `ADMIN` for machine entries and the field-level fields (02d, Field-level scopes)
  // [RELEASE v1 13a]
  // Validate and apply a document in one transaction; dry_run returns the plan
  // (`fleet import`).
  rpc ImportConfig(ImportConfigRequest) returns (ImportConfigResponse);
  // [SCOPE ADMIN]
  // [RELEASE v1 12]
  // Database sizes, schema version, last backup, free disk.
  rpc GetStoreStatus(GetStoreStatusRequest) returns (GetStoreStatusResponse);

  // --- Sign-in, users, sessions and API tokens (authenticated mode) ----------

  // [SCOPE none]
  // [RELEASE v3 none]
  // Burn an invite or claim token and start registering a credential.
  rpc RedeemInvite(RedeemInviteRequest) returns (RedeemInviteResponse);
  // [SCOPE self] or the registration session `RedeemInvite` sets
  // [RELEASE v3 none]
  // Start adding a passkey.
  rpc BeginPasskeyRegistration(BeginPasskeyRegistrationRequest) returns (BeginPasskeyRegistrationResponse);
  // [SCOPE self] or the registration session `RedeemInvite` sets
  // [RELEASE v3 none]
  rpc FinishPasskeyRegistration(FinishPasskeyRegistrationRequest) returns (FinishPasskeyRegistrationResponse);
  // [SCOPE none]
  // [RELEASE v3 none]
  // Rate limited per peer address.
  rpc BeginPasskeyLogin(BeginPasskeyLoginRequest) returns (BeginPasskeyLoginResponse);
  // [SCOPE none]
  // [RELEASE v3 none]
  // Sets the session cookie.
  rpc FinishPasskeyLogin(FinishPasskeyLoginRequest) returns (FinishPasskeyLoginResponse);
  // [SCOPE self] own passkeys; `ADMIN` anyone's (user principal only)
  // [RELEASE v3 none]
  rpc DeletePasskey(DeletePasskeyRequest) returns (DeletePasskeyResponse);
  // [SCOPE self] login-session callers only
  // [RELEASE v3 none]
  // End this browser session.
  rpc SignOut(SignOutRequest) returns (SignOutResponse);
  // [SCOPE self] own sessions; `ADMIN` all
  // [RELEASE v3 none]
  rpc ListLoginSessions(ListLoginSessionsRequest) returns (ListLoginSessionsResponse);
  // [SCOPE self] own sessions; `ADMIN` any (user principal only)
  // [RELEASE v3 none]
  rpc RevokeLoginSession(RevokeLoginSessionRequest) returns (RevokeLoginSessionResponse);
  // [SCOPE ADMIN]
  // [RELEASE v3 none]
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // [SCOPE ADMIN] user principal only, granting at most the caller's own scopes (02d, No escalation)
  // [RELEASE v3 none]
  // Create a user and a one-time invite; the role is at most the caller's own.
  rpc CreateUserInvite(CreateUserInviteRequest) returns (CreateUserInviteResponse);
  // [SCOPE ADMIN] user principal only, granting at most the caller's own scopes (02d, No escalation)
  // [RELEASE v3 none]
  // Role, name, GitHub allow-list entry, disabled, extra_scopes.
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  // [SCOPE self] a user or the local owner only (a token or device cannot mint another)
  // [RELEASE v3 none] works for the local owner in `local_trusted` (02f); no v1 row builds it
  // Shows the secret once.
  rpc CreateApiToken(CreateApiTokenRequest) returns (CreateApiTokenResponse);
  // [SCOPE self] own tokens; `ADMIN` all
  // [RELEASE v3 none] works for the local owner in `local_trusted` (02f); no v1 row builds it
  rpc ListApiTokens(ListApiTokensRequest) returns (ListApiTokensResponse);
  // [SCOPE self] own tokens; `ADMIN` any
  // [RELEASE v3 none] works for the local owner in `local_trusted` (02f); no v1 row builds it
  rpc RevokeApiToken(RevokeApiTokenRequest) returns (RevokeApiTokenResponse);

  // --- Devices and notifications --------------------------------------------

  // [SCOPE none]
  // [RELEASE v3 none]
  // Sent by a new device; creates a pending Device. Rate limited per peer
  // address; idempotency is keyed by (peer address, public key). An empty
  // requested_scopes means READ and APPROVALS, never LOGS.
  rpc RequestPairing(RequestPairingRequest) returns (RequestPairingResponse);
  // [SCOPE ADMIN] user principal only, `scopes` a subset of the approver's effective scopes (02d, No escalation)
  // [RELEASE v3 none]
  rpc ApprovePairing(ApprovePairingRequest) returns (ApprovePairingResponse);
  // [SCOPE self] `self` is the device itself
  // [RELEASE v3 none]
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse);
  // [SCOPE ADMIN]
  // [RELEASE v3 none]
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  // [SCOPE self] `self` is the device itself; the only call a pending device may make
  // [RELEASE v3 none]
  rpc GetDevice(GetDeviceRequest) returns (GetDeviceResponse);
  // [SCOPE self] own targets; `ADMIN` all
  // [RELEASE v3 none]
  rpc ListNotificationTargets(ListNotificationTargetsRequest) returns (ListNotificationTargetsResponse);
  // [SCOPE self]
  // [RELEASE v3 none]
  rpc CreateNotificationTarget(CreateNotificationTargetRequest) returns (CreateNotificationTargetResponse);
  // [SCOPE self]
  // [RELEASE v3 none]
  rpc UpdateNotificationTarget(UpdateNotificationTargetRequest) returns (UpdateNotificationTargetResponse);
  // [SCOPE self]
  // [RELEASE v3 none]
  rpc DeleteNotificationTarget(DeleteNotificationTargetRequest) returns (DeleteNotificationTargetResponse);
}
