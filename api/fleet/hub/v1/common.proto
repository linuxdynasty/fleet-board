// fleet.hub.v1 common messages: hub-only ids, the Operation handle that
// every agent-command action returns, server info and the summary strip.
//
// Conventions for every hub resource (02b-hub-api.md):
//   - field 1 is the id, 2 the version, 3 create_time, 4 update_time;
//     resource fields start at 10. A resource a person can edit splits into
//     `spec = 10` (what the owner or hub decided; covered by version, the
//     ETag, and by expected_version; update_time is its last change) and
//     `status = 11` (what was observed; not versioned, never checked by
//     expected_version, carries observed_time and hub_seq). Observed-only
//     resources have neither and put their fields at 10.
//   - List requests: page_size 1, page_token 2, filter 3 (AIP-160 subset,
//     02c-hub-watch-and-filters.md), order_by 4. Responses: items 1,
//     next_page_token 2 (empty on the last page).
//   - Mutating requests: request_id 1 (client-generated idempotency key).
//     Updates add update_mask and expected_version (0 = do not check).
//   - 64-bit integers (version, hub_seq, byte counts) are decimal strings in
//     JSON and bigint in TypeScript (02b-hub-api.md, "64-bit integers").
//   - Actions that make an agent do something return an Operation, never
//     the final state; the final state arrives through Watch or
//     GetOperation.
// UI, CLI and phone speak only this package (ADR 0018). It imports
// fleet.type.v1 and fleet.integration.v1, never fleet.agent.v1.
syntax = "proto3";

package fleet.hub.v1;

import "fleet/type/v1/ids.proto";
import "fleet/type/v1/principal.proto";
import "fleet/type/v1/status.proto";
import "fleet/hub/v1/dispatch_block.proto";
import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------------------
// Hub-only identifiers
// ---------------------------------------------------------------------------

// TriageItemId is hub-assigned per raised item.
message TriageItemId {
  string value = 1;
}

// ApprovalId is hub-assigned per approval request.
message ApprovalId {
  string value = 1;
}

// RoutineId is hub-assigned per routine; also the prefix of the routine's
// WorkItemKey.key ("<routine id>/<run number>").
message RoutineId {
  string value = 1;
}

// RepoId names one repository the hub keeps settings for: "<host>/<path>" of
// the RepoRef, lowercase, no ".git" (for example "github.com/eshu-hq/eshu").
// Derived from the repo, never chosen by a client; the host never contains a
// slash, so the first slash splits it from the nested path.
message RepoId {
  string value = 1;
}

// NotificationTargetId is hub-assigned per notification target.
message NotificationTargetId {
  string value = 1;
}

// AuditEntryId is hub-assigned per audit row; increasing.
message AuditEntryId {
  string value = 1;
}

// SettingsId names one settings layer: "fleet", "group/<label>" or
// "machine/<machine id>". Derived from the scope, never chosen by a client.
message SettingsId {
  string value = 1;
}

// PasskeyId is hub-assigned per registered passkey (not the WebAuthn
// credential id, which the hub keeps internally).
message PasskeyId {
  string value = 1;
}

// ApiTokenId is hub-assigned per API token. It is public (shown in lists and
// the audit log); the secret is separate and shown once.
message ApiTokenId {
  string value = 1;
}

// LoginSessionId is hub-assigned per browser sign-in. Not the cookie value.
message LoginSessionId {
  string value = 1;
}

// SuggestionId is hub-assigned and deterministic: the first 32 hex characters
// of SHA-256 over the suggestion's kind and subject, so the same finding keeps
// one id across recomputations and a dismissal sticks to it.
message SuggestionId {
  string value = 1;
}

// InsightReportId is hub-assigned per stored insights report (lowercase ULID).
message InsightReportId {
  string value = 1;
}

// ---------------------------------------------------------------------------
// Scopes
// ---------------------------------------------------------------------------

// Scope is one permission set an RPC requires (02d-hub-authz.md has the table
// for every RPC and every Watch topic). Roles map to scopes (VIEWER: READ;
// OPERATOR: READ, SESSIONS_WRITE, APPROVALS; OWNER: all six); a user may hold
// SCOPE_LOGS on top of its role (UserSpec.extra_scopes). A device or API
// token holds a subset of its user's effective scopes. Scopes are sets, never
// ordered. Granting never exceeds the grantor's own scopes, and only a user
// principal grants (02d, "No escalation").
enum Scope {
  SCOPE_UNSPECIFIED = 0;
  // Read every resource and Watch, and view live: read-only attach and
  // CapturePane of the visible screen. Not stored or scrolled-back terminal
  // history (SCOPE_LOGS).
  SCOPE_READ = 1;
  // Type into sessions: keys, attach input, harness commands, goal control,
  // dispatch, create sessions.
  SCOPE_SESSIONS_WRITE = 2;
  // Decide approvals (prompt answers, confirmations) and act on triage.
  SCOPE_APPROVALS = 3;
  // Change settings, accounts, repos, routines, integrations' watched
  // projects, hook installs, and import a config document.
  SCOPE_SETTINGS = 4;
  // Machines (enroll, revoke, delete, drain), devices, users (list, invite,
  // update), other users' passkeys, login sessions and tokens, all
  // notification targets, the store status, and the HubSettings fields for
  // sign-in, session lifetime and log retention.
  SCOPE_ADMIN = 5;
  // Stored or scrolled-back terminal history: stored session logs and their
  // management (list, search, delete, store status), transcripts, archived
  // pane summaries, the raw usage screen, CapturePane history lines
  // (last_lines above 0) and any Operation.output_text that is not the
  // caller's own. Owner only by default (ADR 0010, 0019): a user gets it
  // through UserSpec.extra_scopes, a token or paired device only when ticked
  // at creation or approval, and a phone pairing never requests it by
  // default.
  SCOPE_LOGS = 6;
}

// AuthMode is how the hub authenticates callers (the two modes: 02f).
enum AuthMode {
  AUTH_MODE_UNSPECIFIED = 0;
  // The hub binds loopback addresses only and refuses to start on any other
  // (ADR 0019). No sign-in: every call that passes the Host and Origin checks
  // runs as Principal{id "local-owner", kind USER, role OWNER}. Passkey,
  // GitHub and device RPCs answer FAILED_PRECONDITION; the local owner may
  // still mint and revoke API tokens (a script on the hub host can use one;
  // a valid Bearer token only narrows the call, an invalid one is
  // CREDENTIALS_INVALID); a WebSocket attach still needs a ticket, an HTTP/2
  // attach does not (02f-hub-authentication.md). Plain HTTP on loopback is
  // allowed only in this mode.
  AUTH_MODE_LOCAL_TRUSTED = 1;
  // Passkey or GitHub sign-in (cookie), API tokens (bearer), paired devices
  // (signed requests). HTTPS only: an owner-supplied or Tailscale certificate;
  // the hub refuses to start without one.
  AUTH_MODE_AUTHENTICATED = 2;
}

// SignInMethod is one way a person proves who they are in authenticated mode.
enum SignInMethod {
  SIGN_IN_METHOD_UNSPECIFIED = 0;
  // WebAuthn passkey. The hub stores public keys only, never a password.
  SIGN_IN_METHOD_PASSKEY = 1;
  // GitHub account, through the hub's GitHub App, limited to the allow-list.
  SIGN_IN_METHOD_GITHUB = 2;
}

// ---------------------------------------------------------------------------
// Operations
// ---------------------------------------------------------------------------

// OperationState follows the hub outbox row (02-contracts.md delivery).
enum OperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  // In the outbox; the machine may be offline. not_after_time still applies.
  OPERATION_STATE_PENDING = 1;
  // Sent and acknowledged (CommandAck) by the agent.
  OPERATION_STATE_DELIVERED = 2;
  // A composite reported progress, or the agent waits for local approval.
  OPERATION_STATE_RUNNING = 3;
  // A final CommandResult arrived (or the hub expired it); see status.
  OPERATION_STATE_DONE = 4;
}

// OperationKind is the agent command an Operation runs. Values equal the
// field numbers of fleet.agent.v1.Command.kind (the hub API never imports the
// agent package, so the numbers are repeated and kept in step by review).
enum OperationKind {
  OPERATION_KIND_UNSPECIFIED = 0;
  OPERATION_KIND_ENSURE_PROBE = 10;
  OPERATION_KIND_STOP_PROBE = 11;
  OPERATION_KIND_ENSURE_SESSION = 20;
  OPERATION_KIND_ENSURE_WINDOW = 21;
  OPERATION_KIND_SEND_KEYS = 22;
  OPERATION_KIND_INTERRUPT = 23;
  OPERATION_KIND_RESPAWN_PANE = 24;
  OPERATION_KIND_KILL_WINDOW = 25;
  OPERATION_KIND_CAPTURE_PANE = 26;
  OPERATION_KIND_RUN_HARNESS_COMMAND = 27;
  OPERATION_KIND_SET_PANE_AVAILABILITY = 28;
  OPERATION_KIND_PREFLIGHT = 40;
  OPERATION_KIND_START_GOAL = 41;
  OPERATION_KIND_ENSURE_WORKTREE = 43;
  OPERATION_KIND_PRUNE_WORKTREE = 44;
  OPERATION_KIND_ENSURE_GOAL_HOOKS = 45;
  OPERATION_KIND_REGISTER_GOAL = 47;
  OPERATION_KIND_RELEASE_GOAL = 48;
  OPERATION_KIND_OPEN_ATTACH = 50;
  OPERATION_KIND_CLOSE_ATTACH = 51;
  OPERATION_KIND_SET_LOG_CAPTURE = 60;
  OPERATION_KIND_SET_LOG_SHIPPING = 61;
  OPERATION_KIND_DRAIN = 70;
  OPERATION_KIND_UNDRAIN = 71;
  OPERATION_KIND_ENSURE_SCRATCH = 80;
  OPERATION_KIND_COLLECT_SCRATCH = 81;
}

// Operation is the handle for one agent command caused by an API action.
// Observed-only: version bumps on every state change, nothing edits it.
// Its id is the command's CommandId, so the UI, the audit log and the
// agent's local log all name the same thing.
message Operation {
  fleet.type.v1.CommandId id = 1;
  uint64 version = 2;
  google.protobuf.Timestamp create_time = 3;
  google.protobuf.Timestamp update_time = 4;

  fleet.type.v1.MachineId machine = 10;
  OperationKind kind = 11;
  OperationState state = 12;
  // Set when state is DONE: the agent's Status, or EXPIRED from the hub.
  fleet.type.v1.Status status = 13;
  // Set for anything but OK: reason, retryable, retry_after, metadata.
  fleet.type.v1.ErrorDetail error = 14;
  // Last composite step reached (G3), e.g. "wait_ready", with its position.
  string step = 15;
  uint32 step_index = 16;
  uint32 step_count = 17;
  // Short diagnostic from the agent, no screen text. 1 KiB.
  string message = 18;
  fleet.type.v1.Principal requested_by = 19;
  // The request_id of the API call that created it.
  string request_id = 20;
  google.protobuf.Timestamp not_after_time = 21;
  // Text output for CapturePane and OBSERVE-class harness commands.
  // Untrusted text, capped as on the agent wire. Terminal text can hold
  // secrets and scrollback, so GetOperation and the OPERATIONS topic return
  // it only to the requester and to SCOPE_LOGS holders (02d).
  string output_text = 22;
  bool output_truncated = 23;
  // Goal the operation belongs to, if any.
  fleet.type.v1.GoalId goal = 24;
  // Preflight: every failed check (PreflightResult.failed_checks), with the
  // detail line in metadata["detail"].
  repeated fleet.type.v1.ErrorDetail failed_checks = 25;
  // Trace id (32 hex) of the hub span that issued the command, so a UI or
  // CLI can link to the trace. Empty when tracing is off.
  string trace_id = 26;
  // When the agent acked the command (the outbox ack_time). Unset while the
  // command is still PENDING, so an expiry before delivery (DONE with no
  // delivered_time) reads apart from one after (DONE with delivered_time).
  google.protobuf.Timestamp delivered_time = 27;
}

// GetOperationRequest.
message GetOperationRequest {
  fleet.type.v1.CommandId id = 1;
}

// GetOperationResponse.
message GetOperationResponse {
  Operation operation = 1;
}

// ---------------------------------------------------------------------------
// Server info and summary strip
// ---------------------------------------------------------------------------

// GetServerInfoRequest. Allowed without scopes so a client can check the
// API before pairing or signing in.
message GetServerInfoRequest {}

// GetServerInfoResponse.
message GetServerInfoResponse {
  // Highest fleet.hub.v1 minor revision served, e.g. 1.
  uint32 api_version = 1;
  string hub_version = 2;
  // fleet_id and hub_instance_id as on the agent wire (EnrollResponse,
  // HelloAck); a new hub_instance_id invalidates every resume token.
  string fleet_id = 3;
  string hub_instance_id = 4;
  google.protobuf.Timestamp server_time = 5;
  // Optional features, e.g. {"watch.pane_summaries", 1}, {"attach", 1},
  // {"routines", 1}, {"devices", 1}. Clients hide what is not listed.
  repeated fleet.type.v1.Capability features = 6;
  AuthMode auth_mode = 7;
  // The caller as the hub sees it; unset when not signed in. In
  // local_trusted mode it is the fixed local owner.
  fleet.type.v1.Principal caller = 8;
  // Scopes in effect for the caller: a user gets the scopes of its role plus
  // its extra_scopes, a
  // device or API token at most those, narrowed to what was granted.
  repeated Scope caller_scopes = 9;
  // Sign-in methods the owner turned on (authenticated mode; empty in
  // local_trusted). The sign-in page shows only these.
  repeated SignInMethod sign_in_methods = 10;
  // True while the hub has no owner: a claim URL was printed by `fleetd` and
  // whoever opens it becomes the owner (02f). Never true in local_trusted.
  bool claim_pending = 11;
}

// FleetSummary is the summary strip on every view: hub-derived counts. A
// singleton, observed-only; Watch coalesces it to one change per second.
message FleetSummary {
  uint64 version = 2;
  google.protobuf.Timestamp update_time = 4;

  uint32 goals_working = 10;
  uint32 goals_waiting = 11;
  uint32 goals_stuck = 12;
  // Open triage items at or above the notify severity.
  uint32 needs_you = 13;
  uint32 active_slots_free = 14;
  uint32 total_slots_free = 15;
  uint32 available_sessions = 16;
  uint32 machines_online = 17;
  uint32 machines_total = 18;
  uint32 goals_limit_wait = 19;
  // Subscription accounts projected to leave >= 5 points unused, or idle
  // while behind pace (AccountPacing).
  uint32 accounts_wasting = 20;
  // Fleet-wide reasons nothing is starting: AUTO_DISPATCH_OFF, NO_READY_ITEMS,
  // INTEGRATION_LAG, INTEGRATION_DEGRADED. Per-account, per-machine and
  // per-item reasons are on those resources.
  repeated DispatchBlock dispatch_blocks = 21;
  // System signals (system.proto) not OK: the strip's health dot. Counts
  // only; GetSystemStatus has the signals.
  uint32 system_warnings = 22;
  uint32 system_critical = 23;
}

// GetFleetSummaryRequest.
message GetFleetSummaryRequest {}

// GetFleetSummaryResponse.
message GetFleetSummaryResponse {
  FleetSummary summary = 1;
}
