// fleet.hub.v1 suggestions (docs/specs/05-insights.md, "Suggestions"):
// rule-based recommendations the hub derives from the insights, each with the
// numbers behind it. A closed list of rules, no model involved. Listed with
// ListSuggestions (SCOPE_READ); optionally also raised as a low-severity
// triage item (HubSettings.suggestions_in_triage). Everything here is an enum,
// an id or a number; the title is generated by the hub from those.
syntax = "proto3";

package fleet.hub.v1;

import "fleet/hub/v1/common.proto";
import "fleet/hub/v1/insights.proto";
import "fleet/type/v1/harness.proto";
import "fleet/type/v1/status.proto";
import "google/protobuf/timestamp.proto";

// SuggestionKind is one rule. Adding a rule is a contract change with its
// thresholds in 05-insights.md.
enum SuggestionKind {
  SUGGESTION_KIND_UNSPECIFIED = 0;
  // One harness merges a kind of work (a label, a size, a repo) clearly faster
  // than another: "Codex merges perf issues faster than Muse". subject is the
  // faster group, versus the slower.
  SUGGESTION_KIND_HARNESS_FASTER = 1;
  // An account is within 5 points of its reserve on the same weekday in at
  // least 3 of the last 4 windows: "Claude is near its reserve every
  // Thursday". subject.account and weekday are set.
  SUGGESTION_KIND_NEAR_RESERVE_WEEKDAY = 2;
  // Unused quota at reset has grown over the last 3 complete windows and the
  // latest is at least 10 points.
  SUGGESTION_KIND_WASTE_GROWING = 3;
  // An account was idle while behind pace for at least 12 hours in the last
  // two windows, mostly because no ready work existed: add a routine or work.
  SUGGESTION_KIND_IDLE_BEHIND_NO_WORK = 4;
  // A machine failed at least 3 of its last 5 starts for the same reason.
  // subject.machine, reason.
  SUGGESTION_KIND_MACHINE_START_FAILURES = 5;
  // Usage parsing failed after a harness version change. subject.harness.
  SUGGESTION_KIND_PARSER_BROKEN_AFTER_UPDATE = 6;
  // A repo's goals average at least 2 review rounds more than the fleet's.
  SUGGESTION_KIND_REVIEW_LOOPS_HEAVY = 7;
  // Work sized SMALL takes longer than MEDIUM at the median, or at least 40%
  // of one size is slower than the next larger size's median.
  SUGGESTION_KIND_WORK_UNDERSIZED = 8;
  // One prompt class held goals for at least 10 hours in total in the range.
  // subject.harness and prompt_class are set.
  SUGGESTION_KIND_PROMPT_HOTSPOT = 9;
  // At least 30% of the quota points a group spent went to goals that did not
  // merge.
  SUGGESTION_KIND_QUOTA_ON_UNMERGED = 10;
}

// SuggestionState is the lifecycle of one suggestion.
enum SuggestionState {
  SUGGESTION_STATE_UNSPECIFIED = 0;
  SUGGESTION_STATE_OPEN = 1;
  // Dismissed by a person; stays hidden for 30 days unless its main evidence
  // value gets 25% worse.
  SUGGESTION_STATE_DISMISSED = 2;
  // The rule no longer fires; kept 30 days for the history, then pruned.
  SUGGESTION_STATE_RESOLVED = 3;
}

// InsightWeekday is a day of the week in the hub's timezone.
enum InsightWeekday {
  INSIGHT_WEEKDAY_UNSPECIFIED = 0;
  INSIGHT_WEEKDAY_MONDAY = 1;
  INSIGHT_WEEKDAY_TUESDAY = 2;
  INSIGHT_WEEKDAY_WEDNESDAY = 3;
  INSIGHT_WEEKDAY_THURSDAY = 4;
  INSIGHT_WEEKDAY_FRIDAY = 5;
  INSIGHT_WEEKDAY_SATURDAY = 6;
  INSIGHT_WEEKDAY_SUNDAY = 7;
}

// SuggestionEvidence is one number behind a suggestion, typed so a client can
// draw it and a person can check it against GetInsights.
message SuggestionEvidence {
  InsightMetric metric = 1;
  InsightUnit unit = 2;
  InsightGroupKey group = 3;
  double value = 4;
  // What it is compared with: the other group's value, the fleet mean, the
  // previous window. Unset when the rule has no comparison.
  optional double baseline = 5;
  // Goals or readings behind the value; a rule needs at least 5.
  uint32 sample_size = 6;
}

// Suggestion is one finding. A decision-record shape like TriageItem: version
// bumps on every state change and DismissSuggestion guards on it.
message Suggestion {
  SuggestionId id = 1;
  uint64 version = 2;
  google.protobuf.Timestamp create_time = 3;
  google.protobuf.Timestamp update_time = 4;

  SuggestionKind kind = 10;
  SuggestionState state = 11;
  // One line generated by the hub from the numbers and validated names
  // (harness, label, machine and account display names are looked up by the
  // client from the ids). Display as text.
  string title = 12;
  InsightGroupKey subject = 13;
  // The group compared against, for HARNESS_FASTER.
  InsightGroupKey versus = 14;
  InsightWeekday weekday = 15;
  string bucket_key = 16;
  // For MACHINE_START_FAILURES: the start failure reason.
  fleet.type.v1.ReasonCode reason = 17;
  repeated SuggestionEvidence evidence = 18;
  // The range the rule looked at.
  InsightRange range = 19;
  // The triage item raised for it, when HubSettings.suggestions_in_triage is on.
  TriageItemId triage_item = 20;
  google.protobuf.Timestamp dismissed_until_time = 21;
  // For PROMPT_HOTSPOT: the class of prompt that blocked goals.
  fleet.type.v1.PromptClass prompt_class = 22;
}

// ListSuggestionsRequest. Filter and order_by names: 02c-hub-watch-and-
// filters.md (kind, state, create_time). Default: state = OPEN, newest first.
message ListSuggestionsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string filter = 3;
  string order_by = 4;
}

// ListSuggestionsResponse.
message ListSuggestionsResponse {
  repeated Suggestion suggestions = 1;
  string next_page_token = 2;
}

// DismissSuggestionRequest hides a suggestion for 30 days. Also dismisses its
// triage item. SCOPE_APPROVALS, like DismissTriageItem.
message DismissSuggestionRequest {
  string request_id = 1;
  SuggestionId id = 2;
  uint64 expected_version = 3;
}

// DismissSuggestionResponse.
message DismissSuggestionResponse {
  Suggestion suggestion = 1;
}

// SuggestionDetail is the TriageItem detail for TRIAGE_KIND_SUGGESTION: the
// item points at the suggestion, which holds the evidence.
message SuggestionDetail {
  SuggestionId suggestion = 1;
  SuggestionKind kind = 2;
}
