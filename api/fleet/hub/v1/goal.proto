// fleet.hub.v1 goals: the hub's goal lifecycle (03c W5, W6, 03h), the goal
// resource and goal control. Dispatch, preflight and the shared dispatch
// input are in goal_dispatch.proto; run history and the transition list are
// in goal_history.proto. Goal control is translated per harness into the
// harness's own /goal subcommands, Interrupt, or a typed "continue" (01b);
// the API names the intent, not the keys.
syntax = "proto3";

package fleet.hub.v1;

import "fleet/hub/v1/common.proto";
import "fleet/hub/v1/routine.proto";
import "fleet/type/v1/consent.proto";
import "fleet/type/v1/harness.proto";
import "fleet/type/v1/ids.proto";
import "fleet/type/v1/status.proto";
import "fleet/type/v1/work.proto";
import "google/protobuf/timestamp.proto";

// GoalPhase is the hub-owned goal state (03c state machines, start and
// run, in one enum). GoalLineState is what the goal file says; the phase is
// what the hub concluded from it and everything else.
//
// Every phase belongs to one of three classes (03c, "Phase classes"), which
// decide what a goal holds:
//   ACTIVE   uses quota: holds an active slot and a total slot, counts toward
//            AccountPacing.active_goals and the repo cap.
//   HELD     keeps its worker but spends almost no quota: holds a total slot
//            only, and counts toward the repo cap.
//   ENDED    holds nothing. Terminal phases never leave ENDED, except MERGED,
//            which still moves to CLOSED when cleanup is done.
// The LIVE set (ACTIVE and HELD) is what the unique indexes use: one live
// goal per work item, one per (repo, branch). A retry is a new goal, never a
// revived row (GoalDefinition.attempt).
enum GoalPhase {
  GOAL_PHASE_UNSPECIFIED = 0;
  // ACTIVE. Planned and StartGoal queued or sent, not yet confirmed. There is
  // no separate QUEUED phase: the goal row and its outbox row commit in one
  // transaction, so "waiting for the machine" is this phase with
  // Operation.state PENDING.
  GOAL_PHASE_STARTING = 1;
  // ENDED. This attempt failed on the agent (start_error says why). The work
  // item goes back to READY for another machine; the retry is a new goal
  // with attempt + 1 and previous_goal set.
  GOAL_PHASE_START_FAILED = 2;
  // ACTIVE. The start ended UNKNOWN_OUTCOME; waiting for a GoalState or a
  // person (ControlGoal MARK_NOT_STARTED).
  GOAL_PHASE_START_UNKNOWN = 3;
  // ACTIVE.
  GOAL_PHASE_RUNNING = 4;
  // HELD. BLOCKED with a live watcher (CI, review).
  GOAL_PHASE_WAITING = 5;
  // HELD.
  GOAL_PHASE_BLOCKED_OWNER = 6;
  // HELD. Nothing is watching it or it cannot be recovered without a person;
  // GoalStatus.phase_reason says which.
  GOAL_PHASE_STUCK = 7;
  // ACTIVE. Stopped without DONE; one corrective nudge pending or sent.
  GOAL_PHASE_STOPPED = 8;
  // HELD.
  GOAL_PHASE_COOLDOWN = 9;
  // HELD. Paused by an operator, a person at the machine (interrupt), the
  // review-loop cap, the opt-in reserve rule or a provider-side close;
  // GoalStatus.pause_reason says which. No nudge and no no-progress counting
  // while paused.
  GOAL_PHASE_PAUSED = 10;
  // HELD, for up to a week. A usage or rate limit stopped the harness
  // (HarnessCondition). The hub resumes it at limit_wait_until_time with the
  // harness's resume action; no nudges meanwhile (03c, "Limit wait").
  GOAL_PHASE_LIMIT_WAIT = 11;
  // HELD. DONE claimed, or the change request was merged under the goal
  // (phase_reason says which); the verifier is checking the code host.
  GOAL_PHASE_VERIFYING = 12;
  // HELD. DONE, but the code host disagrees after verify_grace.
  GOAL_PHASE_DISAGREE = 13;
  // ENDED, pending cleanup. The change request merged (or the work item
  // closed as done). The worker is freed here: the pane becomes available
  // for reuse, so the goal no longer holds a slot.
  GOAL_PHASE_MERGED = 14;
  // ENDED. merged_grace elapsed; worktree pruned, window closed or reused.
  GOAL_PHASE_CLOSED = 15;
  // ENDED. Cleared by an operator (/goal clear). The work item becomes
  // MANUAL_ONLY until an operator requeues it.
  GOAL_PHASE_CLEARED = 16;
  // HELD. The pane is missing from the latest snapshot; STUCK after 10
  // minutes (PANE_LOST_TIMEOUT).
  GOAL_PHASE_PANE_LOST = 17;
  // ENDED. Three attempts failed to start on three different machines (this
  // is the third). Renamed from MANUAL_ONLY, which is a work stage with a
  // different meaning: the work item becomes MANUAL_ONLY with reason
  // START_EXHAUSTED.
  GOAL_PHASE_START_EXHAUSTED = 18;
  // ENDED. StartGoal was not delivered in time (machine offline 30 minutes).
  // Nothing ran; the work item goes back to READY.
  GOAL_PHASE_EXPIRED = 19;
  // ENDED. The hub gave up on a goal that never confirmed running: the
  // operator said it never started, the machine drained before it began, or
  // the machine was revoked. Nothing ran (or nothing can be known); the work
  // item goes back to READY.
  GOAL_PHASE_ABANDONED = 20;
  // ENDED. The provider says the work is no longer wanted: the work item
  // was closed without being done ("not planned", "Won't Do") or the change
  // request was closed unmerged. Frees the worker; no success metric.
  GOAL_PHASE_CANCELLED = 21;
}

// GoalPauseReason says why a goal is PAUSED, and with it whether the hub may
// resume it. Only RESERVE resumes by itself (at auto_resume_time); the others
// wait for a person. A usage or rate limit is not a pause: it is the
// LIMIT_WAIT phase.
enum GoalPauseReason {
  GOAL_PAUSE_REASON_UNSPECIFIED = 0;
  // An operator paused it through ControlGoal.
  GOAL_PAUSE_REASON_OPERATOR = 1;
  // A person at the machine interrupted or paused it (HarnessCondition kind
  // GOAL_INTERRUPTED, or GOAL_PAUSED with cause DEVELOPER_INPUT or HARNESS).
  // Their decision: never nudged, never resumed automatically.
  GOAL_PAUSE_REASON_OWNER_AT_MACHINE = 2;
  // The review-loop cap was hit (03c).
  GOAL_PAUSE_REASON_REVIEW_LOOP = 3;
  // The opt-in reserve rule paused it; resumes when the bucket resets.
  GOAL_PAUSE_REASON_RESERVE = 4;
  // The provider closed the work item or the change request without merging
  // it while the goal ran (03h, "Provider-side changes"). The hub paused the
  // harness so it stops spending quota; the owner decides: resume (keep
  // going) or clear (CANCELLED).
  GOAL_PAUSE_REASON_WORK_ITEM_CLOSED = 5;
}

// GoalPhaseReason says why a goal is in its phase when the phase alone is
// ambiguous, and is the reason on each recorded transition. The unpaused
// causes of PAUSED stay in GoalPauseReason. "recovery required" is not a
// separate kind: it is TRIAGE_KIND_STUCK on a goal whose reason below needs a
// person to restore the pane (SESSION_CLOSED, LOCAL_CONFIRM_TIMEOUT).
enum GoalPhaseReason {
  GOAL_PHASE_REASON_UNSPECIFIED = 0;
  // STUCK: the goal line says BLOCKED with neither a watcher nor an owner.
  GOAL_PHASE_REASON_BLOCKED_NO_WATCHER = 1;
  // STUCK: the watched process died.
  GOAL_PHASE_REASON_WATCH_DEAD = 2;
  // STUCK: stopped twice without DONE (the corrective nudge did not help).
  GOAL_PHASE_REASON_STOPPED_TWICE = 3;
  // STUCK: the developer or the harness closed the session; nothing to nudge.
  GOAL_PHASE_REASON_SESSION_CLOSED = 4;
  // STUCK: a respawn needed approval at the machine and nobody gave it.
  GOAL_PHASE_REASON_LOCAL_CONFIRM_TIMEOUT = 5;
  // STUCK: PANE_LOST for 10 minutes.
  GOAL_PHASE_REASON_PANE_LOST_TIMEOUT = 6;
  // COOLDOWN: two evaluations without progress.
  GOAL_PHASE_REASON_NO_PROGRESS = 7;
  // LIMIT_WAIT: a usage limit (short window or weekly).
  GOAL_PHASE_REASON_USAGE_LIMIT = 8;
  // LIMIT_WAIT: a rate limit the harness gave up retrying.
  GOAL_PHASE_REASON_RATE_LIMITED = 9;
  // VERIFYING: the goal line says DONE.
  GOAL_PHASE_REASON_DONE_CLAIMED = 10;
  // VERIFYING: the change request merged while the goal line was not DONE
  // (a person merged it, or the goal did moments before writing DONE). The
  // hub clears the harness goal, then the goal becomes MERGED.
  GOAL_PHASE_REASON_EXTERNAL_MERGE = 11;
  // RUNNING after a re-arm (ControlGoal NOT_DONE or EDIT on a finished goal).
  GOAL_PHASE_REASON_REARMED = 12;
  // RUNNING after a resume (limit wait over, operator resume).
  GOAL_PHASE_REASON_RESUMED = 13;
  // EXPIRED: StartGoal not delivered in 30 minutes.
  GOAL_PHASE_REASON_START_NOT_DELIVERED = 20;
  // ABANDONED: the operator said the start never happened.
  GOAL_PHASE_REASON_OPERATOR_NOT_STARTED = 21;
  // ABANDONED: the machine started draining before the composite passed
  // preflight (the goal moves to another machine).
  GOAL_PHASE_REASON_DRAINING = 22;
  // ABANDONED: the machine was revoked.
  GOAL_PHASE_REASON_MACHINE_REVOKED = 23;
  // CANCELLED: the work item was closed without being done.
  GOAL_PHASE_REASON_WORK_ITEM_CLOSED = 30;
  // CANCELLED: the change request was closed unmerged.
  GOAL_PHASE_REASON_CHANGE_REQUEST_CLOSED = 31;
  // CLEARED (and the harness goal cleared) by an operator.
  GOAL_PHASE_REASON_OPERATOR_CLEAR = 32;
}

// GoalDefinition is what was dispatched: what the goal works on, where and
// with what permission. Chosen at dispatch, so version only moves when an
// EDIT changes goal_text. Named so it is not confused with the agent's
// GoalSpec, which is the typed command built from it.
message GoalDefinition {
  // What it works on; kind ROUTINE for routine runs.
  fleet.type.v1.WorkItemRef work_item = 1;
  fleet.type.v1.RepoRef repo = 2;
  fleet.type.v1.WorkItemRef change_request = 3;
  // Set when a routine started it.
  RoutineId routine = 4;
  fleet.type.v1.MachineId machine = 5;
  fleet.type.v1.Harness harness = 6;
  string profile = 7;
  fleet.type.v1.AccountId account = 8;
  string model = 9;
  string effort = 10;
  repeated fleet.type.v1.ConsentAct consent = 11;
  // Untrusted when it echoes a work item title.
  string goal_text = 12;
  string dispatch_reason = 13;
  // Session was cleared (/clear) before typing (GoalSpec.fresh_context).
  bool fresh_context = 14;
  fleet.type.v1.Principal started_by = 15;
  // Dispatch attempt for this work item, from 1. Every attempt is a new goal
  // (a failed or expired start is never revived), so per-attempt history is
  // the chain of previous_goal. "Three failures on different machines" counts
  // attempts.
  uint32 attempt = 16;
  // The goal this one retries; unset for attempt 1.
  fleet.type.v1.GoalId previous_goal = 17;
  // Snapshot of the routine's rule and path at plan time, so UpdateRoutine or
  // DeleteRoutine mid-run cannot change what "done" means for this run (03i).
  // UNSPECIFIED for a goal that is not a routine run.
  DoneRule done_rule = 18;
  string report_path = 19;
}

// GoalStatus is everything the hub concluded or observed about a goal's run:
// its phase, the goal file, git state, counters. The phase is a hub decision,
// but it is a state-machine position, not an owner choice, so it is not
// versioned: actions guard it with ControlGoalRequest.expected_phase, and
// Watch orders it by hub_seq.
message GoalStatus {
  google.protobuf.Timestamp observed_time = 1;
  // Watch hub_seq of the change that last touched this status.
  uint64 hub_seq = 2;

  fleet.type.v1.SessionId session = 10;
  fleet.type.v1.PaneKey pane = 11;
  GoalPhase phase = 12;
  google.protobuf.Timestamp phase_time = 13;
  // From the goal file (G2). Untrusted text. first_line and head_commit are
  // volatile: at most one Watch message per 5 s when only they change.
  fleet.type.v1.GoalLineState line_state = 14;
  string first_line = 15;
  string consent_line = 16;
  string head_commit = 17;
  bool dirty = 18;
  string branch = 19;
  // Set in LIMIT_WAIT: when the hub resumes the goal.
  google.protobuf.Timestamp limit_wait_until_time = 20;
  google.protobuf.Timestamp cooldown_until_time = 21;
  uint32 nudges = 22;
  uint32 no_progress_runs = 23;
  uint32 review_rounds = 24;
  // A HarnessCondition is open on the pane.
  bool provider_condition = 25;
  // The failure that ended this attempt, for START_FAILED, START_EXHAUSTED,
  // ABANDONED and EXPIRED.
  fleet.type.v1.ErrorDetail start_error = 26;
  // Latest operation for this goal (start, control, nudge).
  fleet.type.v1.CommandId last_operation = 27;
  // Exactly what was typed (StartGoalResult.typed_goal_line).
  string typed_goal_line = 28;

  // Set while phase is PAUSED.
  GoalPauseReason pause_reason = 40;
  // The operator who paused it, for reason OPERATOR; unset otherwise (the
  // agent cannot say who was at the machine).
  fleet.type.v1.Principal paused_by = 41;
  // review_rounds when the cap last paused the goal. The cap compares
  // review_rounds minus this, so an operator's resume is not re-paused at
  // once by the rounds that already counted.
  uint32 review_rounds_baseline = 42;
  // For RESERVE: when the hub resumes the goal (the deciding bucket's
  // resets_time). Unset for the reasons that wait for a person.
  google.protobuf.Timestamp auto_resume_time = 43;

  // Why the goal is in this phase when the phase alone is ambiguous (the
  // causes of STUCK, VERIFYING, CANCELLED, ...). Set with every transition.
  GoalPhaseReason phase_reason = 50;
  // For BLOCKED_OWNER: who and what the goal is waiting on, from the goal
  // line (OWNER=, ACTION=). Untrusted text.
  string blocked_owner = 51;
  string blocked_action = 52;
  // For VERIFYING: when the verifier stops waiting for the provider and
  // raises DISAGREE.
  google.protobuf.Timestamp verify_deadline_time = 53;
  // First RUNNING, and the end of the goal (first ENDED phase). The timeline
  // draws these, not create_time (plan time) or phase_time (overwritten when
  // MERGED becomes CLOSED). Unset until they happen; end_time stays set on
  // MERGED and CLOSED.
  google.protobuf.Timestamp start_time = 54;
  google.protobuf.Timestamp end_time = 55;
  // Harness restarts: runs beyond the first (goal_history.proto GoalRun).
  uint32 restarts = 56;
  // Quota the goal used, per bucket, from the account's readings across its
  // runs (approximate: other sessions spend from the same pool).
  repeated GoalUsage usage_consumed = 57;
  // The transcript stream of the goal's latest run (v3), when captured. The
  // terminal streams of every run are on GoalRun.logs.
  fleet.type.v1.LogStreamKey transcript = 58;
  // A prompt item is open for the pane (nudges suppressed).
  bool prompt_pending = 59;
  // A person typed in the pane recently: nudges and goal control are held
  // until this time (10 minutes after the last input).
  google.protobuf.Timestamp human_at_keyboard_until_time = 60;
  // Increments each time the goal line enters a BLOCKED state, so leaving and
  // re-entering Blocked notifies the owner again.
  uint32 block_epoch = 61;
}

// GoalUsage is the quota one goal used from one account bucket.
message GoalUsage {
  // The bucket key as on LimitBucket ("weekly_all", "weekly_opus", ...).
  string bucket_key = 1;
  // Percentage points of the bucket the account's reading moved while the
  // goal was RUNNING or STOPPED. Can be 0 when readings did not change.
  int32 percent_points = 2;
}

// Goal is one dispatched goal and its run history head.
message Goal {
  fleet.type.v1.GoalId id = 1;
  uint64 version = 2;
  google.protobuf.Timestamp create_time = 3;
  google.protobuf.Timestamp update_time = 4;

  GoalDefinition spec = 10;
  GoalStatus status = 11;
}

// ListGoalsRequest. Filter and order_by names: 02c-hub-watch-and-filters.md
// (the Fleet view timeline filters create_time to the last 7 days).
message ListGoalsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string filter = 3;
  string order_by = 4;
}

// ListGoalsResponse.
message ListGoalsResponse {
  repeated Goal goals = 1;
  string next_page_token = 2;
}

// GetGoalRequest.
message GetGoalRequest {
  fleet.type.v1.GoalId id = 1;
}

// GetGoalResponse.
message GetGoalResponse {
  Goal goal = 1;
}

// GoalAction is an operator's intent on a running goal. The hub translates
// it with the machine's MachineHarness.goal_control (the adapter's own
// account of the installed version), not a table of harness names.
enum GoalAction {
  GOAL_ACTION_UNSPECIFIED = 0;
  // pause_mode SUBCOMMAND: /goal pause; INTERRUPT: Interrupt.
  GOAL_ACTION_PAUSE = 1;
  // resume_mode SUBCOMMAND: /goal resume; TYPE_TEXT: SendKeys
  // GOAL_RESUME with resume_text.
  GOAL_ACTION_RESUME = 2;
  // /goal edit <text> where the harness has it. On a goal whose harness goal
  // already finished (VERIFYING, DISAGREE) it is a re-arm with the new text.
  GOAL_ACTION_EDIT = 3;
  // /goal clear. The goal ends CLEARED (the work item becomes MANUAL_ONLY),
  // or CANCELLED when it was PAUSED because the provider closed the work
  // item (pause_reason WORK_ITEM_CLOSED).
  GOAL_ACTION_CLEAR = 4;
  // Hub only: re-run verification against the code host now.
  GOAL_ACTION_RECHECK = 5;
  // DONE was wrong: re-arm. Valid in VERIFYING and DISAGREE, where the
  // harness has already achieved and cleared its goal, so a typed "not done"
  // would be an ordinary prompt with no goal loop. The agent rewrites the goal
  // file's first line ("reopened: <text>") and types the harness's set-goal
  // form in the same pane under the same goal id (StartGoal.rearm_reason,
  // 03c, "Re-arm"); the goal returns to RUNNING when the goal line is
  // WORKING again. `text` is the reason (4 KiB). Refused in any other phase
  // with GOAL_ACTION_NOT_ALLOWED.
  GOAL_ACTION_NOT_DONE = 6;
  // START_UNKNOWN: the operator says it never started; the goal becomes
  // ABANDONED and the work item READY.
  GOAL_ACTION_MARK_NOT_STARTED = 7;
}

// ControlGoalRequest.
message ControlGoalRequest {
  string request_id = 1;
  fleet.type.v1.GoalId goal = 2;
  // Goal.version (the spec); checked for EDIT, the only action that changes
  // the spec. 0 = do not check.
  uint64 expected_version = 3;
  GoalAction action = 4;
  // For EDIT: the new objective text; for NOT_DONE: why it is not done
  // (4 KiB).
  string text = 5;
  // The phase the caller saw when it chose the action; 0 = do not check. A
  // different phase fails with FAILED_PRECONDITION / GOAL_PHASE_CHANGED, so
  // "pause" on a goal that has since gone STUCK or MERGED is refused, not sent.
  GoalPhase expected_phase = 6;
}

// ControlGoalResponse. operation is unset for hub-only actions; an
// unsupported action fails with GOAL_SUBCOMMAND_UNSUPPORTED before sending, and
// an action the goal's phase does not allow fails with FAILED_PRECONDITION /
// GOAL_ACTION_NOT_ALLOWED (the table is in 03c, "Control actions by phase").
message ControlGoalResponse {
  Goal goal = 1;
  Operation operation = 2;
}
