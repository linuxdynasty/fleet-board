// fleet.hub.v1 devices and notification targets (ADR 0018). Modelled now so
// a phone app is additive later; push delivery itself is not built in v1.
// A device holds its own key pair; the hub stores only the public key and
// the scopes the owner granted. A device acts as Principal{kind DEVICE,
// device, on_behalf_of: the owner who approved it}.
//
// How a device authenticates (02f-hub-authentication.md): every request
// carries `Authorization: Fleet-Device <device id>.<unix seconds>.<nonce>.
// <signature>`, an Ed25519 signature with the device key over the method, path,
// SHA-256 of the body, the timestamp and the nonce; the hub refuses a
// timestamp more than 60 s off or a nonce it saw in that window. A stream
// (Watch) is signed once at open and ends the moment the device is revoked.
// Never a cookie, so a web page cannot ride it. The role the agent sees for a
// device is derived from its scopes (02d, "Role sent to the agent").
syntax = "proto3";

package fleet.hub.v1;

import "fleet/hub/v1/common.proto";
import "fleet/hub/v1/triage.proto";
import "fleet/type/v1/ids.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

// DevicePlatform is what kind of client a device is. Display only.
enum DevicePlatform {
  DEVICE_PLATFORM_UNSPECIFIED = 0;
  DEVICE_PLATFORM_IOS = 1;
  DEVICE_PLATFORM_ANDROID = 2;
  DEVICE_PLATFORM_DESKTOP = 3;
  DEVICE_PLATFORM_OTHER = 15;
}

// DeviceSpec is what the device asked for and the owner decided. Covered by
// Device.version, so approving or revoking a device that keeps pinging is
// never a version conflict.
message DeviceSpec {
  string display_name = 1;
  DevicePlatform platform = 2;
  // Raw Ed25519 public key (32 bytes); the device signs its requests (or its
  // client certificate is issued from it). Never a password or token.
  bytes public_key = 3;
  // The user the device acts for (Principal.id); set at approval.
  fleet.type.v1.PrincipalId principal = 4;
  // Scopes the device asked for when pairing. An empty request means the
  // phone default, SCOPE_READ and SCOPE_APPROVALS; SCOPE_LOGS is never in the
  // default, and neither is SCOPE_ADMIN or SCOPE_SETTINGS.
  repeated Scope requested_scopes = 5;
  // Granted scopes; a subset of the user's, and of what the owner ticked.
  // May include SCOPE_LOGS only when the owner ticked it (ADR 0019). Narrowed
  // again to the user's role on every call.
  repeated Scope scopes = 6;
  // Unset while pairing is pending.
  google.protobuf.Timestamp approved_time = 7;
  // Set once revoked; a revoked device is refused on every call.
  google.protobuf.Timestamp revoked_time = 8;
}

// DeviceStatus is what the hub observed of the device. Not versioned.
message DeviceStatus {
  google.protobuf.Timestamp observed_time = 1;
  // Watch hub_seq of the change that last touched this status.
  uint64 hub_seq = 2;
  // Volatile: at most one Watch message per 30 s (02c).
  google.protobuf.Timestamp last_seen_time = 10;
}

// Device is one paired (or pairing) client device.
message Device {
  fleet.type.v1.DeviceId id = 1;
  uint64 version = 2;
  google.protobuf.Timestamp create_time = 3;
  google.protobuf.Timestamp update_time = 4;

  DeviceSpec spec = 10;
  DeviceStatus status = 11;
}

// RequestPairingRequest is sent by the new device, unauthenticated, over
// the hub's TLS port. It creates a pending Device and shows a short code on
// both the device and the owner's UI.
message RequestPairingRequest {
  // Idempotency key, scoped by (peer address, public key) because the call
  // is unauthenticated.
  string request_id = 1;
  string display_name = 2;
  DevicePlatform platform = 3;
  bytes public_key = 4;
  repeated Scope requested_scopes = 5;
}

// RequestPairingResponse.
message RequestPairingResponse {
  Device device = 1;
  // Six digits derived from the public key and a hub nonce; the owner
  // compares it before approving. Recomputed on a replay, never stored.
  string pairing_code = 2;
  google.protobuf.Timestamp expire_time = 3;
}

// ApprovePairingRequest is sent by an owner (SCOPE_ADMIN).
message ApprovePairingRequest {
  string request_id = 1;
  fleet.type.v1.DeviceId id = 2;
  // spec.version the owner saw; last_seen_time updates never change it.
  uint64 expected_version = 3;
  // Must match the code the device shows.
  string pairing_code = 4;
  // Scopes granted; may be fewer than requested, never more. SCOPE_LOGS is
  // granted only when listed here by the owner, even if the device asked for
  // it (anything else not covered is SCOPE_NOT_GRANTABLE).
  repeated Scope scopes = 5;
}

// ApprovePairingResponse.
message ApprovePairingResponse {
  Device device = 1;
}

// RevokeDeviceRequest. Takes effect at once, including open Watch streams.
message RevokeDeviceRequest {
  string request_id = 1;
  fleet.type.v1.DeviceId id = 2;
  uint64 expected_version = 3;
}

// RevokeDeviceResponse.
message RevokeDeviceResponse {
  Device device = 1;
}

// ListDevicesRequest. Filter and order_by names: 02c-hub-watch-and-filters.md.
message ListDevicesRequest {
  int32 page_size = 1;
  string page_token = 2;
  string filter = 3;
  string order_by = 4;
}

// ListDevicesResponse.
message ListDevicesResponse {
  repeated Device devices = 1;
  string next_page_token = 2;
}

// GetDeviceRequest.
message GetDeviceRequest {
  fleet.type.v1.DeviceId id = 1;
}

// GetDeviceResponse.
message GetDeviceResponse {
  Device device = 1;
}

// NotificationChannel is how a target is reached.
enum NotificationChannel {
  NOTIFICATION_CHANNEL_UNSPECIFIED = 0;
  // Push to a paired device (APNs/FCM handle held opaque).
  NOTIFICATION_CHANNEL_PUSH = 1;
  // A chat binding (placeholder; no chat integration in v1).
  NOTIFICATION_CHANNEL_CHAT = 2;
}

// ChatBinding is a placeholder for a later chat integration.
message ChatBinding {
  // e.g. "slack", "matrix".
  string provider = 1;
  // Provider's channel or user id. Never a token.
  string destination = 2;
}

// NotificationTarget is where one principal's notifications go. It has no
// observed state, so it has no spec/status split: every field is an owner
// choice and version covers all of it.
message NotificationTarget {
  NotificationTargetId id = 1;
  uint64 version = 2;
  google.protobuf.Timestamp create_time = 3;
  google.protobuf.Timestamp update_time = 4;

  // Output-only: the caller's own Principal.id, set by the hub on create and
  // ignored in requests. ADMIN lists every principal's targets.
  fleet.type.v1.PrincipalId principal = 10;
  NotificationChannel channel = 11;
  fleet.type.v1.DeviceId device = 12;
  // Push service handle as the device registered it; opaque to the hub,
  // never logged, write-only through the API (always empty when read) and
  // excluded from the stored idempotent response. 4 KiB.
  bytes push_handle = 13;
  ChatBinding chat = 14;
  bool enabled = 15;
  // Notify for items at or above this severity (default ACTION).
  Severity min_severity = 16;
}

// ListNotificationTargetsRequest. Filter and order_by names: 02c-hub-watch-and-filters.md.
message ListNotificationTargetsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string filter = 3;
  string order_by = 4;
}

// ListNotificationTargetsResponse.
message ListNotificationTargetsResponse {
  repeated NotificationTarget notification_targets = 1;
  string next_page_token = 2;
}

// CreateNotificationTargetRequest.
message CreateNotificationTargetRequest {
  string request_id = 1;
  // principal is ignored: the hub sets it from the caller.
  NotificationTarget notification_target = 2;
}

// CreateNotificationTargetResponse.
message CreateNotificationTargetResponse {
  NotificationTarget notification_target = 1;
}

// UpdateNotificationTargetRequest. Updatable: enabled, min_severity,
// push_handle, chat.
message UpdateNotificationTargetRequest {
  string request_id = 1;
  NotificationTarget notification_target = 2;
  google.protobuf.FieldMask update_mask = 3;
  uint64 expected_version = 4;
}

// UpdateNotificationTargetResponse.
message UpdateNotificationTargetResponse {
  NotificationTarget notification_target = 1;
}

// DeleteNotificationTargetRequest.
message DeleteNotificationTargetRequest {
  string request_id = 1;
  NotificationTargetId id = 2;
  uint64 expected_version = 3;
}

// DeleteNotificationTargetResponse.
message DeleteNotificationTargetResponse {}
