// fleet.hub.v1 accounts: harness accounts, their latest usage "as shown"
// plus standardized buckets, pacing (03b W3) and the probe that reads them.
// Usage belongs to accounts, not machines. One account per harness per
// machine for now; the profile key on AccountBinding makes more additive.
syntax = "proto3";

package fleet.hub.v1;

import "fleet/hub/v1/common.proto";
import "fleet/type/v1/consent.proto";
import "fleet/type/v1/ids.proto";
import "fleet/type/v1/status.proto";
import "fleet/type/v1/usage.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

// AccountMode (ADR 0008).
enum AccountMode {
  ACCOUNT_MODE_UNSPECIFIED = 0;
  // The scheduler may dispatch goals on it.
  ACCOUNT_MODE_FLEET = 1;
  // Observed and shown only; never dispatched to.
  ACCOUNT_MODE_INTERACTIVE_ONLY = 2;
}

// PacingState is the scheduler's verdict per account (03b).
enum PacingState {
  PACING_STATE_UNSPECIFIED = 0;
  PACING_STATE_OK = 1;
  PACING_STATE_AHEAD = 2;
  PACING_STATE_BEHIND = 3;
  PACING_STATE_SHORT_LIMIT = 4;
  PACING_STATE_RESERVE = 5;
  PACING_STATE_UNKNOWN = 6;
  PACING_STATE_STALE = 7;
  PACING_STATE_EXCLUDED = 8;
}

// AccountBindingSpec maps the account to one machine and harness profile
// (empty = the harness default). The owner sets it for an account the harness
// shows no identity for (Codex); the agent's observation is AccountBinding.
message AccountBindingSpec {
  fleet.type.v1.MachineId machine = 1;
  string profile = 2;
}

// AccountBinding is one machine where the account is signed in, and the
// harness profile it is signed in under, as observed.
message AccountBinding {
  fleet.type.v1.MachineId machine = 1;
  string profile = 2;
  bool signed_in = 3;
  google.protobuf.Timestamp observed_time = 4;
}

// AccountUsage is the latest reading the scheduler uses.
message AccountUsage {
  google.protobuf.Timestamp read_time = 1;
  fleet.type.v1.UsageSource source = 2;
  fleet.type.v1.ParseOutcome parse = 3;
  repeated fleet.type.v1.LimitBucket buckets = 4;
  // raw_screen only through GetAccount with include_raw_screen.
  fleet.type.v1.ShownUsage shown = 5;
  fleet.type.v1.SpendReading spend = 6;
  // Untrusted text.
  string credits_text = 7;
  string harness_version = 8;
  string parser_version = 9;
  fleet.type.v1.MachineId read_on = 10;
}

// AccountPacing is the scheduler's output for the strip and Work view.
message AccountPacing {
  PacingState state = 1;
  uint32 allowed_active = 2;
  uint32 active_goals = 3;
  // 1 = most unused quota relative to time left.
  uint32 rank = 4;
  // Used percent minus the burn-down target on the deciding bucket.
  int32 ahead_points = 5;
  // Bucket that decided the state, e.g. "weekly_all".
  string deciding_bucket = 6;
  // Usable quota (100 - reserve) projected to be left unused at reset at the
  // burn rate so far; the Usage view's "will it go to waste?" line. The
  // reserve is never counted as waste. Unset while the reading is stale.
  optional int32 projected_unused_percent = 7;
  // No goal is running on the account while it is behind pace.
  bool idle_while_behind = 8;
  // The reading predates the last reset; a re-probe is pending.
  bool reading_stale = 9;
}

// AccountProbe is the probe the hub assigned for this account (D1).
message AccountProbe {
  fleet.type.v1.ProbeId id = 1;
  fleet.type.v1.MachineId machine = 2;
  bool alive = 3;
  google.protobuf.Timestamp last_success_time = 4;
  google.protobuf.Timestamp next_run_time = 5;
  uint32 consecutive_failures = 6;
  fleet.type.v1.ReasonCode last_failure = 7;
  google.protobuf.Duration interval = 8;
}

// AccountSpec is what the owner decided about an account. Covered by
// Account.version and expected_version.
message AccountSpec {
  string display_name = 1;
  AccountMode mode = 2;
  fleet.type.v1.BudgetKind budget_kind = 3;
  // Never used by the fleet; kept for the owner (design.md rule 3).
  uint32 reserve_percent = 4;
  // Consent acts this account allows (ADR 0008).
  repeated fleet.type.v1.ConsentAct consent = 5;
  // For BUDGET_KIND_DOLLAR_CAP: the owner's cap for display, micro-units.
  int64 spend_cap_micros = 6;
  // Owner-mapped machines (a Codex account that shows no identity).
  repeated AccountBindingSpec bindings = 7;
}

// AccountStatus is everything observed or computed about an account: the
// identity as the harness shows it, where it is signed in, the latest
// reading, the scheduler's pacing and the probe. Not versioned.
message AccountStatus {
  google.protobuf.Timestamp observed_time = 1;
  // Watch hub_seq of the change that last touched this status.
  uint64 hub_seq = 2;

  fleet.type.v1.Harness harness = 10;
  fleet.type.v1.AccountKey account_key = 11;
  // As the harness shows them. Untrusted text. email is empty unless the
  // owner turned on share_identity_email.
  string label = 12;
  string plan = 13;
  string login_method = 14;
  string organization = 15;
  string email = 16;
  bool identity_not_shown = 17;
  repeated AccountBinding bindings = 18;
  AccountUsage usage = 19;
  // Rewritten at every scheduler evaluation; ahead_points, rank and
  // projected_unused_percent are volatile (02c, "Volatile fields").
  AccountPacing pacing = 20;
  AccountProbe probe = 21;
}

// Account is one harness account (subscription or API key).
message Account {
  fleet.type.v1.AccountId id = 1;
  uint64 version = 2;
  google.protobuf.Timestamp create_time = 3;
  google.protobuf.Timestamp update_time = 4;

  AccountSpec spec = 10;
  AccountStatus status = 11;
}

// ListAccountsRequest. Filter and order_by names: 02c-hub-watch-and-filters.md.
message ListAccountsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string filter = 3;
  string order_by = 4;
}

// ListAccountsResponse.
message ListAccountsResponse {
  repeated Account accounts = 1;
  string next_page_token = 2;
}

// GetAccountRequest.
message GetAccountRequest {
  fleet.type.v1.AccountId id = 1;
  // Needs SCOPE_LOGS: the redacted raw usage screen is terminal text.
  bool include_raw_screen = 2;
}

// GetAccountResponse.
message GetAccountResponse {
  Account account = 1;
}

// UpdateAccountRequest. Updatable: spec.display_name, spec.mode,
// spec.reserve_percent, spec.consent, spec.budget_kind,
// spec.spend_cap_micros and spec.bindings (to map a Codex account that shows
// no identity to a machine). status is output-only.
message UpdateAccountRequest {
  string request_id = 1;
  Account account = 2;
  google.protobuf.FieldMask update_mask = 3;
  uint64 expected_version = 4;
}

// UpdateAccountResponse.
message UpdateAccountResponse {
  Account account = 1;
}

// ProbeAccountRequest runs the account's probe now (EnsureProbe run_now).
message ProbeAccountRequest {
  string request_id = 1;
  fleet.type.v1.AccountId id = 2;
}

// ProbeAccountResponse.
message ProbeAccountResponse {
  Operation operation = 1;
}

// UsageReading is one stored reading, for the burn-down chart.
message UsageReading {
  fleet.type.v1.AccountId account = 1;
  google.protobuf.Timestamp read_time = 2;
  fleet.type.v1.UsageSource source = 3;
  fleet.type.v1.ParseOutcome parse = 4;
  repeated fleet.type.v1.LimitBucket buckets = 5;
  fleet.type.v1.SpendReading spend = 6;
}

// ListUsageReadingsRequest. Filter and order_by names: 02c-hub-watch-and-filters.md.
message ListUsageReadingsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string filter = 3;
  string order_by = 4;
  fleet.type.v1.AccountId account = 5;
}

// ListUsageReadingsResponse.
message ListUsageReadingsResponse {
  repeated UsageReading readings = 1;
  string next_page_token = 2;
}
