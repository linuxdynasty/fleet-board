// fleet.hub.v1 routines (ADR 0018): recurring fleet work that is not an
// issue, such as dependency bumps, flaky-test sweeps or a weekly report. A
// routine run is a normal goal whose work item has kind ROUTINE, so pacing,
// consent, triage and verification apply unchanged. How runs are triggered,
// numbered and verified: docs/specs/03i-routines.md.
syntax = "proto3";

package fleet.hub.v1;

import "fleet/hub/v1/common.proto";
import "fleet/type/v1/consent.proto";
import "fleet/type/v1/ids.proto";
import "fleet/type/v1/status.proto";
import "fleet/type/v1/work.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

// QueueEmptyTrigger runs the routine when the repo has no READY work item
// and a slot and account are free, at most once per min_interval counted from
// the previous run's start (not its end), so a long run does not stretch the
// interval.
message QueueEmptyTrigger {
  // At least 1 minute; default 1 hour when unset.
  google.protobuf.Duration min_interval = 1;
}

// CronTrigger runs the routine on a schedule (5-field cron). A fire time that
// does not exist in the timezone (the spring-forward gap) runs at the first
// instant after the gap; one that exists twice (fall back) runs once, at the
// first. If the hub was down or the pass late, at most one missed fire runs
// when it is back (the latest); older ones are skipped and counted in
// RoutineStatus.skipped_fires.
message CronTrigger {
  string expression = 1;
  // IANA timezone the expression is read in.
  string timezone = 2;
}

// RoutineTrigger says when a run starts. A run never starts while the
// previous run's goal is live (03c phase classes); a run that stays live
// longer than RoutineSpec.blocked_after raises a triage item instead of
// waiting silently.
message RoutineTrigger {
  oneof kind {
    QueueEmptyTrigger queue_empty = 1;
    CronTrigger cron = 2;
  }
}

// DoneRule says when a routine run counts as done; the verifier applies it
// instead of the work-item check.
enum DoneRule {
  DONE_RULE_UNSPECIFIED = 0;
  // DONE and the run's change request merged (dependency bumps).
  DONE_RULE_CHANGE_REQUEST_MERGED = 1;
  // The goal line says DONE; nothing to verify on a code host.
  DONE_RULE_GOAL_DONE_ONLY = 2;
  // DONE and report_path exists on the run's pushed branch: the verifier
  // asks the code host for the path at the branch head
  // (IntegrationProviderService.PathExists), so it needs a code-host
  // integration with IntegrationCapabilities.path_exists. Without one the rule
  // cannot be saved (INVALID_ARGUMENT on the routine).
  DONE_RULE_REPORT_WRITTEN = 3;
}

// RoutineSpec is what the owner configured. Covered by Routine.version, so a
// run starting between loading and saving the form is not a conflict.
message RoutineSpec {
  string display_name = 1;
  bool enabled = 2;
  fleet.type.v1.RepoRef repo = 3;
  // Unset = any harness the scheduler picks.
  fleet.type.v1.Harness harness = 4;
  string profile = 5;
  RoutineTrigger trigger = 6;
  // Goal text with placeholders {repo}, {run}, {date}; 4 KiB.
  string goal_text_template = 7;
  // Consent acts for its goals, further limited by repo ∩ account.
  repeated fleet.type.v1.ConsentAct consent = 8;
  DoneRule done_rule = 9;
  // For DONE_RULE_REPORT_WRITTEN: path relative to the checkout.
  string report_path = 10;
  fleet.type.v1.Principal owner = 11;
  // What the run's goals ask of the harness, as GoalSpecInput does for a
  // manual dispatch. Empty = leave as is, so a sweep can ask for a cheap
  // model and low effort.
  string model = 12;
  string effort = 13;
  bool fresh_context = 14;
  // Pin the account or machine; unset = the scheduler chooses. With harness
  // unset too, the scheduler picks the (harness, account) with the highest
  // projected_unused_percent, which is how routines spend leftover quota.
  fleet.type.v1.AccountId account = 15;
  fleet.type.v1.MachineId machine = 16;
  // How long a run may stay live before the routine is flagged blocked
  // (TRIAGE_KIND_ROUTINE_BLOCKED); a stuck or limit-waiting run would
  // otherwise stop the routine for days without a word. Default 12 hours.
  google.protobuf.Duration blocked_after = 17;
}

// RoutineStatus is the run bookkeeping. Not versioned.
message RoutineStatus {
  google.protobuf.Timestamp observed_time = 1;
  // Watch hub_seq of the change that last touched this status.
  uint64 hub_seq = 2;
  // When the latest run was planned.
  google.protobuf.Timestamp last_run_time = 10;
  // Next cron fire; unset for queue_empty (evaluated every pass) and while
  // disabled.
  google.protobuf.Timestamp next_run_time = 11;
  fleet.type.v1.GoalId last_goal = 12;
  // The highest run number allocated. A run that fails to start keeps its
  // number, so a WorkItemKey is never reused.
  uint32 run_count = 13;
  // Cron fires skipped because the hub could not run them in time.
  uint32 skipped_fires = 14;
}

// Routine is one configured routine.
message Routine {
  RoutineId id = 1;
  uint64 version = 2;
  google.protobuf.Timestamp create_time = 3;
  google.protobuf.Timestamp update_time = 4;

  RoutineSpec spec = 10;
  RoutineStatus status = 11;
}

// ListRoutinesRequest. Filter and order_by names: 02c-hub-watch-and-filters.md.
message ListRoutinesRequest {
  int32 page_size = 1;
  string page_token = 2;
  string filter = 3;
  string order_by = 4;
}

// ListRoutinesResponse.
message ListRoutinesResponse {
  repeated Routine routines = 1;
  string next_page_token = 2;
}

// GetRoutineRequest.
message GetRoutineRequest {
  RoutineId id = 1;
}

// GetRoutineResponse.
message GetRoutineResponse {
  Routine routine = 1;
}

// CreateRoutineRequest. id, version, times and status are assigned by the hub.
message CreateRoutineRequest {
  string request_id = 1;
  Routine routine = 2;
}

// CreateRoutineResponse.
message CreateRoutineResponse {
  Routine routine = 1;
}

// UpdateRoutineRequest. Masks name spec fields, e.g. "spec.enabled".
message UpdateRoutineRequest {
  string request_id = 1;
  Routine routine = 2;
  google.protobuf.FieldMask update_mask = 3;
  uint64 expected_version = 4;
}

// UpdateRoutineResponse.
message UpdateRoutineResponse {
  Routine routine = 1;
}

// DeleteRoutineRequest. Running goals continue (each carries a snapshot of its
// done rule and report path, GoalDefinition.done_rule); no new runs.
message DeleteRoutineRequest {
  string request_id = 1;
  RoutineId id = 2;
  uint64 expected_version = 3;
}

// DeleteRoutineResponse.
message DeleteRoutineResponse {}

// RunRoutineRequest starts a run now, outside the trigger. Refused while the
// previous run is live (FAILED_PRECONDITION / WORK_ITEM_BUSY); otherwise it
// plans like any run, through the same checks as a manual dispatch.
message RunRoutineRequest {
  string request_id = 1;
  RoutineId id = 2;
}

// RunRoutineResponse.
message RunRoutineResponse {
  fleet.type.v1.GoalId goal = 1;
  Operation operation = 2;
}
