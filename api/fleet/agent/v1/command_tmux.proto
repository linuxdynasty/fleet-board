// fleet.agent.v1 command kinds for usage probes (D1) and tmux control (F,
// E10, E11), plus SessionTarget, the way a command names a tmux session.
syntax = "proto3";

package fleet.agent.v1;

import "fleet/agent/v1/snapshot.proto";
import "fleet/type/v1/harness.proto";
import "fleet/type/v1/ids.proto";
import "fleet/type/v1/work.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/linuxdynasty/fleet-board/api/fleet/agent/v1;agentv1";

// SessionTarget names a session on a server. Fleet sessions are addressed by
// hub id or fleet name; the developer's own sessions (whose names may contain
// spaces, e.g. "codex prompt 1") are addressed by tmux's session id from the
// latest snapshot, guarded by server_start_id because tmux reuses ids after a
// server restart.
message SessionTarget {
  fleet.type.v1.TmuxServerKind server = 1;
  oneof by {
    fleet.type.v1.SessionId session_id = 2;
    // Untrusted when echoed back; validated [a-z0-9][a-z0-9-]{0,31} by
    // the hub before sending.
    string name = 3;
    // tmux session id such as "$3", as reported in the snapshot.
    string tmux_id = 4;
  }
  // Required with tmux_id: the server instance the id belongs to. The agent
  // refuses with REASON_CODE_SESSION_NOT_FOUND if the server restarted since.
  string server_start_id = 5;
}

// ===== D1. Probes =====

// EnsureProbe: keep one idle harness session on the fleet-probe server for
// this account and run its usage command on schedule. Declarative.
message EnsureProbe {
  fleet.type.v1.ProbeId probe_id = 1;
  fleet.type.v1.AccountId account_id = 2;
  // Expected key; the agent refuses with ACCOUNT_MISMATCH if the harness
  // shows a different identity.
  fleet.type.v1.AccountKey account_key = 3;
  fleet.type.v1.Harness harness = 4;
  google.protobuf.Duration interval = 5;
  // Run once now in addition to the schedule (goal start/finish, D3 jump).
  bool run_now = 6;
}

// StopProbe tears the probe session down. Declarative.
message StopProbe {
  fleet.type.v1.ProbeId probe_id = 1;
}

// ===== F. tmux control =====

// EnsureSession (F1): create or reuse a named session. Declarative.
message EnsureSession {
  fleet.type.v1.SessionId session_id = 1;
  fleet.type.v1.TmuxServerKind server = 2;
  // [a-z0-9][a-z0-9-]{0,31}, unique per machine.
  string name = 3;
  fleet.type.v1.Workdir workdir = 4;
  // Optional harness to start through its adapter; empty = login shell.
  fleet.type.v1.Harness harness = 5;
  // Resume (adapter ResumeArgs) instead of a fresh start.
  bool resume = 6;
  // Attach to an existing session of that name instead of failing.
  bool reuse = 7;
  // FLEET_OWNER value.
  string owner = 8;
  // Name for the first window; empty = settings template.
  string window_name = 9;
  fleet.type.v1.GoalId goal_id = 10;
}

// EnsureSessionResult.
message EnsureSessionResult {
  TmuxSession session = 1;
  bool created = 2;
  // Pane where the harness or shell runs.
  fleet.type.v1.PaneKey pane = 3;
}

// EnsureWindow (F2): same for a window in a session. Declarative.
message EnsureWindow {
  SessionTarget session = 1;
  // Name as it will show in the status bar.
  string window_name = 2;
  fleet.type.v1.Workdir workdir = 3;
  fleet.type.v1.Harness harness = 4;
  bool resume = 5;
  // Reuse a window of that name if it exists.
  bool reuse = 6;
  fleet.type.v1.GoalId goal_id = 7;
}

// EnsureWindowResult.
message EnsureWindowResult {
  TmuxWindow window = 1;
  bool created = 2;
  fleet.type.v1.PaneKey pane = 3;
}

// SendKeys (F3). NOT idempotent: a retry after UNKNOWN_OUTCOME is refused;
// the hub asks a person. Rate-limited per settings.
message SendKeys {
  fleet.type.v1.PaneKey pane = 1;
  repeated fleet.type.v1.KeyInput keys = 2;
  // Required when answering a prompt; PROMPT_GONE if it left the screen.
  fleet.type.v1.PromptId answering_prompt = 3;
  // Refuse with PANE_BUSY unless the input line is empty (goal typing).
  bool require_empty_input_line = 4;
}

// Interrupt (F4): C-c to the pane. Idempotent in effect.
message Interrupt {
  fleet.type.v1.PaneKey pane = 1;
}

// RespawnPane (F5): restart the harness in a dead or stuck pane through the
// adapter's ResumeArgs. Dangerous kind; may need local approval.
message RespawnPane {
  fleet.type.v1.PaneKey pane = 1;
  fleet.type.v1.Harness harness = 2;
  bool resume = 3;
}

// KillWindow (F6). Dangerous kind; may need local approval. Never used on
// windows the developer created unless requested_by is OWNER.
message KillWindow {
  fleet.type.v1.WindowKey window = 1;
}

// CapturePane (E10).
message CapturePane {
  fleet.type.v1.PaneKey pane = 1;
  // 0 = visible screen; otherwise the last N lines of history.
  uint32 last_lines = 2;
  bool keep_ansi = 3;
  // Cap for the returned text; the agent clamps to 256 KiB.
  uint32 max_bytes = 4;
}

// CapturePaneResult. Untrusted text.
message CapturePaneResult {
  string text = 1;
  bool truncated = 2;
  google.protobuf.Timestamp captured_at = 3;
}

// RunHarnessCommand (F8): type an allow-listed slash command at an idle
// prompt. Agent checks: in catalog (C4), catalog_hash current, class allowed
// for requested_by.role and local policy, ready pattern showing, input line
// empty. DENY-class commands are never typed.
message RunHarnessCommand {
  fleet.type.v1.PaneKey pane = 1;
  // Including the leading slash, e.g. "/compact".
  string command = 2;
  // Arguments typed after the command, capped at 4 KiB. Never for
  // DESTRUCTIVE or DENY classes.
  string args = 3;
  // The class the hub believes; the agent refuses on mismatch.
  fleet.type.v1.CommandClass expected_class = 4;
  string catalog_hash = 5;
}

// RunHarnessCommandResult.
message RunHarnessCommandResult {
  fleet.type.v1.CommandClass class = 1;
  // Screen after the command settled, ANSI stripped, 64 KiB cap, when the
  // class is OBSERVE. Untrusted text.
  string screen = 2;
}

// SetSessionAvailability (E11): the developer marked a session "available
// for work" on the board (or cleared it). Idle is still decided locally.
message SetSessionAvailability {
  SessionTarget session = 1;
  bool available_for_work = 2;
}
