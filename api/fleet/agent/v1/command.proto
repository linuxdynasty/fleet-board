// fleet.agent.v1 commands: hub -> agent typed commands (ADR 0004 envelope), and
// agent -> hub ack, progress and result. No shell string anywhere; the agent
// re-checks every command against local policy, settings, role and
// capability. RunExec is reserved and not defined in v1. Command kinds are
// defined in command_tmux.proto (probes, tmux control) and command_goal.proto
// (goals, worktrees, preflight, attach, logs, drain) and command_scratch.proto
// (scratch workspaces).
syntax = "proto3";

package fleet.agent.v1;

import "fleet/agent/v1/command_goal.proto";
import "fleet/agent/v1/command_scratch.proto";
import "fleet/agent/v1/command_tmux.proto";
import "fleet/type/v1/ids.proto";
import "fleet/type/v1/principal.proto";
import "fleet/type/v1/status.proto";
import "fleet/type/v1/trace.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// ===== Envelope =====

// Command is the envelope. The agent refuses expired (hub time), out-of-epoch
// and replayed commands; a known command_id returns its logged result.
message Command {
  // Idempotency key; unique per command.
  fleet.type.v1.CommandId command_id = 1;
  // Connection epoch from HelloAck; commands from another epoch are refused.
  uint64 epoch = 2;
  // Per-epoch sequence, strictly increasing; a lower or equal seq is replayed.
  uint64 seq = 3;
  // Hub time.
  google.protobuf.Timestamp issued_time = 4;
  // Hub time, always set by the hub (defaults: 2 min for interactive kinds,
  // 30 min for dispatch, 02-contracts "Deadlines"). The agent treats an
  // unset deadline as already past (EXPIRED).
  google.protobuf.Timestamp not_after_time = 5;
  // For a device or API token, role is the one the hub maps from the
  // principal's scopes (02d). The agent checks it against the role x command
  // matrix in docs/specs/02g-agent-security.md; local policy can only tighten.
  fleet.type.v1.Principal requested_by = 6;
  // Optional detached Ed25519 signature over the canonical envelope and kind
  // bytes, for deployments with a hardware signing key. Unused in v1.
  bytes sig = 7;
  // Capability this kind needs, so an unknown kind can still be answered
  // with STATUS_UNSUPPORTED and the capability name.
  fleet.type.v1.Capability requires = 8;
  // Trace context of the hub span that issued the command (W3C Trace
  // Context); the agent's spans for this command are its children.
  fleet.type.v1.TraceContext trace = 9;

  // Kinds are numbered by group: 10-19 probes, 20-39 tmux control, 40-49
  // goals and worktrees, 50-59 attach, 60-69 logs, 70-79 self-management,
  // 80-89 scratch workspaces.
  // Goals are paused, resumed, edited and cleared with the harness's own
  // /goal subcommands sent through RunHarnessCommand (G4); there is no
  // StopGoal. hub.v1 OperationKind uses the same numbers.
  oneof kind {
    EnsureProbe ensure_probe = 10;
    StopProbe stop_probe = 11;

    EnsureSession ensure_session = 20;
    EnsureWindow ensure_window = 21;
    SendKeys send_keys = 22;
    Interrupt interrupt = 23;
    RespawnPane respawn_pane = 24;
    KillWindow kill_window = 25;
    CapturePane capture_pane = 26;
    RunHarnessCommand run_harness_command = 27;
    SetPaneAvailability set_pane_availability = 28;

    Preflight preflight = 40;
    StartGoal start_goal = 41;
    EnsureWorktree ensure_worktree = 43;
    PruneWorktree prune_worktree = 44;
    EnsureGoalHooks ensure_goal_hooks = 45;
    RegisterGoal register_goal = 47;
    ReleaseGoal release_goal = 48;

    OpenAttach open_attach = 50;
    CloseAttach close_attach = 51;

    SetLogCapture set_log_capture = 60;
    SetLogShipping set_log_shipping = 61;

    Drain drain = 70;
    Undrain undrain = 71;

    EnsureScratch ensure_scratch = 80;
    CollectScratch collect_scratch = 81;
  }

  // RunExec (raw exec): number and name reserved, not defined in v1;
  // capability "exec.raw" is likewise reserved and never advertised.
  reserved 99;
  reserved "run_exec";
}

// CommandAck: the agent received and persisted the command.
message CommandAck {
  fleet.type.v1.CommandId command_id = 1;
  google.protobuf.Timestamp received_time = 2;
}

// [CAP G3 G4 L3]
// CommandProgress reports one step of a composite command as
// command_id+step. Never dropped. A FAILED step ends the composite.
//
// It also carries the one interim state of any command, a wait for local
// approval: step "awaiting_local_confirm" (step_index and step_count 0, so it
// is not one of a composite's steps), status AWAITING_LOCAL_CONFIRM, and
// metadata {"deadline": <RFC 3339, hub time>, "approver": "local_user"}. The
// command's CommandResult stays single and final; ResultAck, the outbox row
// and the agent's result log only ever see that one.
message CommandProgress {
  fleet.type.v1.CommandId command_id = 1;
  // Step name from the fixed set of names of the composite (for StartGoal the
  // 14 names in command_goal.proto, in that order; 02h has their restart
  // classes), kept as a string so a newer agent can add steps; the hub treats
  // an unknown name as display-only. step_index is the position in the full list and step_count is
  // its length, so a progress bar is stable even when steps are skipped.
  string step = 2;
  uint32 step_index = 3;
  uint32 step_count = 4;
  fleet.type.v1.Status status = 5;
  fleet.type.v1.ReasonCode reason = 6;
  google.protobuf.Timestamp report_time = 7;
  // Short diagnostic, no screen text. Capped at 1 KiB.
  string message = 8;
  // For a FAILED step: the same error fields as CommandResult.
  bool retryable = 9;
  google.protobuf.Duration retry_after = 10;
  map<string, string> metadata = 11;
}

// CommandResult is the final outcome, sent exactly once per command_id and
// never with STATUS_AWAITING_LOCAL_CONFIRM (that is CommandProgress). Kept in
// the agent's local log and replayed until the hub acknowledges it
// (Snapshot.unacked_results).
message CommandResult {
  fleet.type.v1.CommandId command_id = 1;
  fleet.type.v1.Status status = 2;
  fleet.type.v1.ReasonCode reason = 3;
  // Short diagnostic, no screen text unless the kind returns one. 1 KiB.
  string message = 4;
  google.protobuf.Timestamp started_time = 5;
  google.protobuf.Timestamp finished_time = 6;
  // Capability the agent lacks, for STATUS_UNSUPPORTED.
  fleet.type.v1.Capability missing_capability = 7;
  // True when the hub may send the same kind again and expect it to work: a
  // new command_id, or for EPOCH_MISMATCH the same command_id re-issued
  // under the new epoch (02i): EPOCH_MISMATCH, PANE_BUSY, RATE_LIMITED,
  // READY_TIMEOUT. Never true for UNKNOWN_OUTCOME.
  bool retryable = 8;
  // Earliest sensible retry when the agent knows it (rate limit window).
  google.protobuf.Duration retry_after = 9;
  // Small structured facts ({"step": "wait_ready"}); no screen text, no
  // secrets; at most 16 entries of 256 bytes. Same shape as
  // fleet.type.v1.ErrorDetail, which the hub API builds from these fields.
  map<string, string> metadata = 10;
  // The agent's span for this command, so the hub can link the result back
  // to the trace. Unset when the command carried none.
  fleet.type.v1.TraceContext trace = 11;

  // Results are always wrapped in a message so they can grow. Detail numbers
  // equal the kind's number, except ensure_goal_hooks_result.
  oneof detail {
    EnsureSessionResult ensure_session = 20;
    EnsureWindowResult ensure_window = 21;
    CapturePaneResult capture_pane = 26;
    RunHarnessCommandResult run_harness_command = 27;
    PreflightResult preflight = 40;
    StartGoalResult start_goal = 41;
    EnsureWorktreeResult ensure_worktree = 43;
    EnsureGoalHooksResult ensure_goal_hooks_result = 46;
    OpenAttachResult open_attach = 50;
    EnsureScratchResult ensure_scratch = 80;
    CollectScratchResult collect_scratch = 81;
  }
}
