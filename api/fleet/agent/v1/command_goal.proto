// fleet.agent.v1 command kinds for goals, worktrees and preflight (G, H, I),
// browser attach (J), session logs (K) and drain (M4).
syntax = "proto3";

package fleet.agent.v1;

import "fleet/agent/v1/command_tmux.proto";
import "fleet/agent/v1/snapshot.proto";
import "fleet/type/v1/ids.proto";
import "fleet/type/v1/status.proto";
import "fleet/type/v1/work.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/linuxdynasty/fleet-board/api/fleet/agent/v1;agentv1";

// ===== G, H, I. Goals, worktrees, preflight =====

// WorktreeMode says who creates the goal's worktree.
enum WorktreeMode {
  WORKTREE_MODE_UNSPECIFIED = 0;
  // The agent runs EnsureWorktree before starting the harness.
  WORKTREE_MODE_AGENT_ENSURES = 1;
  // The repo's own goal driver creates worktrees; start in the main checkout.
  WORKTREE_MODE_REPO_DRIVER = 2;
}

// GoalSpec is everything the agent needs to preflight or start a goal.
message GoalSpec {
  // 3 was a GitHub-only IssueRef; replaced by work_item and repo below.
  reserved 3;
  reserved "issue";
  fleet.type.v1.GoalId goal_id = 1;
  fleet.type.v1.SessionId session_id = 2;
  fleet.type.v1.Workdir workdir = 4;
  fleet.type.v1.Harness harness = 5;
  fleet.type.v1.AccountId account_id = 6;
  // Expected identity; ACCOUNT_MISMATCH if the harness shows another.
  fleet.type.v1.AccountKey account_key = 7;
  // Consent acts written into the goal (ADR 0008): "push", "pr-open",
  // "merge". "pr-open" means opening a change request on any code host; the
  // adapter renders it in the harness and provider's terms.
  repeated string consent = 8;
  // Goal text after "--". Capped at 4 KiB.
  string goal_text = 9;
  WorktreeMode worktree_mode = 10;
  // Branch for the worktree when the agent ensures it.
  string branch = 11;
  // What the goal works on: an issue, a ticket (Jira) or a change request.
  fleet.type.v1.WorkItemRef work_item = 12;
  // Where the code lives. Separate from work_item because a ticket in one
  // system (Jira) drives code on another (GitHub, GitLab).
  fleet.type.v1.RepoRef repo = 13;
  // Existing change request (PR/MR) the goal continues, if any.
  fleet.type.v1.WorkItemRef change_request = 14;
}

// Preflight (I1): check without acting.
message Preflight {
  GoalSpec spec = 1;
}

// PreflightResult: ok, or every reason that failed.
message PreflightResult {
  bool ok = 1;
  repeated fleet.type.v1.ReasonCode failures = 2;
  // One line per failure, no secrets. Untrusted where it echoes git/gh.
  repeated string details = 3;
  // Session the agent would reuse (E11), if any.
  fleet.type.v1.PaneKey would_reuse = 4;
}

// StartGoal (G3): agent-side composite under one command_id so it survives
// a hub outage. Steps are reported as CommandProgress. Dispatch deadline.
message StartGoal {
  GoalSpec spec = 1;
  // Prefer this available idle session (E11); re-checked just before typing.
  fleet.type.v1.PaneKey reuse_pane = 2;
  // Create a new window in this session when not reusing; empty = new
  // session named by the hub in spec.session_id.
  SessionTarget in_session = 3;
  // Empty = settings template "{harness} {work}", where {work} is
  // WorkItemRef.display ("eshu#7398", "eshu!12", "PROJ-123").
  string window_name = 4;
  google.protobuf.Duration ready_timeout = 5;
  google.protobuf.Duration goal_file_timeout = 6;
  // Skip preflight (already run and passed within the last minute).
  bool skip_preflight = 7;
}

// StartGoalResult.
message StartGoalResult {
  fleet.type.v1.PaneKey pane = 1;
  TmuxSession session = 2;
  bool reused_session = 3;
  // Worktree path when the agent ensured one.
  string worktree_path = 4;
  // First GoalState observed after typing the goal command.
  GoalState goal = 5;
}

// EnsureWorktree (H2). Declarative: existing worktree on the same branch is
// OK; a different branch at that path is WORKTREE_EXISTS.
message EnsureWorktree {
  fleet.type.v1.RepoRef repo = 1;
  fleet.type.v1.GoalId goal_id = 2;
  string branch = 3;
  // Base ref for a new branch; empty = default branch.
  string base_ref = 4;
  // Relative path under the checkout; empty = agent default.
  string relative_path = 5;
}

// EnsureWorktreeResult.
message EnsureWorktreeResult {
  string path = 1;
  bool created = 2;
  BranchState branch = 3;
}

// PruneWorktree (H2): remove a goal worktree after merge and grace.
// WORKTREE_DIRTY unless allow_dirty, which needs ROLE_OWNER.
message PruneWorktree {
  fleet.type.v1.RepoRef repo = 1;
  fleet.type.v1.GoalId goal_id = 2;
  string path = 3;
  bool allow_dirty = 4;
  // Also delete the local branch.
  bool delete_branch = 5;
}

// EnsureGoalHooks (G1): install and verify the generic goal-protocol hooks
// for a harness in a checkout. Leaves repos that ship their own alone.
message EnsureGoalHooks {
  fleet.type.v1.Harness harness = 1;
  fleet.type.v1.Workdir workdir = 2;
  // Hook version the hub expects; the agent reports what it has.
  string expected_version = 3;
}

// ===== J. Attach, K. logs, M. drain =====

// OpenAttach (J1): open a Terminal stream for a PTY client attached through
// a grouped view session. Needs ROLE_VIEWER (read-only) or OPERATOR.
message OpenAttach {
  fleet.type.v1.AttachId attach_id = 1;
  SessionTarget session = 2;
  uint32 cols = 3;
  uint32 rows = 4;
  // Hub drops input for viewers; the agent also enforces it.
  bool read_only = 5;
}

// OpenAttachResult.
message OpenAttachResult {
  // Grouped view session created for this attach.
  string view_session_name = 1;
}

// CloseAttach (J1).
message CloseAttach {
  fleet.type.v1.AttachId attach_id = 1;
}

// SetLogCapture (K1): turn pipe-pane capture on or off for a developer's
// own session (goal panes are always captured).
message SetLogCapture {
  SessionTarget session = 1;
  bool enabled = 2;
}

// SetLogShipping (K2): pause or resume shipping (for example hub disk low).
// Capture continues into the spool while paused.
message SetLogShipping {
  bool paused = 1;
  string reason = 2;
}

// Drain (M4): finish current work, take nothing new. Never kills.
message Drain {
  string reason = 1;
}

// Undrain (M4). A local `fleet-agent drain` cannot be undone from the hub;
// the agent answers REJECTED_BY_POLICY with reason DRAINING.
message Undrain {}
