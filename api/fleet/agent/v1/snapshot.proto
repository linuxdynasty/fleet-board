// fleet.agent.v1 snapshot: machine facts, inventories, settings and the full
// Snapshot the agent sends on every connect (A3). A snapshot supersedes
// every event with a lower seq. Fields observed from tmux, harnesses, goal
// files or git are UNTRUSTED TEXT.
syntax = "proto3";

package fleet.agent.v1;

import "fleet/agent/v1/screen.proto";
import "fleet/agent/v1/usage.proto";
import "fleet/type/v1/harness.proto";
import "fleet/type/v1/ids.proto";
import "fleet/type/v1/settings.proto";
import "fleet/type/v1/principal.proto";
import "fleet/type/v1/status.proto";
import "fleet/type/v1/work.proto";
import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------------------
// B. Machine facts and resources
// ---------------------------------------------------------------------------

// MachineFacts (B1). Sent at Enroll and in every Snapshot.
message MachineFacts {
  string hostname = 1;
  // "darwin" | "linux".
  string os = 2;
  string os_version = 3;
  // "arm64" | "amd64".
  string arch = 4;
  uint32 cpu_count = 5;
  uint64 ram_bytes = 6;
  // IANA timezone, e.g. "America/New_York", used to resolve screen times.
  string timezone = 7;
  int32 utc_offset_seconds = 8;
  string agent_version = 9;
  // Hex digest of the running agent binary, for change display only.
  string agent_binary_hash = 10;
  // tmux version as `tmux -V` prints it; empty if tmux is missing.
  string tmux_version = 11;
  string policy_schema_version = 12;
  // Random id minted at agent process start; changes on restart.
  string boot_id = 13;
  // True if the machine is a container (FLEET_ENROLL_TOKEN boot path).
  bool container = 14;
  // Login user the agent runs as, for the copyable `ssh -t <user>@<host>
  // tmux attach` line (ADR 0018); the hub never connects itself.
  string username = 15;
}

// ResourceSample (B2), every 30 s.
message ResourceSample {
  double load1 = 1;
  double load5 = 2;
  uint64 mem_total_bytes = 3;
  uint64 mem_available_bytes = 4;
  // macOS memory pressure level when available: 1 normal, 2 warn, 4 critical.
  uint32 mem_pressure_level = 5;
  repeated DiskFree disk = 6;
}

// DiskFree is free space under one path the agent cares about.
message DiskFree {
  // Repo root or the agent state directory.
  string path = 1;
  uint64 free_bytes = 2;
  uint64 total_bytes = 3;
}

// PowerState (B3).
message PowerState {
  bool on_battery = 1;
  fleet.type.v1.Percent battery = 2;
}

// ---------------------------------------------------------------------------
// C. Harnesses
// ---------------------------------------------------------------------------

// HarnessInfo (C1) for one harness installed on the machine.
message HarnessInfo {
  fleet.type.v1.Harness harness = 1;
  // Version as the binary reports it. Untrusted text.
  string version = 2;
  // Absolute path resolved through the login shell.
  string path = 3;
  string parser_version = 4;
  // Versions the parsers have fixtures for.
  repeated string supported_versions = 6;
  fleet.type.v1.CommandCatalog catalog = 7;
  fleet.type.v1.GoalHooksState goal_hooks = 8;
  // Send-to-pane is enabled only once prompt detection is verified (E6).
  bool prompt_detection_verified = 9;
  // True when local policy allows launching this harness.
  bool launch_allowed = 10;
  // Harness profile this entry describes; empty = the harness default.
  // One profile per harness for now (ADR 0018); a second profile is a
  // second HarnessInfo with the same harness.
  string profile = 11;
  fleet.type.v1.VersionSupport version_support = 12;
  // Per parser feature, for UNVERIFIED_PARSING: which reads are trusted.
  repeated fleet.type.v1.ParserSupport parser_support = 13;
  // The /goal subcommands this version offers and how pause and resume are
  // done, so the hub never hard-codes a harness name (G4, 01b).
  fleet.type.v1.GoalControl goal_control = 14;
}

// ---------------------------------------------------------------------------
// E. tmux inventory
// ---------------------------------------------------------------------------

// TmuxPane is one pane with its fleet tags and derived state.
message TmuxPane {
  fleet.type.v1.PaneKey key = 1;
  fleet.type.v1.WindowKey window = 2;
  uint32 index = 3;
  bool active = 4;
  // tmux pane_current_command. Untrusted text.
  string current_command = 5;
  // Harness detected from the process, never from the window name.
  fleet.type.v1.Harness harness = 6;
  // Harness session id learned through hooks (E9). Untrusted text.
  string harness_session_id = 7;
  // FLEET_* environment tags: FLEET_SESSION_ID, FLEET_OWNER, FLEET_PANE_KEY,
  // FLEET_GOAL_ID. Empty for the developer's own panes. The environment of a
  // running harness cannot change, so after a pane is reused FLEET_GOAL_ID is
  // missing or the previous goal's: use `goal` below, never this tag.
  map<string, string> fleet_tags = 8;
  bool started_by_fleet = 9;
  fleet.type.v1.Activity activity = 10;
  google.protobuf.Timestamp last_output_time = 11;
  bool dead = 12;
  // Exit status when dead.
  int32 exit_status = 13;
  fleet.type.v1.Availability availability = 14;
  // Terminal log capture (pipe-pane) is on for this pane (K1).
  bool log_capture = 15;
  uint32 cols = 16;
  uint32 rows = 17;
  // Where the pane works, when under an allowed root (repo, checkout, branch,
  // dirty). Reuse of a pane for a goal depends on it (02h, "Reuse").
  fleet.type.v1.PaneWorkdir workdir = 18;
  // Last time a person typed into this pane (02h, "Developer input"). Level
  // fact; PaneInput events carry the changes. Unset = never seen.
  google.protobuf.Timestamp last_input_time = 19;
  // The adapter's ready pattern is on screen now (E7 as a level, not an
  // edge). False while a turn runs, a prompt shows or the harness is not up.
  bool ready_pattern_showing = 20;
  // The goal the agent's registry binds to this pane, empty when none.
  fleet.type.v1.GoalId goal = 21;
}

// TmuxWindow is a window as the status bar shows it.
message TmuxWindow {
  fleet.type.v1.WindowKey key = 1;
  uint32 index = 2;
  // Name as shown. Untrusted text, capped at 256 bytes.
  string name = 3;
  bool automatic_rename = 4;
  bool active = 5;
  repeated TmuxPane panes = 6;
}

// TmuxSession is one session on a server.
message TmuxSession {
  // tmux session id like "$2".
  string tmux_id = 1;
  // Name as shown. Untrusted text, capped at 256 bytes.
  string name = 2;
  // Hub-assigned id from FLEET_SESSION_ID; empty for the developer's own.
  fleet.type.v1.SessionId session_id = 3;
  bool started_by_fleet = 4;
  google.protobuf.Timestamp create_time = 6;
  uint32 attached_clients = 7;
  // True for a grouped view session created for a browser attach (J1).
  bool attach_view = 8;
  repeated TmuxWindow windows = 9;
  // Who started it when started by fleet. The agent knows only what
  // FLEET_OWNER holds (Principal.id) and fills id alone; the hub resolves
  // name, role and kind.
  fleet.type.v1.Principal owner_principal = 10;
  // Created by fleet-board for its own use: a grouped attach-view session
  // (attach_view) or any session on the probe server. The hub never makes a
  // Session of it, never lists its panes (a view shares its windows, and so
  // its PaneKeys, with the real session) and never counts its clients in
  // attached_clients. attached_clients here already excludes the agent's own
  // control client and attach clients.
  bool internal = 11;
}

// TmuxServer is one tmux server the agent observes.
message TmuxServer {
  fleet.type.v1.TmuxServerKind kind = 1;
  string socket_name = 2;
  string server_start_id = 3;
  string version = 4;
  bool running = 5;
  // Control-mode observer attached (E2).
  bool observed = 6;
  repeated TmuxSession sessions = 7;
}

// ---------------------------------------------------------------------------
// G. Goals, H. repositories
// ---------------------------------------------------------------------------

// GoalState (G2): goal line plus HEAD plus dirty, in one message because the
// hub fingerprints them as one state. Fleet panes, and panes where the agent
// found an observed goal (binding OBSERVED, 02h "Observed goals (v1)"). The
// agent emits a new
// event whenever any fingerprinted field changes, watch_alive included: that
// flip is what moves a goal from WAITING to STUCK (03c), so it must not wait
// for the next snapshot.
message GoalState {
  // Hub-assigned for a goal the fleet started. For binding OBSERVED the agent
  // mints it ("obs-" plus a hash, 02h) and the hub adopts it as the Goal id.
  fleet.type.v1.GoalId goal_id = 1;
  fleet.type.v1.PaneKey pane = 2;
  fleet.type.v1.SessionId session_id = 3;
  // First line, control characters stripped, capped at 4 KiB. Untrusted.
  string first_line = 4;
  // The CONSENT: line as written, same treatment. Untrusted.
  string consent_line = 5;
  fleet.type.v1.GoalLineState state = 6;
  // For BLOCKED_WATCH: the pid and whether it is alive. A flip of
  // watch_alive is a state change and emits a GoalState event.
  uint32 watch_pid = 7;
  bool watch_alive = 8;
  // For BLOCKED_OWNER. Untrusted text, each capped at 256 bytes.
  string owner = 9;
  string action = 10;
  string head_commit = 11;
  bool dirty = 12;
  // Path of the goal file relative to the worktree, for display.
  string goal_file = 13;
  google.protobuf.Timestamp observed_time = 14;
  // Directory the goal file lives in (git rev-parse --show-toplevel of the
  // goal file's directory) and its branch, filled for every fleet goal and
  // re-sent when they change. For a REPO_DRIVER goal this is how the hub
  // learns the driver's worktree and branch: Goal.status.branch and the
  // change-request lookup by source_branch key on it. Untrusted text.
  string worktree_path = 15;
  string branch = 16;
  // How the agent tied this goal file to the pane: REGISTRY or ENV for a fleet
  // goal, OBSERVED for a goal the owner started by hand. The hub never sends a
  // command that changes the pane for an OBSERVED goal.
  GoalBindingSource binding = 17;
}

// GoalBindingSource says how the agent bound a goal to a pane.
enum GoalBindingSource {
  GOAL_BINDING_SOURCE_UNSPECIFIED = 0;
  // StartGoal or RegisterGoal wrote the entry before typing the goal.
  GOAL_BINDING_SOURCE_REGISTRY = 1;
  // Rebuilt after state loss from FLEET_GOAL_ID in the pane environment,
  // which only a window the fleet created can have. A reused pane cannot be
  // rebuilt this way: the hub re-sends RegisterGoal (02h).
  GOAL_BINDING_SOURCE_ENV = 2;
  // v1: the agent found a goal file in the checkout of a pane running a known
  // harness that no registry entry names (the owner started the goal by hand).
  // The agent mints the GoalId and keeps the goal in agent.db, never in the
  // registry; the hub shows it and never dispatches, nudges or controls it.
  // Ends on DONE or when the pane exits (02h "Observed goals (v1)", 03k).
  GOAL_BINDING_SOURCE_OBSERVED = 3;
}

// GoalRegistration is one entry of the agent's goal registry, the single
// way a goal is identified on a machine for every harness (ADR 0019). Hooks
// and goal-file attribution ask the registry; FLEET_GOAL_ID is only a fast
// path for a new window. Entries are written by StartGoal (step
// register_goal) or RegisterGoal, and removed on ReleaseGoal, pane exit,
// PruneWorktree or when another goal registers in the same pane.
message GoalRegistration {
  fleet.type.v1.GoalId goal = 1;
  fleet.type.v1.PaneKey pane = 2;
  fleet.type.v1.Harness harness = 3;
  // Worktree or checkout the goal works in. In REPO_DRIVER mode this is the
  // main checkout and is never the hook's match key (a developer's other
  // sessions run there): the match is (pane, harness_session_id), then the
  // goal file.
  string worktree_path = 4;
  // Learned from the first UserPromptSubmit or PreToolUse hook after
  // registration (E9); empty until then. Untrusted text.
  string harness_session_id = 5;
  GoalBindingSource source = 6;
  google.protobuf.Timestamp register_time = 7;
  bool repo_driver = 8;
}

// BranchState (H3) for one goal worktree.
message BranchState {
  fleet.type.v1.RepoRef repo = 1;
  string path = 2;
  fleet.type.v1.GoalId goal_id = 3;
  // Untrusted text.
  string branch = 4;
  string head_commit = 5;
  uint32 ahead = 6;
  uint32 behind = 7;
  bool dirty = 8;
  // Upstream missing or not fetched; ahead/behind then unknown.
  bool upstream_unknown = 9;
  google.protobuf.Timestamp observed_time = 10;
}

// RepoCheckout (H1): one checkout or worktree under an allowed root.
message RepoCheckout {
  fleet.type.v1.RepoRef repo = 1;
  string path = 2;
  string default_branch = 3;
  bool is_worktree = 4;
  // For worktrees, the main checkout they belong to.
  string main_checkout_path = 5;
  // Set when the worktree was created by fleet for a goal.
  fleet.type.v1.GoalId goal_id = 6;
  BranchState branch = 7;
  // Goal-hook state per harness for this checkout (ADR 0018), so the
  // consent form is known before EnsureGoalHooks runs.
  repeated fleet.type.v1.HarnessGoalHooks goal_hooks = 8;
  // Remote that `repo` was derived from: `origin` unless the local policy
  // names another (02h, "Repo identity"). Empty when the checkout has no
  // remote, in which case `repo` is unset and the checkout is never a goal
  // target.
  string remote_name = 9;
  // Every remote of the checkout with its normalized repo, so a fork setup
  // (origin = fork, upstream = the watched repo) is visible. No URLs: they
  // can embed credentials.
  repeated GitRemote remotes = 10;
}

// GitRemote is one git remote reduced to its repo.
message GitRemote {
  // Name as git lists it. Untrusted text.
  string name = 1;
  fleet.type.v1.RepoRef repo = 2;
}

// RepoAccess (H4): the forge CLI's view of the signed-in user's access to a
// repo (`gh repo view --json viewerPermission`, `glab` equivalent).
message RepoAccess {
  fleet.type.v1.RepoRef repo = 1;
  // Normalized: can the signed-in user push to this repo.
  bool push_access = 3;
  google.protobuf.Timestamp checked_time = 4;
  // The permission as the provider names it (GitHub READ..ADMIN, GitLab
  // Guest..Owner). Untrusted text.
  string provider_permission = 5;
}

// ForgeCliStatus (H4): sign-in state of a code host's CLI on this machine
// (`gh auth status`, `glab auth status`). Token lines are dropped and never
// logged.
message ForgeCliStatus {
  // "gh", "glab", ...
  string tool = 1;
  fleet.type.v1.ProviderKind provider = 2;
  // Code host this status is for ("github.com", "gitlab.acme.dev").
  string host = 3;
  bool signed_in = 4;
  string user = 5;
  repeated RepoAccess access = 6;
  google.protobuf.Timestamp checked_time = 7;
  // Open provider name ("github", "gitlab", "gitea"); provider is a hint.
  string provider_name = 8;
}

// ---------------------------------------------------------------------------
// K, L, M. Spool, policy, drain
// ---------------------------------------------------------------------------

// SpoolStatus (K2): local session-log spool.
message SpoolStatus {
  uint64 pending_bytes = 1;
  uint64 cap_bytes = 2;
  // Chunks dropped because the cap was hit; gaps are marked in LogChunk.
  uint32 gap_marks = 3;
  bool shipping_paused = 4;
  // Set when the hub paused shipping; empty when paused locally.
  string paused_reason = 5;
  uint32 sessions_capturing = 6;
}

// PolicyInfo (L1): the local policy file. Hash only, never contents.
message PolicyInfo {
  // Empty only when there is no file to read: the normal first run of a fresh
  // agent, built-in defaults after the file was deleted, or a file that could
  // not be read (safe_mode); never a way to signal safe mode (use safe_mode).
  string schema_version = 1;
  string hash = 2;
  google.protobuf.Timestamp loaded_time = 3;
  // True when the file changed on disk since load; takes effect on restart.
  bool changed_since_load = 4;
  // The file is invalid, so the agent started in safe mode: observe only,
  // every control command REJECTED_BY_POLICY / POLICY_SAFE_MODE, every hub
  // setting rejected. The hub raises the policy_invalid triage item and the
  // policy.safe_mode audit row from this.
  bool safe_mode = 5;
  // Why the file was refused, one line (the parse error and its line number),
  // never file contents. Capped at 256 bytes; set only with safe_mode.
  string error = 6;
}

// DrainState (M4).
message DrainState {
  bool draining = 1;
  string reason = 3;
  google.protobuf.Timestamp since_time = 4;
  // The hub principal that drained it, or kind LOCAL_USER for a local
  // `fleet-agent drain` (which the hub cannot undo).
  fleet.type.v1.Principal requested_by_principal = 5;
}

// ---------------------------------------------------------------------------
// The Snapshot
// ---------------------------------------------------------------------------

// Snapshot (A3) is the full level-triggered state of the machine. Sent after
// Hello on every connect and on SnapshotRequest. It supersedes every event
// with seq <= Snapshot.seq. Size: typically 10-100 KiB; one part is capped at
// 960 KiB (the message cap is 1 MiB). A larger snapshot is sent in parts that
// share snapshot_id and seq (hub capability "snapshot.parts"); the hub applies
// it only when every part arrived. Parts split whole tmux servers, sessions
// or list entries, never a pane. ShownUsage.raw_screen is always omitted here.
message Snapshot {
  // Agent event sequence at the moment of the snapshot.
  uint64 seq = 1;
  google.protobuf.Timestamp taken_time = 2;
  MachineFacts facts = 3;
  ResourceSample resources = 4;
  PowerState power = 5;
  repeated HarnessInfo harnesses = 6;
  repeated AccountIdentity accounts = 7;
  repeated TmuxServer tmux_servers = 8;
  repeated GoalState goals = 9;
  repeated RepoCheckout repos = 10;
  // Latest reading per account key.
  repeated UsageReading usage = 12;
  repeated ProbeHealth probes = 13;
  repeated SessionAccountLink account_links = 14;
  SpoolStatus spool = 15;
  PolicyInfo policy = 16;
  fleet.type.v1.EffectiveSettings settings = 17;
  DrainState drain = 18;
  // Attaches the agent still holds open (J1).
  repeated fleet.type.v1.AttachId open_attaches = 19;
  // Last hub command seq the agent applied, in the epoch Hello.last_epoch
  // named: at snapshot time the agent still holds the previous connection's
  // values, and the new HelloAck.epoch has not applied any command yet.
  uint64 last_applied_command_seq = 20;
  // Command ids whose results the hub never acknowledged; the results
  // themselves follow as CommandResult messages right after the snapshot.
  repeated fleet.type.v1.CommandId unacked_results = 21;
  // One per code-host CLI found on the machine (H4): gh, glab, ...
  repeated ForgeCliStatus forge_cli = 22;
  // Prompts and harness conditions on screen now (ADR 0018), so Triage
  // is rebuilt at once after a reconnect even when the ring was trimmed.
  repeated PromptDetected prompts = 23;
  repeated HarnessCondition conditions = 24;
  // The goal registry, complete, so the hub finds a lost or stale entry and
  // re-sends RegisterGoal or ReleaseGoal (02h, "Goal registry").
  repeated GoalRegistration goal_registry = 28;
  // Agent-minted id shared by every part of one snapshot.
  string snapshot_id = 25;
  // 0-based part number and the total; part_count 0 or 1 = not split.
  uint32 part_index = 26;
  uint32 part_count = 27;
}
