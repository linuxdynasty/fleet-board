# golangci-lint v2 (the pinned build, see tool-versions.env). The v2 defaults
# (errcheck, govet, ineffassign, staticcheck, unused) plus linters that catch
# real mistakes in this code base: leaked bodies, rows and spans, calls without
# a context, unchecked type assertions, loose slog calls, and gosec's security
# smells. Not gocritic, unparam, prealloc or perfsprint (epic #107).
# Fix the code first. A //nolint names one linter and says why (nolintlint).
# gosec has no global excludes: each false positive carries its own
# `//nolint:gosec // G304: <concrete reason>`. Known vulnerabilities in
# dependencies and the standard library are `make vuln` (govulncheck).
version: "2"

linters:
  default: standard
  enable:
    - bodyclose # an HTTP response body is always closed
    - depguard # only internal/proc, the tmux client and the attach PTY import os/exec (01 principle 8)
    - durationcheck # no time.Duration multiplied by another Duration
    - errchkjson # json.Marshal errors are checked, or provably impossible
    - errorlint # %w and errors.Is/As, never == on errors (fleet-go: wrap errors)
    - exhaustive # a switch on an enum names every value or has a default
    - forbidigo # only internal/proc starts a process without os/exec (01 principle 8)
    - forcetypeassert # x.(T) always uses the two-value form
    - gosec # security smells: file paths, permissions, integer overflow
    - makezero # no append to a slice made with a non-zero length
    - misspell
    - nilerr # never return nil after checking err != nil
    - noctx # network and exec calls take a context.Context
    - nolintlint
    - protogetter # proto fields read through getters (nil-safe)
    - reassign # no reassignment of another package's variables
    - rowserrcheck # sql.Rows.Err is checked after the loop
    - sloglint # slog calls: static message, key-value pairs only
    - spancheck # every OpenTelemetry span is ended and records its error
    - sqlclosecheck # sql.Rows and sql.Stmt are closed
    - thelper # test helpers call t.Helper() first
    - unconvert
    - usestdlibvars
    - usetesting # t.Context, t.TempDir, t.Setenv in tests, not the os ones
  settings:
    depguard:
      rules:
        # One helper starts every one-shot child (01 principle 8, plan row 2c):
        # empty stdin, a time cap, an output cap, a process group of its own.
        # Allowed to import os/exec (and its wrapper x/sys/execabs) in internal/ and cmd/: internal/proc, the
        # internal/agent/tmux package itself (the `tmux -C` client; not its
        # subpackages) and internal/agent/attach (the PTY, ADR 0020). Test
        # files may import it. "!" turns a pattern into an exception.
        os-exec:
          list-mode: lax
          files:
            - "**/internal/**"
            - "**/cmd/**"
            - "!$test"
            - "!**/internal/proc/*.go"
            - "!**/internal/agent/tmux/*.go"
            - "!**/internal/agent/attach/*.go"
          deny:
            - pkg: os/exec
              desc: start a one-shot child with internal/proc, which bounds it (01 principle 8); only internal/proc, internal/agent/tmux and internal/agent/attach import os/exec
            - pkg: golang.org/x/sys/execabs
              desc: execabs starts processes the way os/exec does; the same rule applies (01 principle 8)
    exhaustive:
      default-signifies-exhaustive: true
    nolintlint:
      require-explanation: true
      require-specific: true
    forbidigo:
      # With type analysis the patterns match through an import alias too.
      analyze-types: true
      forbid:
        - pattern: ^os\.StartProcess$
          msg: start a one-shot child with internal/proc (01 principle 8)
        - pattern: ^syscall\.(ForkExec|Exec|StartProcess)$
          msg: start a one-shot child with internal/proc (01 principle 8)
        - pattern: ^unix\.Exec$
          msg: start a one-shot child with internal/proc (01 principle 8)
    sloglint:
      static-msg: true
      no-mixed-args: true
      kv-only: true
  exclusions:
    # Generated code (gen/) is never linted or edited by hand.
    generated: strict
    rules:
      # internal/proc itself (its own files, not a subfolder) is the one place that may start a process.
      - path: ^internal/proc/[^/]+$
        linters:
          - forbidigo

run:
  timeout: 5m
